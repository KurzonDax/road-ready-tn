<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Ready TN</title>
<meta name="theme-color" content="#0d1317">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Road Ready">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Self-hosted font, Latin subset (see src/fonts/README.md): Atkinson Hyperlegible Next, one variable file for 200 to 800. */
@font-face { font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 200 800; font-display: swap; src: url("fonts/atkinson-hyperlegible-next/atkinson-hyperlegible-next-variable.woff2") format("woff2"); }
/* Night route: turn-by-turn navigation at night. One blue banner holds the one thing to do, a dark map
   shows how far the Learner has come, and dark sheets hold the rest (.impeccable/surfaces/src-app-html.md). */
:root {
  /* Dark on every device, whatever its own setting. A blue-black night map, slate sheets, route blue for
     the Learner (his place, his car, his path), and a deep banner blue for the one thing to do. */
  --bg: #0d1317;
  --map-grid: #151e25;
  --map-road: #19242c;
  --map-water: #0c1924;
  --surface: #172027;
  --surface-2: #1f2a33;
  --edge: #26323c;
  --ink: #eef2f5;
  --muted: #9babb8;
  --line: #2a3640;
  --control-line: #3a4753;
  --banner: #1a58c2;
  --banner-2: #2467d8;
  --banner-ink: #ffffff;
  --banner-btn-ink: #0e3a85;
  --guide: #4c98ff;
  --guide-case: #0f2f63;
  --guide-light: #a9cdff;
  --guide-ink: #071a36;
  --guide-soft: #16263d;
  /* Results: green means correct, red means incorrect. Nothing else uses these two. */
  --good: #5fd08a;
  --good-ink: #0c1f13;
  --good-soft: #16291f;
  --bad: #f27c6b;
  --bad-ink: #2a0f0b;
  --bad-soft: #33201e;
  --focus: #ffd479;
  /* The lesson drawings: road surfaces and markings, cars, glass. Lane lines keep their real colors. */
  --scene: #111920;
  --road: #28333c;
  --road-edge: #a3b0bb;
  --lane-yellow: #e7b442;
  --lane-white: #e6e9ec;
  --car-a: #a3aeb8;
  --car-b: #687480;
  --glass: #22303b;
  --font-display: "Atkinson Hyperlegible Next", Verdana, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", Verdana, system-ui, sans-serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); scrollbar-color: var(--control-line) var(--bg); }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: var(--gutter);
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
}
::selection { background: var(--guide); color: var(--guide-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.wrap > header { align-self: flex-start; }
/* The name, small and quiet over every screen: a route-blue puck and "Road Ready TN". */
.plate { margin: 0; display: flex; align-items: center; gap: 9px; color: var(--muted); font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.plate svg { width: 14px; height: 16px; color: var(--guide); flex: none; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h1 { font-size: clamp(34px, 9vw, 44px); letter-spacing: -.03em; }
h2 { font-size: clamp(24px, 6vw, 30px); }
.theme { font-size: 19px; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.small { font-size: 15px; }
.home { display: flex; flex-direction: column; gap: 14px; }

/* The home screen's one thing to do: a navigation banner in deep route blue, with a white button. */
.mv { position: relative; z-index: 2; border-radius: 26px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px;
  background: linear-gradient(180deg, var(--banner-2), var(--banner)); color: var(--banner-ink);
  box-shadow: 0 18px 40px -16px rgb(0 0 0 / .85), inset 0 1px 0 rgb(255 255 255 / .16); }
.mv h1 { font-size: clamp(38px, 10.4vw, 46px); }
.mv .sub, .mv .theme, .mv p { color: rgb(255 255 255 / .88); }
.mv .btn, .mv .btn.primary { background: var(--banner-ink); border-color: var(--banner-ink); color: var(--banner-btn-ink); box-shadow: 0 10px 24px -12px rgb(0 0 0 / .7); }
.mv .link { color: rgb(255 255 255 / .86); text-decoration-color: rgb(255 255 255 / .45); }
/* What comes after it: a dark card, tucked under the banner like the next turn. */
.later { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge), 0 14px 30px -18px rgb(0 0 0 / .9); }
.mv + .later { margin: -32px 12px 0; padding-top: 36px; border-radius: 0 0 22px 22px; }
.later h2 { font-size: 22px; letter-spacing: -.015em; }
.later .theme { color: var(--muted); font-size: 17px; margin-top: -8px; }
.later .btn { min-height: 52px; padding: 12px 16px; font-size: 17px; }

/* The practice quiz at a glance: one tile per fact asked. */
.strip-wrap { display: flex; flex-direction: column; gap: 10px; }
.strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 7px; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.tile svg { width: 23px; height: 23px; }
.tile.got { background: var(--good); color: var(--good-ink); }
.tile.back { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
.tile.mini { width: 22px; height: 22px; border-radius: 7px; flex: none; }
.tile.mini.back { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tile.mini svg { width: 14px; height: 14px; }
.strip-key { margin: 0; font-size: 15px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; }
.key-item { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .strip .tile { animation: land 420ms cubic-bezier(.16, 1, .3, 1) calc(var(--k) * 70ms) both; }
  @keyframes land { from { opacity: 0; transform: translateY(6px) scale(.9); } to { opacity: 1; transform: none; } }
}
/* The route: the 120 facts as a road on a night map, from Start to Practice tests, marked off into the
   12 Sections. Learned is solid route blue, still ahead a broken line, so it reads without color. */
.route { display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); }
.route-map { display: block; width: 100%; height: clamp(240px, 72vw, 320px); background: var(--bg); }
.route-head { order: 1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px 16px; font-weight: 700; }
.route-count { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m-label { font-family: var(--font-body); font-weight: 700; font-size: 14px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.m-label.open { fill: var(--guide); }
@media (prefers-reduced-motion: no-preference) {
  .m-gain { animation: grow 1100ms cubic-bezier(.16, 1, .3, 1) 250ms both; }
  @keyframes grow { from { stroke-dashoffset: var(--from); } to { stroke-dashoffset: 0; } }
}
/* On the home screen the map runs edge to edge on a phone, and the count opens the sheet under it. */
.start > .route { background: none; box-shadow: none; border-radius: 0; overflow: visible; }
.start > .mv + .route, .start > .later + .route { margin-top: -40px; }
.start > .route .route-map { border-radius: 22px; }
.start > .route .route-head { position: relative; margin-top: -26px; border-radius: 28px 28px 0 0; padding: 20px 20px 6px; background: var(--surface); box-shadow: 0 -16px 36px -12px rgb(0 0 0 / .7), inset 0 1px 0 var(--edge); }
.sheet { background: var(--surface); border-radius: 0 0 22px 22px; padding: 0 20px 18px; margin-top: -14px; display: flex; flex-direction: column; }
@media (max-width: 699px) {
  .start > .route .route-map { width: auto; margin: 0 calc(-1 * var(--gutter)); border-radius: 0; }
  .start > .route .route-head, .sheet { margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter)); }
  .sheet { border-radius: 0; margin-bottom: calc(-1 * max(48px, env(safe-area-inset-bottom, 0px))); padding-bottom: max(48px, env(safe-area-inset-bottom, 0px)); }
}

.scores { border-top: 1px solid var(--line); }
.scores > summary, .missed > summary { font-weight: 700; color: var(--ink); cursor: pointer; padding: 14px 0; min-height: 52px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.scores > summary::-webkit-details-marker, .missed > summary::-webkit-details-marker { display: none; }
.scores > summary::after, .missed > summary::after { content: ""; width: 9px; height: 9px; margin-right: 6px; border-right: 2.4px solid var(--muted); border-bottom: 2.4px solid var(--muted); transform: rotate(-45deg); transition: transform 200ms cubic-bezier(.16, 1, .3, 1); }
.scores[open] > summary::after, .missed[open] > summary::after { transform: rotate(45deg); }
.scores ul { list-style: none; margin: 0; padding: 0 0 6px; display: flex; flex-direction: column; }
.scores li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.scores li > div { display: flex; flex-direction: column; min-width: 0; flex: 1 1 14rem; }
.scores .sname { font-weight: 700; }
.scores .sscore { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.lessons li { padding: 0; }
.sec { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; width: 100%; min-height: 56px; padding: 10px 0; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; }
.sec::after { content: ""; flex: none; width: 8px; height: 8px; margin: 0 8px 0 auto; border-right: 2.4px solid var(--muted); border-bottom: 2.4px solid var(--muted); transform: rotate(-45deg); }
.sec:hover .sec-t { text-decoration: underline; text-decoration-color: var(--control-line); text-underline-offset: 4px; }
.sec-n { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1.5px var(--control-line); }
.sec.done .sec-n { background: var(--good); color: var(--good-ink); box-shadow: none; }
.sec-n svg { width: 18px; height: 18px; }

.btn { font: inherit; font-weight: 800; font-size: 19px; letter-spacing: -.005em; padding: 16px 18px; min-height: 58px; border-radius: 16px; cursor: pointer; border: 0; background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--control-line); width: 100%; transition: filter 160ms ease-out, transform 160ms ease-out; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--banner); color: var(--banner-ink); box-shadow: 0 12px 24px -12px rgb(0 0 0 / .8), inset 0 1px 0 rgb(255 255 255 / .18); }
.btn.slim { width: auto; font-size: 16px; padding: 10px 14px; min-height: 44px; border-radius: 12px; }
.link { font: inherit; font-size: 16px; background: none; border: 0; color: var(--muted); text-decoration: underline; text-decoration-color: var(--control-line); text-underline-offset: 4px; cursor: pointer; padding: 10px 8px; min-height: 44px; align-self: center; }
.link:hover { color: var(--ink); }
.fine { font-size: 14.5px; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 14px; }
.fine p { margin: 0; }
.fine .link { font-size: 15px; padding: 10px 0; margin-top: 4px; }

/* Sign-in: one short form on a sheet, labels above their fields. */
.signin { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-weight: 700; }
.field input { font: inherit; font-size: 19px; padding: 12px 14px; min-height: 54px; border-radius: 14px; border: 0; box-shadow: inset 0 0 0 1.5px var(--control-line); background: var(--surface); color: var(--ink); caret-color: var(--guide); width: 100%; }
.field input:focus-visible { outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 17px; cursor: pointer; align-self: flex-start; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--guide); }
#signInMsg:empty { display: none; }
.warn { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--bad-soft); color: var(--ink); font-size: 16px; }

/* Over every question: where the Learner is, and one segment per question, filled as they are answered. */
.progress { display: flex; flex-direction: column; gap: 11px; padding: 14px 18px 16px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; font-weight: 700; }
.progress b { color: var(--ink); font-weight: 800; }
.segs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.segs i { height: 6px; border-radius: 3px; background: var(--line); }
.segs i.d { background: var(--guide); }
/* The question on screen: a broken route line, the same form as the road still ahead on the map. */
.segs i.c { background: linear-gradient(90deg, var(--guide) 0 3px, transparent 3px) 0 0 / 7px 100% repeat-x; }

.card { display: flex; flex-direction: column; gap: 16px; padding: 4px 2px 0; }
.q { font-family: var(--font-body); font-size: clamp(21px, 5vw, 24px); font-weight: 700; line-height: 1.36; letter-spacing: -.005em; margin: 0; text-wrap: pretty; }
/* Once answered, the question steps back under the result. */
.q.asked { font-size: 18px; color: var(--muted); line-height: 1.4; }
.visual { display: flex; justify-content: center; }
.visual svg { width: 110px; height: 110px; max-width: 100%; }
.options { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.opt { font: inherit; font-size: 18px; line-height: 1.35; text-align: left; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 0; box-shadow: inset 0 0 0 1.5px var(--control-line); background: var(--surface); color: var(--ink); margin: 0; }
button.opt { cursor: pointer; transition: box-shadow 160ms ease-out, background-color 160ms ease-out; }
button.opt:hover { box-shadow: inset 0 0 0 2px var(--guide); background: var(--surface-2); }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--control-line); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--muted); }
.opt .otext { display: flex; flex-direction: column; gap: 2px; padding-top: 1px; }
.opt .tag { font-size: 15px; font-weight: 800; }
.opt.rest { box-shadow: inset 0 0 0 1.5px var(--line); background: transparent; color: var(--muted); }
.opt.right { box-shadow: inset 0 0 0 2px var(--good); background: var(--good-soft); font-weight: 700; }
.opt.right .key { background: var(--good); box-shadow: none; color: var(--good-ink); }
.opt.right .tag { color: var(--good); }
/* A wrong pick is marked in red by its border and key; the correct answer in green. */
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.opt.wrong .key { box-shadow: inset 0 0 0 2px var(--bad); color: var(--bad); }
.opt.wrong .tag { color: var(--bad); }
.feedback { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.result { display: flex; flex-direction: column; gap: 6px; }
.facts { margin: 0; }
.why, .also, .picked { margin: 0; }
/* After an answer, the result leads the screen: green when correct, red when not, with its mark. */
.outcome { font-family: var(--font-display); font-size: clamp(22px, 5.4vw, 28px); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin: 0; display: flex; align-items: flex-start; gap: 12px; }
.outcome.good { color: var(--good); }
.outcome.not { color: var(--bad); }
.outcome .dot { flex: none; width: 32px; height: 32px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; }
.outcome .dot svg { width: 19px; height: 19px; }
.outcome.good .dot { background: var(--good); color: var(--good-ink); }
.outcome.not .dot { background: var(--bad); color: var(--bad-ink); }
/* "The answer is: …" states the correct answer, so its words stay in ink and only the mark is red. */
#outcome.not, #ruleHead.not { color: var(--ink); }
/* Compare: one row per fact, the fact (and its picture) beside what it means. */
.compare { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.compare li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.compare .cfact { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.compare .cpic { display: block; line-height: 0; }
.compare .cpic svg { width: 48px; height: 48px; }
.rulehead { font-family: var(--font-body); font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--muted); }
.rule { font-size: 20px; line-height: 1.45; margin: 0; }
.back { margin: 0; color: var(--muted); }
.visual .scene, .scene { display: block; width: 100%; height: auto; max-width: 440px; margin: 0 auto; background: var(--scene); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--edge); }
/* Labels keep a thin dark edge, so a tap ring or a line under them never crosses the letters. */
.k-label { font-family: var(--font-body); font-weight: 700; font-size: 11px; fill: #c3ced7; paint-order: stroke; stroke: var(--scene); stroke-width: 4px; stroke-linejoin: round; }
.k-sign { font-family: var(--font-display); font-weight: 800; font-size: 5px; fill: #fff; }
.k-plate { font-family: var(--font-display); font-weight: 800; font-size: 4px; fill: #c8323a; }
.k-edge { stroke: var(--road-edge); stroke-width: 2; }
.k-yellow { stroke: var(--lane-yellow); stroke-width: 3; }
.k-white { stroke: var(--lane-white); stroke-width: 3; }
.k-you .k-body { stroke: var(--guide); stroke-width: 2.8; }
.k-hi .k-body, .k-target .k-hi .k-body { stroke: var(--good); stroke-width: 3.5; }
.k-ring { fill: var(--good); opacity: .28; }
.k-no { fill: none; stroke: var(--bad); stroke-width: 2; }
.k-lane { fill: transparent; stroke: var(--guide); stroke-width: 2; stroke-dasharray: 6 5; }
.k-seat { fill: transparent; }
.k-badge circle { stroke: var(--bg); stroke-width: 2; }
.k-badge.k-yes circle { fill: var(--good); }
.k-badge.k-yes path { stroke: var(--good-ink); }
.k-badge.k-not circle { fill: var(--bad); }
.k-badge.k-not path { stroke: var(--bad-soft); }
@media (prefers-reduced-motion: no-preference) {
  .k-ring, .k-no, .k-badge { animation: settle 420ms cubic-bezier(.16, 1, .3, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes settle { from { opacity: 0; transform: scale(.7); } }
  .k-ring { animation-fill-mode: forwards; }
}
.k-target { cursor: pointer; }
/* What can be tapped wears a thin resting ring, neither green nor red, until the question is answered. */
.k-tap { fill: rgb(76 152 255 / .07); stroke: var(--ink); stroke-opacity: .45; stroke-width: 1.5; }
.k-target:focus { outline: none; }
.k-target:focus-visible .k-body, .k-target:hover .k-body { stroke: var(--focus); stroke-width: 3.5; }
/* Your path is drawn the way a navigation app draws your turn: route blue on a dark casing. */
.k-path-case { stroke: var(--guide-case); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.k-path { stroke: var(--guide); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.k-path-dots { stroke: #d6e7ff; stroke-width: 1.5; stroke-dasharray: 1 8; stroke-linecap: round; fill: none; }
.k-measure { stroke: var(--ink); stroke-width: 1.5; }
/* Only cars, pedestrians and road signs are tappable; nothing drawn over them catches the tap. */
.scene :not(.k-target):not(.k-target *) { pointer-events: none; }
.k-target, .k-target * { pointer-events: auto; }
@media (prefers-reduced-motion: no-preference) { .k-flash { animation: blink 1s steps(2, start) infinite; } @keyframes blink { to { opacity: .15; } } }
/* After acting: the result line, the drawing, one sentence. The line and the drawing's rings say the same thing. */
.card.step.acted { gap: 14px; }
.say { font-size: 19px; line-height: 1.5; margin: 0; text-wrap: pretty; color: #dfe6ec; }
.link.peek { align-self: flex-start; padding-left: 0; }
#nextBtn { position: sticky; bottom: 16px; }

.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 6vw, 30px); line-height: 1.2; margin: 0; font-variant-numeric: tabular-nums; }
.missed { border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); padding: 0 20px; }
.missed ul { list-style: none; margin: 0; padding: 0 0 18px; display: flex; flex-direction: column; gap: 14px; }
.missed li { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.missed p { margin: 0; }
.missed .mq { font-weight: 700; }
.missed .mwhy { color: var(--muted); font-size: 16px; }

/* Ready for the test: the arrival, said in the banner. */
.sign { display: flex; flex-direction: column; gap: 10px; }
.sign h1 { font-size: clamp(38px, 10vw, 52px); }
.sign p { margin: 0; font-size: 20px; }

.stopped { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: var(--surface-2); }
.mv .stopped { background: rgb(4 18 48 / .28); }
.stopped p { margin: 0; }
.streak { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ticks { display: flex; gap: 6px; }
.ticks span { width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 1.5px var(--control-line); background: var(--surface); }
.ticks span.on { background: var(--guide); box-shadow: none; }

/* The Helper's view: a list of Learners, and one Learner's page in plain parts, top to bottom. Long names and answers wrap instead of widening the page. */
.helper, .helper button { overflow-wrap: anywhere; }
.learners { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lrow { font: inherit; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 16px; border: 0; box-shadow: inset 0 0 0 1.5px var(--control-line); background: var(--surface); color: var(--ink); cursor: pointer; }
.lrow:hover { box-shadow: inset 0 0 0 2px var(--guide); }
.lrow .lname { font-weight: 700; font-size: 20px; }
.lrow .lwhen { color: var(--muted); font-size: 16px; }
.link.top { align-self: flex-start; padding-left: 0; }
.helper .now { display: flex; flex-direction: column; gap: 4px; }
.helper .now p, .part p { margin: 0; }
.part { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.part h2 { font-size: 22px; }
.part ul { list-style: none; margin: 0; padding: 0; }
.part > ul > li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.part > ul > li:first-child { border-top: 0; padding-top: 0; }
.sections summary { cursor: pointer; min-height: 44px; }
.sections .sname, .when, .mq { font-weight: 700; }
.sections .sscore { display: block; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.part .sets { padding: 6px 0 4px 22px; font-size: 16px; display: flex; flex-direction: column; gap: 4px; }
.missedmost .mpage, .missedmost .mcount, .facts .mcount { color: var(--muted); font-size: 16px; }
.facts li { padding: 8px 0; border-top: 1px solid var(--line); }
.facts .leech { font-weight: 700; }
/* Managing a Learner: plain buttons at the bottom of their page; each action asks first on a screen of its own. */
.note { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--guide-soft); color: var(--ink); font-size: 16px; }
.btn.bad { box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.btn.bad.primary { background: var(--bad); color: var(--bad-ink); box-shadow: none; }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.field select { font: inherit; font-size: 19px; padding: 12px 14px; min-height: 54px; border-radius: 14px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
#formMsg:empty { display: none; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<div class="wrap">

<script>
// Sign colors are sampled from the drawings on page 36 of the manual.
const SIGNS = {
  octagon: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#ef3d42" stroke="#fff" stroke-width="4"/></svg>',
  triangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="4,10 96,10 50,92" fill="#ef3d42"/><polygon points="20,20 80,20 50,73" fill="#fff"/></svg>',
  circle: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#fadc12" stroke="#231f20" stroke-width="3"/><line x1="22" y1="22" x2="78" y2="78" stroke="#231f20" stroke-width="6"/><line x1="78" y1="22" x2="22" y2="78" stroke="#231f20" stroke-width="6"/></svg>',
  crossbuck: '<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#231f20" stroke-width="3"/></g><g transform="rotate(-45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#231f20" stroke-width="3"/></g></svg>',
  diamond: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 96,50 50,96 4,50" fill="#fbdc10" stroke="#231f20" stroke-width="3"/></svg>',
  rectangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="20" y="6" width="60" height="88" rx="4" fill="#fff" stroke="#231f20" stroke-width="3"/><rect x="30" y="20" width="40" height="6" fill="#231f20"/><rect x="30" y="36" width="40" height="6" fill="#231f20"/><rect x="34" y="56" width="32" height="24" fill="#231f20"/></svg>',
  swatch: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="80" height="56" rx="6" fill="${c}" stroke="#555" stroke-width="2"/></svg>`
};
let DAYS = [], QS = [], TOTAL_DAYS = 0, BY_ID = {}; // filled from questions.json when the page starts
let GROUPS = [], GROUP_BY_ID = {}; // the groups of easily mixed-up facts (data/groups.json), likewise
// Each fact's wordings, from questions.json: its own question first, then the other wordings in id order.
let WORDINGS = {};
let LESSONS = {}, LESSON_STEP = {}; // lessons by Section (data/lessons), and each fact's first lesson step {section, k}
// The learning engine (docs/specs/learning-engine.md, docs/adr/0002-*). Every rule below reads these.
const HOUR = 60 * 60 * 1000;
const FIRST_LOOK = true;          // a new fact starts with an unscored question; false starts with its rule screen
const COUNTED_TARGET = 10;        // counted questions in a practice quiz, at most
const NEW_PER_SET = 5;            // new facts in a practice quiz, at most
const MIN_SET = 5;                // a quiz with fewer counted questions is filled with not-yet-due facts (GAP + 1)
const GAP = 4;                    // screens for other facts between a fact's rule screen and its counted question, at least
const RE_ASK_GAP = 3;             // question screens for other facts between a wrong counted answer and its re-ask
const RE_ASK_CAP = 4;             // re-asks in one practice quiz, at most
const SPACING_MS = 12 * HOUR;     // two right answers count as separate successes only this far apart
const LADDER_MS = [12 * HOUR, 48 * HOUR]; // after the first and second spaced success, how long until due again; after the third, never
const LEECH_WRONG = 6;            // wrong counted answers after which the Helper's view flags the fact
const TEST_LEN = 30, READY_SCORE = 27, READY_STREAK = 3, PASS_SCORE = 24;
// The device copy of the signed-in Learner, saved under `rrtn-learner-<account id>`:
// {records: what the server last handed back, pending: finished Sets not yet stored on the
// server, unfinished: the Set on screen, so leaving the page doesn't lose answers, rejected:
// records the server refused as badly shaped, kept aside so they don't hold back the others}.
let copy = null, copyFor = null; // the copy, and the account id it belongs to
const copyKey = id => `rrtn-learner-${id}`;
// The saved state from before accounts. The page only reads it, for the one-time import; it never writes or deletes it.
const OLD_KEY = 'tn-permit-daily-v1';
// Set once this device has made an Imported record. It belongs to the device, not to a Learner, so
// it outlasts sign-out and only the first Learner to sign in here gets the import (decision #7).
const IMPORTED_KEY = 'rrtn-old-progress-imported';
const canSave = (() => { try { localStorage.setItem('rrtn-check', '1'); localStorage.removeItem('rrtn-check'); return true; } catch (e) { return false; } })();
function readCopy(id) {
  try {
    const c = JSON.parse(localStorage.getItem(copyKey(id)));
    if (c && Array.isArray(c.records) && Array.isArray(c.pending)) {
      return { records: c.records, pending: c.pending, unfinished: c.unfinished || null,
        rejected: Array.isArray(c.rejected) ? c.rejected : [] };

}
function saveCopy() { try { localStorage.setItem(copyKey(copyFor), JSON.stringify(copy)); } catch (e) {} }
const copyRecords = () => copy.records.concat(copy.pending);
// S is the Learner's Progress (see progressFrom), worked out from every record in the copy, sent
// or waiting, plus `run`: the unfinished Set as saved.
let S = null;
function workOut() { S = Object.assign(progressFrom(copyRecords()), { run: copy.unfinished }); }
let run = null; // the practice quiz or test on screen

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// These read the signed-in Learner's Progress `S`, or another Progress passed in (the Helper's view).
function streak(p = S) { let n = 0; for (let i = p.tests.length - 1; i >= 0 && p.tests[i] >= READY_SCORE; i--) n++; return n; }
const ready = (p = S) => streak(p) >= READY_STREAK;

// A fact's standing, from its counted answers: new (none), seen (no spaced success yet), learned
// (one or two), solid (three or more). Standings only rise; a wrong answer makes the fact due instead.
function standing(f) {
  if (!f.asked) return 'new';
  return f.spacedRights === 0 ? 'seen' : isSolid(f) ? 'solid' : 'learned';
}
const isLearned = f => f.spacedRights > 0; // learned or solid
const isSolid = f => f.spacedRights >= 3;
// When a fact that is not new is due again: at once after a wrong newest answer, else up the ladder. A solid
// fact (three spaced successes) is finished and never due on its own (ADR 0002, amended 2026-10-19).
function dueAt(f) {
  if (!f.lastRight) return -Infinity;
  return isSolid(f) ? Infinity : f.lastAt + LADDER_MS[f.spacedRights - 1];
}
const isDue = (f, now) => f.asked > 0 && dueAt(f) <= now;
// The ids of the facts due at `now`, in the order a Set takes them: wrong last (oldest first), then learned,
// then solid (earliest due first); ties in the order of sections.json.
function dueFacts(p, now) {
  const rank = f => !f.lastRight ? 0 : isSolid(f) ? 2 : 1;
  const key = f => !f.lastRight ? f.lastAt : dueAt(f);
  return QS.map(q => q.id).filter(id => isDue(p.facts[id], now)) // sort is stable, so ties keep QS order
    .sort((a, b) => rank(p.facts[a]) - rank(p.facts[b]) || key(p.facts[a]) - key(p.facts[b]));
}
const learnedCount = (p = S) => QS.filter(q => isLearned(p.facts[q.id])).length;
const solidCount = (p = S) => QS.filter(q => isSolid(p.facts[q.id])).length;
const sectionFacts = (p, day) => QS.filter(q => q.day === day).map(q => p.facts[q.id]);
const sectionDone = (p, day) => sectionFacts(p, day).every(isLearned);
const unlocked = (p = S) => p.unlockMove || QS.every(q => isLearned(p.facts[q.id]));
// Sections in the order new facts come from them: the Section cursor first, then on round to the one before it.
const cursorOrder = p => DAYS.map((_, k) => (p.cursor - 1 + k) % TOTAL_DAYS + 1);

// Progress is worked out from a Learner's records (docs/adr/0001-*); it is never saved itself.
// Records are ordered by finish time, then by the server's arrival number (seq). A record still
// waiting on the device has no seq and sorts after the sent ones with the same time.
const recordTime = r => { const t = Date.parse(r.at); return Number.isNaN(t) ? 0 : t; };
function orderRecords(records) {
  return records.slice().sort((a, b) => recordTime(a) - recordTime(b) ||
    (a.seq === undefined ? Infinity : a.seq) - (b.seq === undefined ? Infinity : b.seq) || 0);
}
// The id of the latest Reset, or null when there has been none.
function currentReset(records) {
  const resets = orderRecords(records).filter(r => r.kind === 'reset');
  return resets.length ? resets[resets.length - 1].id : null;
}
// The latest Reset or Move record, or null when there has been none.
function latestChange(records) {
  const changes = orderRecords(records).filter(r => r.kind === 'reset' || r.kind === 'move');
  return changes.length ? changes[changes.length - 1] : null;
}
// A Reset or Move drops any unfinished Set (#24). An unfinished Set names the latest Reset or Move
// known when it started (`after`), so one this device kept from before a newer one is dropped too.
// A Set saved without `after` is dropped if a Reset or Move came after it was last saved.
function droppedByChange(u, records) {
  const c = latestChange(records);
  if (u.after === null || typeof u.after === 'string') return u.after !== (c && c.id);
  return c !== null && recordTime(c) > (Date.parse(u.saved_at) || 0);
}
// The records that count toward Progress, in order: those after the latest Reset that name it
// (or, with no Reset, those that name none). The others stay in the History only.
function countedRecords(records) {
  const ordered = orderRecords(records), reset = currentReset(records);
  const from = reset === null ? 0 : ordered.findIndex(r => r.id === reset) + 1;
  return ordered.slice(from).filter(r => r.kind !== 'reset' && r.reset === reset);
}
// An Imported record's old saved state, keeping only fields of the right type: {last, tests}.
// Its `day` and `scores` meant something only to the study loop before the learning engine.
function importedStart(state) {
  const p = { last: {}, tests: [] }, plain = v => v && typeof v === 'object' && !Array.isArray(v);
  if (!plain(state)) return p;
  if (plain(state.last)) for (const [q, right] of Object.entries(state.last)) if (typeof right === 'boolean') p.last[q] = right;
  if (Array.isArray(state.tests)) p.tests = state.tests.filter(n => Number.isInteger(n) && n >= 0);
  return p;
}
// A counted answer changes a fact's standing. A lesson's answers count: a lesson is where a fact is met,
// and its answer is the fact's first counted answer (docs/adr/0003-*), so the fact comes back only when
// the ladder says. First looks and re-asks are stored but never counted; answers from before the
// learning engine have no role and all count.
const isCounted = a => a.role === undefined || a.role === 'counted' || a.role === 'lesson';
// The fact an answer belongs to: the fact its question is a wording of (the 120 questions are their own
// facts), or null for a question no longer shipped.
const factOf = q => BY_ID[q] ? BY_ID[q].fact || q : null;
// One fact's numbers, from its counted answers in time order ({at, right}).
function factFrom(answers) {
  const f = { asked: answers.length, right: 0, wrong: 0, spacedRights: 0, lastAt: null, lastRight: null };
  let lastCounted = -Infinity;
  for (const a of answers) {
    if (a.right) {
      f.right++;
      if (a.at - lastCounted >= SPACING_MS) { f.spacedRights++; lastCounted = a.at; }
    } else f.wrong++;
    f.lastAt = a.at;
    f.lastRight = a.right;
  }
  return f;
}
// A Learner's Progress from their records (docs/adr/0001-*, 0002-*, 0003-*), counting only those after the
// latest Reset: {facts: {id: factFrom()}, answers: {id: [{at, right}]}, tests: [right counts],
// cursor: the Section new facts come from, unlockMove: the latest Move is to 13, sets: practice quizzes so
// far (the Helper's History numbers them), groupAt: {group id: when the newest quiz with that group block
// finished}, byWording: {question id: its counted answers}, lessons: {Section: when its lesson last finished}}.
function progressFrom(records) {
  const answers = Object.fromEntries(QS.map(q => [q.id, []]));
  const p = { facts: {}, answers, tests: [], cursor: 1, unlockMove: false, sets: 0, groupAt: {}, byWording: {}, lessons: {} };
  const add = (q, at, right) => {
    const f = factOf(q);
    if (f) { answers[f].push({ at, right }); p.byWording[q] = (p.byWording[q] || 0) + 1; }
  };
  for (const r of countedRecords(records)) {
    if (r.kind === 'imported') {
      const old = importedStart(r.data.state);
      for (const [q, right] of Object.entries(old.last)) add(q, recordTime(r), right);
      p.tests.push(...old.tests);
    } else if (r.kind === 'move') {
      p.unlockMove = r.data.to > TOTAL_DAYS;
      if (!p.unlockMove) p.cursor = r.data.to;
    } else if (r.kind === 'set') {
      const d = r.data;
      for (const a of d.answers) if (isCounted(a)) add(a.q, answerTime(a), a.right);
      if (d.type === 'test') p.tests.push(d.answers.filter(a => a.right).length);
      if (d.type === 'daily') p.sets++;
      if (d.type === 'lesson') p.lessons[d.section] = Math.max(p.lessons[d.section] ?? -Infinity, recordTime(r));

}

// A group is due for a Compare screen once all its facts are learned and none was answered in the
// last SPACING_MS, so it is recalled after a gap and not minutes after it was taught: the first time,
// and again whenever one of its facts is answered wrong after the newest Set that compared it.
function groupDue(p, g, now) {
  const facts = g.facts.map(f => p.facts[f.id]);
  if (!facts.every(isLearned) || Math.max(...facts.map(f => f.lastAt)) > now - SPACING_MS) return false;
  const last = p.groupAt[g.id];
  return last === undefined || g.facts.some(f => p.answers[f.id].some(a => !a.right && a.at > last));
}
// What the next practice quiz asks, by the spec's steps 1 to 4, and the lesson that comes next: {group: the
// first due group, or null; block: its facts; due; fresh: new facts asked cold; fill: not-yet-due facts added
// to reach MIN_SET; lesson: the Section whose lesson is next, or null}. Each but group and lesson is a list of
// fact ids. A quiz with a group block takes no new facts.
// New facts are those with no answers at all. Walking the Sections in cursor order, the first one with new
// facts whose lesson is not finished is the lesson to offer, and no new fact is taken from it or past it: its
// facts are met in the lesson, whose answers count, so they come back only when the ladder says. New facts
// before it, in a Section with no lesson file, are asked cold with a first look and a rule screen.
function setPlan(p, now) {
  const group = GROUPS.find(g => groupDue(p, g, now)) || null, block = group ? group.facts.map(f => f.id) : [];
  const outside = id => !block.includes(id);
  const room = COUNTED_TARGET - block.length;
  const due = dueFacts(p, now).filter(outside).slice(0, room);
  let fresh = [], lesson = null;
  for (const day of cursorOrder(p)) {
    const unmet = QS.filter(q => q.day === day && !p.facts[q.id].asked).map(q => q.id);
    if (!unmet.length) continue;
    if (LESSONS[day] && p.lessons[day] === undefined) { lesson = day; break; }
    fresh.push(...unmet);
  }
  fresh = block.length ? [] : fresh.slice(0, Math.max(0, Math.min(NEW_PER_SET, room - due.length)));

  // taught minutes ago is asked again. A quiz with first looks may also take facts answered more recently, so
  // that the gap between a rule screen and its counted question always holds.
  let fill = [];

  if (short > 0) {

      .sort((a, b) => p.facts[a.id].lastAt - p.facts[b.id].lastAt).map(q => q.id);
    fill = spare.filter(id => p.facts[id].lastAt <= now - SPACING_MS).slice(0, short);
    if (fill.length < short && fresh.some(id => !taught(p, id))) fill.push(...spare.filter(id => !fill.includes(id)).slice(0, short - fill.length));

}
// Whether there is a practice quiz to take: a group to compare, a fact due, or a new fact asked cold. Fill facts
// alone never make one.
const quizDue = plan => plan.block.length + plan.due.length + plan.fresh.length > 0;
// A group block: the group's Compare screen, then one counted question per fact, shuffled. In a group
// with a reverse stem and 4 or more facts, every second fact that may be reversed is asked the other
// way round: the stem with the fact's answer, and the group's labels as the choices.
function groupBlock(g, p) {
  const reversible = g.reverse !== null && g.facts.length >= 4;
  let n = 0;
  return [{ kind: 'contrast', id: null, group: g.id }, ...shuffle(g.facts).map(f => {
    if (!(reversible && f.reverse !== false && n++ % 2 === 1)) return { kind: 'counted', id: f.id, group: g.id, ...choiceOf(wordingFor(p, f.id)) };
    const others = shuffle(g.facts.filter(o => o !== f)).slice(0, 3).map(o => o.label);
    return { kind: 'counted', id: f.id, q: f.id, group: g.id, format: 'reverse', options: shuffle([f.label, ...others]), chosen: null, at: null };
  })];
}
// A choice question in wording `q`: its own answer and wrong choices, shuffled.
const choiceOf = q => ({ q, format: 'choice', options: shuffle([BY_ID[q].a, ...BY_ID[q].o]), chosen: null, at: null });
// The wording a fact's next counted choice question uses: the one with the fewest counted answers,
// the fact's own question first on a tie, then the others in id order (#36).
const wordingFor = (p, id) => WORDINGS[id].reduce((best, q) => (p.byWording[q] || 0) < (p.byWording[best] || 0) ? q : best);

// by the spec's step 5: the group block, if any, then each new fact's first look and rule screen,
// with due and fill questions spread between them, and its counted question at least GAP screens
// for other facts later.
function buildSet(p, now, firstLook = FIRST_LOOK) {

  const W = plan.fresh.filter(id => !taught(p, id)), k = W.length;

  if (!k) return [...block, ...D];

  const screens = [];
  let used = 0;

    if (firstLook) screens.push({ kind: 'first_look', id, ...choiceOf(id) });
    screens.push({ kind: 'rule', id });
    const n = Math.floor(rest.length / k) + (i < rest.length % k ? 1 : 0);
    screens.push(...rest.slice(used, used + n));
    used += n;
  });

}
const isQuestion = s => s.kind !== 'rule' && s.kind !== 'contrast';

// Of every time a fact was answered right and asked again at least SPACING_MS later, how many
// times it was right again: {all: {right, of}, recent: {right, of}}, recent being pairs whose
// second answer is in the 14 days before `now`. This is the number that says whether the app works.
function retention(p, now) {
  const all = { right: 0, of: 0 }, recent = { right: 0, of: 0 };
  for (const list of Object.values(p.answers)) for (let i = 1; i < list.length; i++) {
    const [a, b] = [list[i - 1], list[i]];
    if (!a.right || b.at - a.at < SPACING_MS) continue;
    for (const t of now - b.at <= 14 * 24 * HOUR ? [all, recent] : [all]) { t.of++; if (b.right) t.right++; }
  }
  return { all, recent };
}

// The Set on screen ({kind: 'daily' or 'test', set_id, started_at, after, number, group, i,
// answered, reasks, screens}) is saved whole: every screen with its question id, shown option order,

const SCREEN_KINDS = ['contrast', 'first_look', 'rule', 'counted', 'reask'];
function packRun(r) {
  return { kind: r.kind, set_id: r.set_id, started_at: r.started_at, after: r.after, number: r.number, group: r.group,
    i: r.i, answered: r.answered, reasks: r.reasks,
    screens: r.screens.map(s => ({ kind: s.kind, id: s.id, q: s.q, format: s.format, options: s.options, chosen: s.chosen, at: s.at, group: s.group })) };
}
const sameOptions = (options, q) => Array.isArray(options) && options.slice().sort().join('\n') === [q.a, ...q.o].sort().join('\n');
// A reverse question's choices are 4 different labels of its group, its own fact's among them.
function reverseOptions(x, g) {

  return !!own && Array.isArray(x.options) && x.options.length === 4 && new Set(x.options).size === 4

    const screens = p.screens.map(x => {
      // A question screen's wording `q` must still be a wording of its fact (a Set saved before wordings has none).
      const g = GROUP_BY_ID[x.group], wording = isQuestion(x) ? x.q ?? x.id : null, q = BY_ID[wording ?? x.id];
      if (!SCREEN_KINDS.includes(x.kind) || (x.kind === 'contrast' ? !g : !q || (wording && factOf(wording) !== x.id))) throw new Error('changed');
      if (isQuestion(x) && !(x.format === 'choice' ? sameOptions(x.options, q) : x.format === 'reverse' && reverseOptions(x, g))) throw new Error('changed');
      return { kind: x.kind, id: x.id, q: wording ?? undefined, format: x.format, options: x.options, chosen: x.chosen ?? null, at: x.at || null, group: x.group ?? null };
    });
    if (!Number.isInteger(p.i) || p.i < 0 || p.i >= screens.length || typeof p.set_id !== 'string' || !p.set_id) return null;
    return { kind: p.kind, set_id: p.set_id, started_at: p.started_at || new Date().toISOString(), after: p.after,
      number: Number.isInteger(p.number) ? p.number : S.sets + 1, group: p.group ?? null, i: p.i, answered: !!p.answered,
      reasks: Number.isInteger(p.reasks) ? p.reasks : 0, screens };

}
// Saves the Set on screen in the device copy, stamped with saved_at, and sends it to the server.
function keepRun() {
  copy.unfinished = S.run = run ? Object.assign(packRun(run), { saved_at: new Date().toISOString() }) : null;
  saveCopy();
  sendUnfinished();
}

// The question a screen asks: its wording `q` (the fact's own question when it has none).
const asked = s => BY_ID[s.q || s.id];
// A reverse question's answer is its fact's label in the group; any other question's is its wording's answer.
const labelOf = (group, id) => GROUP_BY_ID[group].facts.find(f => f.id === id).label;
const answerOf = s => s.format === 'reverse' ? labelOf(s.group, s.id) : asked(s).a;
const questionText = s => s.format === 'reverse' ? reverseStem(GROUP_BY_ID[s.group].reverse, BY_ID[s.id].a) : asked(s).q;
// A reverse stem with the fact's answer in it; mid-sentence, the answer starts with a small letter.
const reverseStem = (stem, a) => stem.replace('{answer}', stem.includes(': {answer}') ? a : a[0].toLowerCase() + a.slice(1));

function setRecord(r) {

  const answers = r.screens.filter(s => isQuestion(s) && s.chosen !== null)
    .map(s => ({ q: s.q || s.id, chosen: s.chosen, right: isRight(s), at: s.at || now, role: s.kind, format: s.format }));
  const data = { set_id: r.set_id, type: r.kind, section: null, started_at: r.started_at, answers };
  if (r.kind === 'daily') data.group = r.group;

// Sends the records waiting on this device, up to 100 (and under the server's body limit) at a
// time. Those the server stored, or skipped because it already has them, move from `pending` to
// `records`. If the server can't be reached they stay in `pending`, and are sent when the app
// opens, when the device comes back online, after the next finished Set, or before sign-out.
// One send runs at a time; a call made meanwhile sends again once it ends.
let sending = null, sendAgain = false;
function sendPending() {
  if (sending) { sendAgain = true; return sending; }

  return sending;
}
const BATCH_BYTES = 60000; // the server refuses a body over 64 KB

async function sendWaiting() {
  const mine = copy;
  while (mine && copy === mine && mine.pending.length) {
    const batch = [];
    let size = 20;
    for (const x of mine.pending) {
      const n = jsonBytes(x) + 1;
      if (batch.length && (batch.length === 100 || size + n > BATCH_BYTES)) break;
      batch.push(x);
      size += n;
    }
    let r, body;
    try {
      r = await postJSON('/api/records', { records: batch });
      if (r.status === 400) body = await r.json();
    } catch (e) { return; }
    if (copy !== mine) return;
    if (body && body.error === 'bad-record' && batch[body.index]) {
      // The server will never take a record of that shape; leaving it waiting would hold back every
      // one after it. It is kept aside rather than deleted.
      const bad = batch[body.index];
      mine.pending = mine.pending.filter(x => x.id !== bad.id);
      mine.rejected.push(bad);
      saveCopy();
      continue;
    }
    if (!r.ok) return;
    const sent = new Set(batch.map(x => x.id)), have = new Set(mine.records.map(x => x.id));
    mine.pending = mine.pending.filter(x => !sent.has(x.id));
    mine.records = mine.records.concat(batch.filter(x => !have.has(x.id)));
    saveCopy();
  }
}

// Sends the unfinished Set (or null once it is finished) to the server, so the Learner can go on
// with it on another device. One send at a time, always the latest; `unfinishedUnsent` says the
// server is behind the device, so it is sent again when the device comes back online.
let sendingUnfinished = false, unfinishedUnsent = false;
async function sendUnfinished() {
  unfinishedUnsent = true;

    }
  } catch (e) {
    unfinishedUnsent = copy === mine;
  } finally {
    sendingUnfinished = false;
  }
}

window.addEventListener('online', () => {
  if (!copy) return;
  sendPending();
  if (unfinishedUnsent) sendUnfinished();
});

// A finished quiz, test or lesson's name in the Helper's History, from its record's type, Section and number
// (the Helper's History counts practice quizzes since the latest Reset; the Learner never sees the number).
// 'day', 'redo' and 'review' are Sets from before the learning engine.
// A lesson is named as its Section, as on the Learner's screens; the old 'day' records are too.
const setName = (type, section, number) => type === 'daily' ? `Practice quiz ${number}` : type === 'test' ? 'Practice test'
  : type === 'review' ? 'Review' : type === 'redo' ? `Section ${section} again` : `Section ${section}`;

let painted = false, onHome = false; // onHome: the Learner's home screen is showing
function paint(html, focus) {
  onHome = false;

  painted = true;
}
const toTop = () => window.scrollTo({ top: 0, behavior: 'instant' });

// The route from no facts to Practice tests: the 120 facts as a road on a night map, marked off into the
// 12 Sections, with the Learner's place as the navigation puck. Learned is solid route blue and the road
// still ahead a broken line. `before` (a Progress from before a quiz) lights the stretch that quiz covered,
// drawn in as it appears. Nothing is written under it: the block above already names what comes next.
const ROUTE = [[[34, 222], [130, 238], [64, 140], [180, 148]], [[180, 148], [290, 154], [236, 76], [324, 84]]];
const routeD = `M${ROUTE[0][0]} C${ROUTE[0][1]} ${ROUTE[0][2]} ${ROUTE[0][3]} C${ROUTE[1][1]} ${ROUTE[1][2]} ${ROUTE[1][3]}`.replace(/,/g, ' ');
// Points along the road by length, sampled once: where the Section marks and the puck go.
const ROUTE_PTS = (() => {
  const pts = [];
  ROUTE.forEach(([a, b, c, d], k) => { for (let i = k ? 1 : 0; i <= 200; i++) {
    const t = i / 200, u = 1 - t, f = (j) => u * u * u * a[j] + 3 * u * u * t * b[j] + 3 * u * t * t * c[j] + t * t * t * d[j];

  const u = b.at > a.at ? (want - a.at) / (b.at - a.at) : 0;

const MAP_STREETS = (() => {

  for (let i = -18; i < 30; i++) g += `<path d="M${i * 38} -60 L${i * 38 + 150} 340" stroke="var(--map-grid)" stroke-width="2.4"/>`;
  for (let i = -2; i < 12; i++) g += `<path d="M-500 ${i * 34 + 8} L860 ${i * 34 - 110}" stroke="var(--map-grid)" stroke-width="2.4"/>`;
  return g + '<path d="M-500 100 C-100 80 120 60 220 92 S520 40 860 50" stroke="var(--map-road)" stroke-width="7" fill="none"/>' +

  const isReady = ready(p), open = unlocked(p), end = ROUTE[1][3], start = ROUTE[0][0];
  const marks = DAYS.slice(1).map((_, k) => { const m = routeAt((k + 1) / DAYS.length);
    return `<rect x="-1.6" y="-9" width="3.2" height="18" rx="1.6" fill="var(--ink)" opacity=".8" transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${m.deg.toFixed(1)})"/>`; }).join('');
  const line = (n, cls, color) => n > 0 ? `<path class="${cls}" d="${routeD}" pathLength="${total}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${n} ${total * 2}"${cls === 'm-gain' ? ` style="--from:${n - was}"` : ''}/>` : '';

      <div class="route-head" aria-hidden="true"><span>Questions learned</span><span class="route-count">${l} of ${total}</span></div>
      <svg class="route-map" viewBox="0 0 360 280" aria-hidden="true">${MAP_STREETS}
        <path d="${routeD}" fill="none" stroke="var(--guide-case)" stroke-opacity=".6" stroke-width="15" stroke-linecap="round"/>

        <circle cx="${start[0]}" cy="${start[1]}" r="7" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
        <g class="route-ends"><text class="m-label" x="${start[0] - 10}" y="${start[1] - 18}">Start</text>
        <g transform="translate(${end[0]} ${end[1]})"><circle r="15" fill="var(--surface-2)" stroke="${isReady || open ? 'var(--guide)' : 'var(--ink)'}" stroke-width="2.5"/>
          <path d="M-4.5 7V-7.5 M-4.5 -7.5h9.5l-2.6 3.4 2.6 3.4h-9.5" fill="none" stroke="${isReady || open ? 'var(--guide)' : 'var(--ink)'}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></g>

      </svg>
    </section>`;
}

// The fine print at the bottom of the Learner's home screen, with a quiet Sign out beside it.
const disclaimer = `<footer class="fine"><p>This is a practice app. It is not made by the State of Tennessee. The questions come from the Tennessee Comprehensive Driver License Manual, July 1, 2022 edition.</p><button class="link" type="button" id="signOutBtn">Sign out</button></footer>`;

// The home screen shows one thing to do, named plainly and never explained: the practice quiz or practice
// test stopped partway through; else, once Ready, the practice tests; else the practice quiz when facts are
// due; else the next lesson; else the practice tests when they are open; else "Nothing is due today." What
// comes after it, if anything, is a quieter block under it. Then the bar of questions learned and the Lessons.
function renderHome() {
  run = null; lesson = null;
  const saved = S.run && unpackRun(S.run);
  if (S.run && !saved) { copy.unfinished = S.run = null; saveCopy(); }
  const plan = setPlan(S, Date.now()), open = unlocked(), isReady = ready(), due = quizDue(plan);
  const teach = !saved && plan.lesson ? LESSONS[plan.lesson] : null;
  const main = saved ? (saved.kind === 'daily' ? 'quiz' : 'test') : isReady && open ? 'test' : due ? 'quiz' : teach ? 'lesson' : open ? 'test' : 'none';
  const H = what => what === main ? 'h1' : 'h2', primary = what => what === main ? ' primary' : '';
  const quiz = saved && saved.kind === 'daily' ? `<h1 tabindex="-1">Practice quiz</h1>${stoppedLine(saved)}`
    : due ? `<${H('quiz')} tabindex="-1">Practice quiz</${H('quiz')}>
      <button class="btn${primary('quiz')}" type="button" id="startBtn">Start the practice quiz</button>` : '';
  // On the Learner's screens a lesson has no name of its own: it is the Section, taken for the first time.
  const lessonBlock = teach ? `<${H('lesson')} tabindex="-1">Section ${plan.lesson}</${H('lesson')}><p class="theme">${esc(teach.title)}</p>
      <button class="btn${primary('lesson')}" type="button" id="lessonBtn">Start Section ${plan.lesson}</button>` : '';
  const scores = S.tests.slice(-5);
  const tests = !open ? '' : `${isReady ? `<div class="sign"><${H('test')} tabindex="-1">Ready for the test</${H('test')}><p>You got ${READY_SCORE} or more correct on ${READY_STREAK} practice tests in a row.</p></div>`
        : `<${H('test')} tabindex="-1">Practice tests</${H('test')}><p class="sub">To pass the real test, you need ${PASS_SCORE} or more correct out of ${TEST_LEN}. You are Ready for the test when you get ${READY_SCORE} or more correct on ${READY_STREAK} practice tests in a row.</p>`}
      ${scores.length ? `<p class="sub">${scores.length === 1 ? 'Your last practice test' : `Your last ${scores.length} practice tests, oldest first`}: ${scores.join(', ')} correct out of ${TEST_LEN}.</p>` : ''}
      ${saved && saved.kind === 'test' ? stoppedLine(saved) : `<button class="btn${primary('test')}" type="button" id="testBtn">${isReady ? 'Take another practice test' : 'Start a practice test'}</button>`}`;
  const blocks = { quiz, lesson: lessonBlock, test: tests, none: main === 'none' ? '<h1 tabindex="-1">Nothing is due today.</h1>' : '' };
  const later = ['quiz', 'lesson', 'test'].filter(what => what !== main && blocks[what]).map(what => `<div class="later">${blocks[what]}</div>`).join('');
  paint(`
    <section class="home start">
      <div class="mv">${blocks[main]}</div>
      ${later}
      ${canSave ? '' : '<p class="warn">This browser is not keeping a copy of your answers on this device. If you close this page while offline, answers not yet saved will be lost.</p>'}
      ${route()}
      <div class="sheet">${lessonsPanel()}${disclaimer}</div>
    </section>`, 'h1');

  if ($('startBtn')) $('startBtn').onclick = () => startOver(saved, 'daily');
  if ($('lessonBtn')) $('lessonBtn').onclick = () => { startLesson(plan.lesson); toTop(); };
  wireLessons();
  if ($('testBtn')) $('testBtn').onclick = () => startOver(saved, 'test');
  if (saved) {
    $('resumeBtn').onclick = () => { run = saved; renderScreen(); };
    $('overBtn').onclick = () => { dropUnfinished(); start(saved.kind); };

// What the Learner was doing when they stopped partway through, for a sentence ("You stopped partway through …").
const doing = saved => saved.kind === 'daily' ? 'a practice quiz' : 'a practice test';
const theOne = kind => kind === 'daily' ? 'the practice quiz' : 'the practice test';
// Every answered question screen, first looks included: what starting over clears.
const answeredSoFar = saved => saved.screens.filter(s => isQuestion(s) && s.chosen !== null).length;

      <p>You stopped partway through ${doing(saved)}. You answered ${done} of its ${scored.length} questions.</p>
      <button class="btn primary" type="button" id="resumeBtn">Continue ${theOne(saved.kind)}</button>

function dropUnfinished() { copy.unfinished = S.run = null; saveCopy(); }

// Starts a practice quiz or a Practice test (`kind`). With answers saved in one stopped partway

function startOver(saved, kind) {
  if (!saved || !answeredSoFar(saved)) { if (saved) dropUnfinished(); return start(kind); }
  const what = kind === 'test' ? 'a practice test' : 'the practice quiz';

    <section class="home">

      <p class="sub">You stopped partway through ${doing(saved)}. If you start ${what} now, the answers you gave there will be cleared. They will not count.</p>
      <button class="btn primary" type="button" id="newSetYes">Yes, start ${what}</button>

    </section>`, 'h2');

// A practice quiz (record type `daily`) is built from the records (buildSet); a Practice test is 30 of the 120, shuffled.
function start(kind) {
  const screens = kind === 'test'
    ? shuffle(QS).slice(0, TEST_LEN).map(q => ({ kind: 'counted', id: q.id, format: 'choice', options: shuffle([q.a, ...q.o]), chosen: null, at: null }))
    : buildSet(S, Date.now());
  const change = latestChange(copyRecords());
  run = { kind, set_id: crypto.randomUUID(), started_at: new Date().toISOString(), after: change && change.id,
    number: S.sets + 1, group: (screens.find(s => s.kind === 'contrast') || {}).group ?? null, i: 0, answered: false, reasks: 0, screens };

function visual(q) { return q.sign ? SIGNS[q.sign] || '' : q.swatch ? SIGNS.swatch(q.swatch) : ''; }
const quitLink = '<button class="link" type="button" id="quitBtn">Stop for now and save my place</button>';

// The line above every screen of a quiz or test: what kind of screen it is, and a bar of the counted

  const done = scored.filter(x => x.chosen !== null).length, n = counted.indexOf(s) + 1;
  const where = run.kind === 'test' ? `Practice test: question ${n} of ${counted.length}`
    : `Practice quiz: ${s.kind === 'counted' ? `question ${n} of ${counted.length}` : s.kind === 'first_look' ? 'a new question'
      : s.kind === 'reask' ? 'a question from earlier' : s.kind === 'contrast' ? 'answers side by side' : 'the answer'}`;
  return `<div class="progress"><span>${whereLine(where)}</span>${segments(scored.length, done, isQuestion(s) && !run.answered && s.kind !== 'first_look')}</div>`;
}

// One segment per question: filled when answered, a broken line for the question on screen.
const segments = (n, done, current) => `<div class="segs" style="--n:${n}" aria-hidden="true">${
  Array.from({ length: n }, (_, k) => k < done ? '<i class="d"></i>' : k === done && current ? '<i class="c"></i>' : '<i></i>').join('')}</div>`;
// "Practice quiz: question 3 of 8" and "Section 3: 1 of 12": the part before the colon in bold.
const whereLine = where => { const k = where.indexOf(':'); return k < 0 ? `<b>${esc(where)}</b>` : `<b>${esc(where.slice(0, k))}</b>${esc(where.slice(k))}`; };
