const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const resultMark = good => `<span class="dot" aria-hidden="true">${good ? CHECK : CROSS}</span>`;

function renderScreen() {
  const kind = run.screens[run.i].kind;
  return kind === 'rule' ? renderRule() : kind === 'contrast' ? renderCompare() : renderQuestion();
}

// A group's Compare screen: its easily mixed-up facts side by side, before the questions on them.
function renderCompare() {
  const g = GROUP_BY_ID[run.screens[run.i].group];
  const rows = g.facts.map(f => {
    const q = BY_ID[f.id];
    return `<li><div class="cfact">${visual(q) ? `<span class="cpic">${visual(q)}</span>` : ''}<span>${esc(f.label)}</span></div>` +
      `<div class="cmeans">${esc(f.means || q.a)}</div></li>`;
  }).join('');
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        <h1 class="q" id="compareHead" tabindex="-1">${esc(g.title)}</h1>
        <p class="sub">These ${g.facts.length} answers are easy to confuse with each other. Here they are side by side. The questions on them come next.</p>
        <ul class="compare">${rows}</ul>
      </div>
      <button class="btn primary" type="button" id="compareGoBtn">Go on to the questions</button>
      ${quitLink}
    </div>`, '#compareHead');
  $('compareGoBtn').onclick = () => { toTop(); next(); };
  wireQuit();
}

// A new fact's answer and its explanation. It comes once, right after the fact's first look, and
// leads with the result of that look; the fact's counted question comes later in the quiz.
function renderRule() {
  const s = run.screens[run.i], q = BY_ID[s.id], prev = run.screens[run.i - 1];
  const look = prev && prev.kind === 'first_look' && prev.id === s.id ? prev : null;
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        ${!look ? '<h1 class="outcome" id="ruleHead" tabindex="-1">Read this first.</h1>'
          : look.chosen === q.a ? `<h1 class="outcome good" id="ruleHead" tabindex="-1">${resultMark(true)}<span>You picked the correct answer: ${esc(q.a)}.</span></h1>`
          : `<h1 class="outcome not" id="ruleHead" tabindex="-1">${resultMark(false)}<span>The answer is: ${esc(q.a)}.</span></h1><p class="picked">You picked: ${esc(look.chosen)}. This answer does not count.</p>`}
        ${visual(q) ? `<div class="visual">${visual(q)}</div>` : ''}
        <p class="rule">${esc(q.why)}</p>
        <p class="back">This question comes back later in this practice quiz.</p>
      </div>
      <button class="btn primary" type="button" id="ruleGoBtn">Go on</button>
      ${quitLink}
    </div>`, '#ruleHead');
  $('ruleGoBtn').onclick = () => { toTop(); next(); };
  wireQuit();
}

// What an answered counted question or re-ask says, top of the card first: {lead, picked, other,
// back}. `lead` is the result; `picked` says what was picked when it was wrong; `other` names the
// question a wrong choice is the answer to; `back` says when the question comes back.
function feedbackLines(s) {
  const q = asked(s);
  if (isRight(s)) return { lead: `You picked the correct answer: ${answerOf(s)}.`, picked: '', other: '', back: '' };
  const other = s.format === 'choice' && q.also && BY_ID[q.also[s.chosen]];
  const reasked = run.kind === 'daily' && s.kind === 'counted' && run.screens.some((x, j) => j > run.i && x.kind === 'reask' && x.id === s.id);
  return { lead: `The answer is: ${answerOf(s)}.`, picked: `You picked: ${s.chosen}.`,
    other: other ? `${s.chosen} is the answer to a different question: ${other.q}` : '',
    back: reasked ? 'This question comes back later in this practice quiz, and in your next practice quiz.' : 'This question comes back in your next practice quiz.' };
}

function renderQuestion() {
  const s = run.screens[run.i], q = asked(s), last = run.i === run.screens.length - 1, right = answerOf(s);
  const L = ['A', 'B', 'C', 'D'];
  const opts = s.options.map((o, k) => {
    if (!run.answered) return `<li><button type="button" class="opt" data-k="${k}" aria-keyshortcuts="${L[k]}"><span class="key">${L[k]}</span><span class="otext">${esc(o)}</span></button></li>`;
    const c = o === right ? 'right' : o === s.chosen ? 'wrong' : 'rest';
    const tag = o === s.chosen ? 'Your answer' : o === right ? 'The answer' : '';
    return `<li class="opt ${c}"><span class="key" aria-hidden="true">${L[k]}</span><span class="otext"><span>${esc(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</span></li>`;
  }).join('');
  const lines = run.answered ? feedbackLines(s) : null;
  // Answered, the result is the first thing on the card; the explanation follows the choices.
  const result = lines ? `<div class="result" id="feedback">
      <h2 class="outcome${isRight(s) ? ' good' : ' not'}" id="outcome" tabindex="-1">${resultMark(isRight(s))}<span>${esc(lines.lead)}</span></h2>
      ${lines.picked ? `<p class="picked">${esc(lines.picked)}</p>` : ''}
      ${lines.other ? `<p class="also">${esc(lines.other)}</p>` : ''}
    </div>` : '';
  // After a wrong answer on a fact a lesson teaches, its lesson step can be looked at again, without leaving the quiz.
  const peek = lines && !isRight(s) && run.kind === 'daily' && LESSON_STEP[s.id] ? '<button class="link peek" type="button" id="peekBtn">See how this works</button>' : '';
  const explain = lines ? `<div class="explain"><p class="why">${esc(q.why)}</p>${lines.back ? `<p class="back">${esc(lines.back)}</p>` : ''}${peek}</div>` : '';
  const above = s.kind === 'first_look' ? '<p class="sub">This is a new question. Pick the answer you think is correct. This answer does not count.</p>'
    : s.kind === 'reask' ? '<p class="sub">You saw this question earlier in this practice quiz. Here it is again.</p>' : '';
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        ${result}
        ${above}
        ${visual(q) && s.format !== 'reverse' ? `<div class="visual">${visual(q)}</div>` : ''}
        ${run.answered ? `<p class="q asked" id="qText">${esc(questionText(s))}</p>` : `<h1 class="q" id="qText" tabindex="-1">${esc(questionText(s))}</h1>`}
        <ul class="options" aria-labelledby="qText">${opts}</ul>
        ${explain}
      </div>
      ${run.answered ? `<button class="btn primary" type="button" id="nextBtn">${!last ? 'Next question' : run.kind === 'test' ? 'See my score' : 'See how it went'}</button>` : ''}
      ${quitLink}
    </div>`, run.answered ? '#outcome' : '#qText');
  if (run.answered) $('nextBtn').onclick = next;
  if ($('peekBtn')) $('peekBtn').onclick = () => { peekStep(s.id); toTop(); };
  if (!run.answered) document.querySelectorAll('button.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.k)));
  wireQuit();
}

// After a wrong counted answer at screen `p`, the same fact is asked once more right after the
// RE_ASK_GAPth question screen for another fact (at the end, when fewer are left), at most
// RE_ASK_CAP times a quiz. A first look and its rule screen are never split. Returns whether it was.
function insertReask(r, p) {
  if (r.reasks >= RE_ASK_CAP) return false;
  const s = r.screens[p];
  let at = r.screens.length, seen = 0;
  for (let j = p + 1; j < r.screens.length; j++) {
    if (isQuestion(r.screens[j]) && r.screens[j].id !== s.id && ++seen === RE_ASK_GAP) { at = j + 1; break; }
  }
  if (at < r.screens.length && r.screens[at - 1].kind === 'first_look') at++;
  r.screens.splice(at, 0, { kind: 'reask', id: s.id, q: s.q, group: s.group, format: s.format, options: shuffle(s.options), chosen: null, at: null });
  r.reasks++;
  return true;
}

function choose(k) {
  const s = run.screens[run.i];
  if (run.answered || !isQuestion(s)) return;
  s.chosen = s.options[k];
  s.at = new Date().toISOString();
  // A first look is not scored: choosing goes straight on to the fact's answer and explanation.
  if (s.kind === 'first_look') { run.i++; keepRun(); toTop(); return renderScreen(); }
  run.answered = true;
  if (run.kind === 'daily' && s.kind === 'counted' && !isRight(s)) insertReask(run, run.i);
  keepRun();
  toTop();
  renderQuestion();
  const lines = feedbackLines(s);
  $('announce').textContent = [lines.lead, lines.picked, lines.other, asked(s).why, lines.back].filter(Boolean).join(' ');
}

function next() {
  $('announce').textContent = '';
  if (run.i < run.screens.length - 1) { run.i++; run.answered = false; keepRun(); toTop(); renderScreen(); }
  else finish();
}

function finish() {
  const r = run, before = S;
  // The finished quiz or test waits in `pending` until the server has it; Progress is worked out again with it.
  const rec = setRecord(r), mine = copy;
  copy.pending.push(rec);
  copy.unfinished = null;
  saveCopy();
  workOut();
  // Once the server has the finished quiz or test, the unfinished one is cleared there too.
  unfinishedUnsent = true;
  sendPending().then(() => { if (copy === mine && !mine.pending.includes(rec)) sendUnfinished(); });
  run = null;
  // Each fact with a wrong counted answer or re-ask, once, in the wording it was asked.
  const wrong = r.screens.filter(s => (s.kind === 'counted' || s.kind === 'reask') && !isRight(s));
  const missed = [...new Set(wrong.map(s => s.id))];
  const list = missed.map(id => { const s = wrong.find(x => x.id === id), q = asked(s); return `<li><p class="mq">${esc(questionText(s))}</p><p>The answer is: ${esc(answerOf(s))}.</p><p class="mwhy">${esc(q.why)}</p></li>`; }).join('');
  const missedList = missed.length ? `<details class="missed"><summary>See the ${plural(missed.length, 'question', 'questions')} you missed</summary><ul>${list}</ul></details>` : '';
  if (r.kind === 'test') testDone(r, missed, missedList); else setDone(r, before, missed, missedList);
  toTop();
}

// The end of a practice quiz: what changed, in full sentences, and what comes next. No score.
// One tile per fact the quiz asked, in the order asked: an accent tile with a check when its newest
// answer is right, an outlined tile with a return arrow when it comes back in the next quiz.
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const AGAIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 4v4.5H15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setStrip(ids) {
  const got = ids.filter(id => S.facts[id].lastRight !== false).length, back = ids.length - got;
  const tiles = ids.map((id, k) => S.facts[id].lastRight === false ? `<li class="tile back" style="--k:${k}">${AGAIN}</li>` : `<li class="tile got" style="--k:${k}">${CHECK}</li>`).join('');
  return `<div class="strip-wrap">
      <ul class="strip" aria-label="${plural(got, 'question', 'questions')} answered correctly. ${plural(back, 'question comes', 'questions come')} back in your next practice quiz.">${tiles}</ul>
      <p class="strip-key" aria-hidden="true"><span class="key-item"><span class="tile mini got">${CHECK}</span>Correct</span>${back ? `<span class="key-item"><span class="tile mini back">${AGAIN}</span>Comes back in your next practice quiz</span>` : ''}</p>
    </div>`;
}
function setDone(r, before, missed, missedList) {
  const ids = [...new Set(r.screens.filter(isQuestion).map(s => s.id))];
  const learned = ids.filter(id => !isLearned(before.facts[id]) && isLearned(S.facts[id])).length;
  const solid = ids.filter(id => !isSolid(before.facts[id]) && isSolid(S.facts[id])).length;
  const back = ids.filter(id => S.facts[id].lastRight === false).length;
  const lines = [learned ? `You learned the answers to ${plural(learned, 'new question', 'new questions')}.` : '',
    solid ? `${plural(solid, 'question is', 'questions are')} now solid: you answered ${solid === 1 ? 'it' : 'each one'} correctly 3 times, at least 12 hours apart.` : ''].filter(Boolean);
  paint(`
    <section class="home">
      <h2 tabindex="-1">You finished the practice quiz.</h2>
      ${setStrip(ids)}
      ${lines.length ? `<p class="theme">${lines.join(' ')}</p>` : ''}
      ${route(S, before)}
      ${nextButtons()}
      ${missedList}
    </section>`, 'h2');
  wireDone();
}
// The buttons after a practice quiz: the next practice quiz first while one is due, else
// I'm done for now, with a Practice test beside it when they are open. Nothing is explained.
function nextButtons() {
  return quizDue(setPlan(S, Date.now()))
    ? `<button class="btn primary" type="button" id="moreBtn">Start the practice quiz</button><button class="btn" type="button" id="homeBtn">I'm done for now</button>`
    : `<button class="btn primary" type="button" id="homeBtn">I'm done for now</button>${unlocked() ? '<button class="btn" type="button" id="testBtn">Start a practice test</button>' : ''}`;
}

// The end of a Practice test: the count and what it is short of, never a pass or fail verdict (#35).
function testDone(r, missed, missedList) {
  const counted = r.screens.filter(s => s.kind === 'counted'), right = counted.filter(isRight).length, st = streak();
  const back = missed.length ? ' The questions you missed come back in your next practice quiz.' : '';
  let title, note, sign = false;
  if (st >= READY_STREAK) {
    sign = true;
    title = 'You are ready for the real test.';
    note = `You got ${READY_SCORE} or more correct on ${READY_STREAK} practice tests in a row.`;
  } else if (right >= READY_SCORE) {
    title = 'This practice test counts toward Ready for the test.';
    note = `You have ${st} of ${READY_STREAK} in a row. Get ${READY_SCORE} or more correct on ${plural(READY_STREAK - st, 'more practice test', 'more practice tests')} to be ready.` + back;
  } else {
    title = 'You finished this practice test.';
    note = `A practice test counts toward Ready for the test when you get ${READY_SCORE} or more correct.` + back;
  }
  paint(`
    <section class="home">
      ${sign ? `<div class="sign"><h2 tabindex="-1">${title}</h2><p>${esc(note)}</p></div>` : `<h2 tabindex="-1">${title}</h2>`}
      <p class="score">You got ${right} correct out of ${counted.length}.</p>
      ${sign ? (missed.length ? `<p class="sub">${back.trim()}</p>` : '') : `<p class="sub">${esc(note)}</p>`}
      <button class="btn primary" type="button" id="homeBtn">I'm done for now</button>
      <button class="btn" type="button" id="testBtn">Take another practice test</button>
      ${missedList}
    </section>`, 'h2');
  wireDone();
}
function wireDone() {
  $('homeBtn').onclick = () => { renderHome(); toTop(); };
  if ($('moreBtn')) $('moreBtn').onclick = () => { start('daily'); toTop(); };
  if ($('testBtn')) $('testBtn').onclick = () => { start('test'); toTop(); };
}

document.addEventListener('keydown', e => {
  if (!document.querySelector('button.opt') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
  if (k < 0) return;
  if (lesson) { e.preventDefault(); return lessonChoose(k); }
  if (!run || run.answered) return;
  e.preventDefault();
  choose(k);
});

// Lessons (docs/specs/lessons.md). A lesson teaches one Section's facts before any question on them.
// Every step asks the Learner to act, on a drawing or among choices, before it states the rule. The
// drawings come from a small kit of top-down parts, so a lesson is data (data/lessons/section-N.json).
let lesson = null; // the lesson on screen: {lesson, i, acts: {step index: {chosen, right, at}}, set_id, started_at, peek}

// Intervals of [from, to] with every [a, b] in `cuts` taken out: a road's markings stop where another road crosses.
function spans(from, to, cuts) {
  let list = [[from, to]];
  for (const [a, b] of cuts) list = list.flatMap(([s, e]) => b <= s || a >= e ? [[s, e]] : [[s, Math.max(s, a)], [Math.min(e, b), e]].filter(([x, y]) => y - x > 0.5));
  return list;
}
const svgText = (x, y, text, anchor = 'middle', cls = 'k-label') => `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(text)}</text>`;
// One road's surface, then its edge lines and center line, broken where the other roads cross it.
function roadMarks(r, roads) {
  const horizontal = r.w >= r.h, others = roads.filter(o => o !== r && o.x < r.x + r.w && o.x + o.w > r.x && o.y < r.y + r.h && o.y + o.h > r.y);
  const cuts = others.map(o => horizontal ? [o.x, o.x + o.w] : [o.y, o.y + o.h]);
  const [from, to] = horizontal ? [r.x, r.x + r.w] : [r.y, r.y + r.h];
  const line = (at, cls, dash) => spans(from, to, cuts).map(([s, e]) => horizontal
    ? `<line class="${cls}" x1="${s}" y1="${at}" x2="${e}" y2="${at}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`
    : `<line class="${cls}" x1="${at}" y1="${s}" x2="${at}" y2="${e}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`).join('');
  const [lo, hi, mid] = horizontal ? [r.y + 1.5, r.y + r.h - 1.5, r.y + r.h / 2] : [r.x + 1.5, r.x + r.w - 1.5, r.x + r.w / 2];
  // `oneway: N` is one roadway of a divided highway (Section 9): N lanes all going the same way, split by broken
  // white lines, with no center line. `center` and `lanes` are ignored.
  if (r.oneway >= 2) {
    const lane = (horizontal ? r.h : r.w) / r.oneway, start = horizontal ? r.y : r.x;
    let splits = '';
    for (let k = 1; k < r.oneway; k++) splits += line(start + k * lane, 'k-white', '14 10');
    return line(lo, 'k-edge') + line(hi, 'k-edge') + splits;
  }
  let center = '';
  const c = r.center || 'yellow';
  if (c === 'yellow') center = line(mid, 'k-yellow');
  else if (c === 'yellow-broken') center = line(mid, 'k-yellow', '14 10');
  else if (c === 'yellow-double') center = line(mid - 2.5, 'k-yellow') + line(mid + 2.5, 'k-yellow');
  else if (c === 'white-broken') center = line(mid, 'k-white', '14 10');
  // A solid and a broken yellow line: `yellow-pass-n` / `-e` puts the broken line on the side of the driver
  // heading north or east (the high side), `yellow-pass-s` / `-w` on the other side.
  else if (c === 'yellow-pass-n' || c === 'yellow-pass-e') center = line(mid - 2.5, 'k-yellow') + line(mid + 2.5, 'k-yellow', '14 10');
  else if (c === 'yellow-pass-s' || c === 'yellow-pass-w') center = line(mid - 2.5, 'k-yellow', '14 10') + line(mid + 2.5, 'k-yellow');
  // `lanes: 2` splits each direction into two lanes with a broken white line (a four-lane road).
  const quarter = (horizontal ? r.h : r.w) / 4;
  if (r.lanes === 2) center += line(mid - quarter, 'k-white', '14 10') + line(mid + quarter, 'k-white', '14 10');
  return line(lo, 'k-edge') + line(hi, 'k-edge') + center;
}
const SIGN_PARTS = {
  stop: (x, y) => `<g transform="translate(${x} ${y})"><polygon points="-4,-10 4,-10 10,-4 10,4 4,10 -4,10 -10,4 -10,-4" fill="#c8323a" stroke="#fff" stroke-width="1.5"/>${svgText(0, 2.2, 'STOP', 'middle', 'k-sign')}</g>`,
  yield: (x, y) => `<g transform="translate(${x} ${y})"><polygon points="-11,-9 11,-9 0,10" fill="#c8323a"/><polygon points="-7,-6.5 7,-6.5 0,5" fill="#fff"/></g>`,
  allway: (x, y) => SIGN_PARTS.stop(x, y) + `<g transform="translate(${x} ${y + 16})"><rect x="-11" y="-4" width="22" height="8" fill="#fff" stroke="#c8323a" stroke-width="1"/>${svgText(0, 2.3, 'ALL WAY', 'middle', 'k-plate')}</g>`,
};
// A road sign drawn by shape and color alone, with no words on it, so the shape and the color carry the
// meaning (Section 1). The colors are the ones data/questions.json uses for its sign colors. About 36 across.
const SIGN_COLORS = { red: '#ed3929', yellow: '#faee1a', orange: '#f27423', green: '#12a850', blue: '#0777be', 'yellow-green': '#c3d53c', white: '#ffffff', brown: '#40371a' };
function roadsignPart(p, o) {
  const fill = SIGN_COLORS[p.color] || SIGN_COLORS.white, dark = p.color === 'red' || p.color === 'green' || p.color === 'blue' || p.color === 'brown';
  const edge = `stroke="${dark ? '#ffffff' : '#231f20'}" stroke-width="1.8"`;
  let face;
  if (p.kind === 'octagon') face = `<polygon class="k-body" points="-7.5,-18 7.5,-18 18,-7.5 18,7.5 7.5,18 -7.5,18 -18,7.5 -18,-7.5" fill="${fill}" ${edge}/>`;
  else if (p.kind === 'triangle') face = `<polygon class="k-body" points="-19,-16 19,-16 0,17 " fill="${fill}" ${edge}/>` + (p.color === 'red' ? '<polygon points="-12,-12 12,-12 0,9" fill="#ffffff"/>' : '');
  else if (p.kind === 'diamond') face = `<polygon class="k-body" points="0,-19 19,0 0,19 -19,0" fill="${fill}" ${edge}/>`;
  else if (p.kind === 'circle') face = `<circle class="k-body" r="18" fill="${fill}" ${edge}/>`;
  else if (p.wide) face = `<rect class="k-body" x="-20" y="-13" width="40" height="26" rx="2" fill="${fill}" ${edge}/>`;
  else face = `<rect class="k-body" x="-14" y="-18" width="28" height="36" rx="2" fill="${fill}" ${edge}/>`;
  return wrapTarget(p, `<g class="k-roadsign" transform="translate(${p.x} ${p.y})">${face}</g>`, o);
}
const LIGHT_COLORS = { red: '#d9534f', yellow: '#e0b23c', green: '#5aa870' };
// A traffic signal as a driver meets it: a vertical head, red on top, hung on a span across the road over
// the far side of the intersection. `x`, `y` is the head's center; the span runs the width of the road
// (`span` 0 draws no span, for a second head on the same span). A state is a color (`red`, `yellow`,
// `green`), `off`, `flashing-red` or `flashing-yellow`; with `-left` the lit lamp is a left arrow
// (`green-left`, `yellow-left`, `red-left`, `flashing-yellow-left`).

  const on = state.replace('flashing-', '').replace('-left', '');

  const row = { red: 0, yellow: 1, green: 2 }[on];

  const half = (p.span === undefined ? 64 : p.span) / 2, mid = p.spanX === undefined ? 0 : p.spanX - p.x;
  return `<g transform="translate(${p.x} ${p.y})">${half ? `<line x1="${mid - half}" y1="0" x2="${mid + half}" y2="0" stroke="#6b6e73" stroke-width="1.5"/>` : ''}` +
    `<rect x="-6" y="-14" width="12" height="28" rx="2" fill="#202225" stroke="#8a8d92" stroke-width="1"/>${lamp(0, 'red')}${lamp(1, 'yellow')}${lamp(2, 'green')}${arrow}</g>`;

  WORDINGS = Object.fromEntries(QS.map(q => [q.id, [q.id]]));
  for (const w of (data.wordings || []).slice().sort((a, b) => a.id < b.id ? -1 : 1)) if (WORDINGS[w.fact]) WORDINGS[w.fact].push(w.id);

// It only reads. Each screen loads fresh from the server when it opens, and Progress is worked

}
// What comes next for the Learner, worded for the Helper: the next practice quiz and the next lesson, or
// Ready for the test.
function nextSetLine(p, now) {
  if (ready(p)) return `Ready for the test: ${streak(p)} practice tests in a row at ${READY_SCORE} or more`;
  const plan = setPlan(p, now), lesson = plan.lesson ? `Section ${plan.lesson}` : '';
  if (!quizDue(plan)) return lesson ? `Next: ${lesson}.` : 'Nothing is due.';
  const parts = [plan.block.length ? `Compare: ${plan.group.title}` : '', plan.due.length ? `${plan.due.length} come back` : '',
    plan.fill.length ? `${plan.fill.length} to keep fresh` : '', plan.fresh.length ? `${plan.fresh.length} new` : ''];

const answerTime = a => { const t = Date.parse(a.at); return Number.isNaN(t) ? 0 : t; };

const setScore = d => { const counted = d.answers.filter(isCounted); return { right: counted.filter(a => a.right).length, of: counted.length }; };

function lastStudied(records) {

  return t === null ? null : new Date(t).toISOString();
}

const SESSION_GAP = 30 * 60 * 1000; // a Study session has no gap longer than 30 minutes between answers
// Study sessions over the whole History, newest first, with each Reset and Move as a line of its
// own: {kind: 'session', start, end, sets: [{type, section, number, right, of}]}, {kind: 'reset', at}
// or {kind: 'move', at, to}. A Set counts as finished in the Study session that holds its last answer.
// A practice quiz's number counts the quizzes since the Reset before it; tests and lessons have none.
function studySessions(records) {
  const ordered = orderRecords(records), sets = ordered.filter(r => r.kind === 'set'), number = new Map();
  let n = 0;
  for (const r of ordered) { if (r.kind === 'reset') n = 0; else if (r.kind === 'set' && r.data.type === 'daily') number.set(r, ++n); }
  const times = sets.flatMap(r => r.data.answers.map(answerTime)).sort((a, b) => a - b);
  const sessions = [];
  for (const t of times) {
    const s = sessions[sessions.length - 1];
    if (s && t - s.end <= SESSION_GAP) s.end = t; else sessions.push({ start: t, end: t, sets: [] });
  }
  for (const r of sets) {
    const last = Math.max(...r.data.answers.map(answerTime));
    const s = sessions.find(s => s.start <= last && last <= s.end);
    if (s) s.sets.push({ type: r.data.type, section: r.data.section, number: number.get(r) ?? null, ...setScore(r.data) });
  }
  const lines = sessions.map(s => [s.end, { kind: 'session', start: new Date(s.start).toISOString(), end: new Date(s.end).toISOString(), sets: s.sets }]);

    if (r.kind === 'reset') lines.push([recordTime(r), { kind: 'reset', at: r.at }]);

function historyLine(e) {

// Up to 10 questions missed two or more times since the latest Reset: the most misses first, then
// the fewest answers, then the order of the study path. `wrong` is the wrong answer chosen most often.
// A first look is an unscored question on a rule not yet seen, so it is left out; counted answers and re-asks count.
function missedMost(records) {
  const tally = new Map();
  for (const r of countedRecords(records)) if (r.kind === 'set') for (const a of r.data.answers) {
    if (!BY_ID[a.q] || a.role === 'first_look') continue;
    if (!tally.has(a.q)) tally.set(a.q, { q: a.q, missed: 0, answered: 0, picks: new Map() });
    const t = tally.get(a.q);
    t.answered++;
    if (!a.right) { t.missed++; t.picks.set(a.chosen, (t.picks.get(a.chosen) || 0) + 1); }
  }

  return [...tally.values()].filter(t => t.missed >= 2)
    .sort((a, b) => b.missed - a.missed || a.answered - b.answered || place[a.q] - place[b.q])
    .slice(0, 10)

  const screen = body => {
    paint(`<section class="home helper"><h1 tabindex="-1">Learners</h1>${noteLine(note)}${body}${signOutBtn}</section>`, 'h1');
    $('signOutBtn').onclick = () => confirmSignOut(renderHelper);
  };
  screen('<p class="sub">Getting the list of Learners.</p>');
  const showing = stillShowing();
  let rows;
  try {
    const { learners } = await getJSON('/api/learners');
    rows = await Promise.all(learners.map(async learner => ({ learner, records: (await getJSON(`/api/learners/${learner.id}/records`)).records })));
  } catch (e) {
    if (e instanceof SignedOut || !showing()) return;
    screen('<p class="warn">The list of Learners could not be loaded. Check your connection and try again.</p><button class="btn primary" type="button" id="retryBtn">Try again</button>');
    $('retryBtn').onclick = () => renderHelper();
    return;
  }
  if (!showing()) return;
  const list = rows.map(({ learner, records }, k) => {
    const last = lastStudied(records);
    return `<li><button type="button" class="lrow" data-k="${k}"><span class="lname">${esc(learner.name)}</span><span>${esc(whereNow(progressFrom(records)))}</span>` +
      `<span class="lwhen">${last ? `Last studied ${dayText(last)}` : 'Has not answered any questions yet.'}</span></button></li>`;
  }).join('');
  screen((rows.length ? `<ul class="learners">${list}</ul>` : '<p class="sub none">No Learners yet.</p>') +
    '<button class="btn primary" type="button" id="addBtn">Add a Learner</button>');
  $('addBtn').onclick = () => { addLearner(); window.scrollTo(0, 0); };
  document.querySelectorAll('.lrow').forEach(b => b.onclick = () => { openLearnerPage(rows[Number(b.dataset.k)].learner); window.scrollTo(0, 0); });
}

// One Learner's page, loaded fresh each time it opens. `learner` is a row of GET /api/learners;
// the list is read again too, for the Learner's name and sign-in pause as they are now.
// `note` says what the Helper just did; `at: 'manage'` scrolls to Manage this Learner.
async function openLearnerPage(learner, { note = '', at = '' } = {}) {
  let name = esc(learner.name);
  const screen = body => {
    paint(`<section class="home helper"><button class="link top back" type="button">Back to Learners</button><h1 tabindex="-1">${name}</h1>${body}</section>`, 'h1');
    document.querySelectorAll('.back').forEach(b => b.onclick = () => { renderHelper(); window.scrollTo(0, 0); });
  };
  screen(`<p class="sub">Getting ${name}'s records.</p>`);
  const showing = stillShowing();
  let body, now;
  try {
    let learners;
    [{ learners }, body] = await Promise.all([getJSON('/api/learners'), getJSON(`/api/learners/${learner.id}/records`)]);
    now = learners.find(l => l.id === learner.id);
    if (!now) throw Object.assign(new Error('no-learner'), { status: 404 });
  } catch (e) {
    if (e instanceof SignedOut || !showing()) return;
    if (e.status === 404) return screen(`<p class="warn">${name} is no longer on the list of Learners.</p>`);
    screen(`<p class="warn">${name}'s records could not be loaded. Check your connection and try again.</p><button class="btn primary" type="button" id="retryBtn">Try again</button>`);
    $('retryBtn').onclick = () => openLearnerPage(learner);
    return;
  }
  if (!showing()) return;
  name = esc(now.name);
  screen(noteLine(note) + learnerPage(body, now));
  wireManage(now, progressFrom(body.records));
  if (at === 'manage') $('manage').scrollIntoView({ block: 'start', behavior: 'instant' });
}

// When a sign-in pause ends, in the device's own time format, or null when there is no pause now.
// Rounded up to the minute, as on the sign-in page, so the time shown is never before the pause ends.
// A pause that ends on another day says the day too.
function pausedUntil(iso) {
  const t = Date.parse(iso);
  if (!iso || Number.isNaN(t) || t <= Date.now()) return null;
  const at = new Date(Math.ceil(t / 60000) * 60000);
  const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return at.toDateString() === new Date().toDateString() ? time : `${dayText(at.toISOString())}, ${time}`;
}

// The parts of a Learner's page, top to bottom, from GET /api/learners/<id>/records.
function learnerPage({ records, unfinished }, learner) {
  const p = progressFrom(records), counted = countedRecords(records), reset = currentReset(records);
  const part = (cls, title, html) => `<section class="part ${cls}"><h2>${title}</h2>${html}</section>`;

  const done = unfinished && records.some(r => r.kind === 'set' && r.data.set_id === unfinished.set_id);
  const open = !done && unfinishedLine(unfinished);
  const until = learner && pausedUntil(learner.paused_until);
  const now = `<div class="now"><p class="theme">${esc(whereNow(p))}</p><p>${esc(nextSetLine(p, Date.now()))}</p>` +
    (open ? `<p class="sub">${esc(open)}</p>` : '') +
    (until ? `<p class="paused">Sign-in is paused until ${until} after too many tries.</p>` : '') + '</div>';

  // Whether facts answered right are still known when asked again after a gap: the number that says
  // whether the app is working.
  const ret = retention(p, Date.now()), gap = SPACING_MS / HOUR;
  const kept = ret.all.of
    ? `<p>Of ${plural(ret.all.of, 'time', 'times')} a fact was answered correctly and asked again at least ${gap} hours later, it was correct ${plural(ret.all.right, 'time', 'times')}.</p>` +
      `<p>In the last 14 days: ${ret.recent.right} of ${ret.recent.of}.</p>`
    : `<p>No fact has been asked again ${gap} or more hours after a correct answer yet.</p>`;

  const word = { new: 'New', seen: 'Seen', learned: 'Learned', solid: 'Solid' };
  const facts = DAYS.map(d => {
    const qs = QS.filter(q => q.day === d.day), fs = qs.map(q => p.facts[q.id]);
    const rows = qs.map(q => {
      const f = p.facts[q.id];
      return `<li><p class="mq">${esc(q.q)}</p><p>${word[standing(f)]}</p><p class="mcount">Asked ${f.asked}, right ${f.right}</p>` +
        `<p class="mcount">${f.lastAt === null ? 'Not asked yet' : `Last asked ${dayText(new Date(f.lastAt).toISOString())}`}</p>` +
        (f.wrong >= LEECH_WRONG ? '<p class="leech">Needs a different question</p>' : '') + '</li>';
    }).join('');
    return `<li><details><summary><span class="sname">Section ${d.day}: ${esc(d.title)}: ${fs.filter(isLearned).length} of ${fs.length} learned, ` +
      `${fs.filter(isSolid).length} solid</span></summary><ul class="sets facts">${rows}</ul></details></li>`;
  }).join('');

  const tests = counted.filter(r => r.kind === 'set' && r.data.type === 'test').reverse(), st = streak(p);
  const undated = p.tests.length - tests.length; // brought in from saved progress from before accounts
  const testList = p.tests.length ? `<p>${st >= READY_STREAK ? `Ready for the test: ${st} in a row` : `In a row so far: ${st} of ${READY_STREAK}`}</p>` +
    (tests.length ? `<ul>${tests.map(r => `<li>${whenText(r.at)}: ${setScore(r.data).right} of ${setScore(r.data).of}</li>`).join('')}</ul>` : '') +
    (undated > 0 ? `<p class="sub small">${plural(undated, 'earlier Practice test was', 'earlier Practice tests were')} done before the app kept dates.</p>` : '')
    : '<p>No Practice tests yet.</p>';

  const missed = missedMost(records);
  const missedList = missed.length ? (reset ? '<p class="sub small">Only answers since the latest Reset count here.</p>' : '') +
    `<ul>${missed.map(m => { const q = BY_ID[m.q]; return `<li><p class="mq">${esc(q.q)}</p><p>Correct answer: ${esc(q.a)}</p>` +
      `<p>Wrong answer chosen most often: ${esc(m.wrong)}</p><p class="mcount">Missed ${m.missed} of ${m.answered} times</p><p class="mpage">Driver manual, page ${q.p}</p></li>`; }).join('')}</ul>`
    : `<p>No question has been missed two or more times${reset ? ' since the latest Reset' : ''}.</p>`;

  const lines = studySessions(records);
  const history = lines.length ? `<ul class="sessions">${lines.map(e => e.kind === 'session'
    ? `<li><p class="when">${whenText(e.start)}</p><p>${lengthText(Date.parse(e.end) - Date.parse(e.start))}</p>` +
      (e.sets.length ? `<ul>${e.sets.map(s => `<li>${setName(s.type, s.section, s.number)}: ${s.right} of ${s.of}</li>`).join('')}</ul>` : '<p>Nothing finished.</p>') + '</li>'
    : `<li><p class="when">${whenText(e.at)}</p><p>${historyLine(e)}</p></li>`).join('')}</ul>`
    : '<p>No Study sessions yet.</p>';

  const manage = `<section class="part manage" id="manage"><h2>Manage this Learner</h2>` +
    ['Rename', 'Reset sign-in', 'Reset progress', 'Move', 'Delete'].map((label, k) =>
      `<button class="btn${label === 'Delete' ? ' bad' : ''}" type="button" data-act="${k}">${label}</button>`).join('') + '</section>';

  return now + part('retention', 'Retention', kept) + part('facts', 'Facts', `<ul class="sections">${facts}</ul>`) +
    part('tests', 'Practice tests', testList) + part('missedmost', 'Questions missed most', missedList) +
    part('history', 'Study sessions', history) + manage + '<button class="btn back" type="button">Back to Learners</button>';
}

// Managing Learners: Add a Learner, and Rename, Reset sign-in, Reset progress, Move and Delete
// on a Learner's page. Every action asks first, in literal words, and does nothing on No.
// Afterwards the list or the Learner's page loads again from the server.
const NAME_MAX = 64, PASSWORD_MIN = 8, PASSWORD_MAX = 128; // as the server checks them (server/auth.py)
const MANAGE_ERRORS = {
  'name-taken': 'Another account already uses that name. Choose a different name.',
  'bad-name': `The name must be 1 to ${NAME_MAX} characters.`,
  'bad-password': `The password must be ${PASSWORD_MIN} to ${PASSWORD_MAX} characters.`,
};
// Lengths are counted in characters, as the server counts them, not in UTF-16 units.
const chars = s => [...s].length;
const nameProblem = s => chars(s.trim()) >= 1 && chars(s.trim()) <= NAME_MAX ? null : 'bad-name';
const passwordProblem = s => chars(s) >= PASSWORD_MIN && chars(s) <= PASSWORD_MAX ? null : 'bad-password';

// A POST that changes something. A refusal throws an Error with its `status` and the server's
// error `code`; a good answer gives its JSON, or null when there is none.
async function change(path, body) {
  const r = await postJSON(path, body);
  if (r.ok) return r.status === 204 ? null : r.json();
  const answer = await r.json().catch(() => ({}));
  throw Object.assign(new Error('HTTP ' + r.status), { status: r.status, code: answer.error });
}

// A Helper's form on a screen of its own: `fields` (HTML), the button that goes on to ask first,
// and Cancel, which runs `cancel`. `submit` gets the form's values when the button is pressed.
function helperForm({ title, intro, fields, button, cancel, submit, problem }) {
  paint(`<section class="home helper"><h1 tabindex="-1">${title}</h1>${intro ? `<p class="sub">${intro}</p>` : ''}
    <form id="helperForm" class="signin" novalidate>${fields}<div id="formMsg" aria-live="polite"></div>
    <button class="btn primary" type="submit" id="formBtn">${button}</button></form>
    <button class="btn" type="button" id="cancelBtn">Cancel</button></section>`, 'h1');
  $('cancelBtn').onclick = () => { cancel(); window.scrollTo(0, 0); };
  $('helperForm').onsubmit = e => { e.preventDefault(); submit(); };
  if ($('fShow')) $('fShow').onchange = () => { $('fPassword').type = $('fShow').checked ? 'text' : 'password'; };
  if (problem) formMessage(MANAGE_ERRORS[problem] || problem);
}
function formMessage(text) {
  $('formMsg').innerHTML = `<p class="warn" tabindex="-1">${esc(text)}</p>`;
  $('formMsg').firstChild.focus();
}
const nameField = (label, value) => `<div class="field"><label for="fName">${label}</label><input id="fName" type="text" value="${esc(value)}" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"></div>`;
const passwordField = (label, value, shown) => `<div class="field"><label for="fPassword">${label}</label><input id="fPassword" type="${shown ? 'text' : 'password'}" value="${esc(value)}" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>` +
  `<label class="check"><input type="checkbox" id="fShow"${shown ? ' checked' : ''}>Show password</label>`;

// Ask first. `question` and `detail` are the literal words; Yes runs `act`, No runs `no`.
// If `act` fails for want of a connection, the question stays with a line saying so.
function confirmAction({ question, detail, yes, no, act }) {
  paint(`<section class="home helper"><h2 tabindex="-1">${esc(question)}</h2>${detail ? `<p>${esc(detail)}</p>` : ''}
    <div id="formMsg" aria-live="polite"></div>
    <button class="btn primary" type="button" id="confirmYes">${esc(yes)}</button>
    <button class="btn" type="button" id="confirmNo">No, go back</button></section>`, 'h2');
  $('confirmNo').onclick = () => { no(); window.scrollTo(0, 0); };
  $('confirmYes').onclick = async () => {
    const btn = $('confirmYes');
    if (btn.disabled) return;
    btn.disabled = true;
    try { await act(); window.scrollTo(0, 0); } catch (e) {
      if (e instanceof SignedOut || !btn.isConnected) return;
      btn.disabled = false;
      formMessage('The change could not be made. Check your connection and try again.');
    }
  };
}

// The buttons of Manage this Learner. `learner` is the Learner's row of GET /api/learners, `p` their Progress.
function wireManage(learner, p) {
  const back = () => openLearnerPage(learner, { at: 'manage' });
  const acts = [() => renameLearner(learner, back), () => resetSignIn(learner, back), () => resetProgress(learner, back),
    () => moveLearner(learner, back, p.unlockMove ? TOTAL_DAYS + 1 : p.cursor), () => deleteLearner(learner, back)];
  document.querySelectorAll('.manage [data-act]').forEach(b => b.onclick = () => { acts[Number(b.dataset.act)](); window.scrollTo(0, 0); });
}

// Rename: a new name, with the same rules as Add a Learner. `back` returns to the Learner's page.
function renameLearner(learner, back, typed = learner.name, problem = null) {
  helperForm({
    title: `Rename ${esc(learner.name)}`, problem, fields: nameField('New name', typed), button: 'Rename', cancel: back,
    submit: () => {
      const value = $('fName').value, bad = nameProblem(value);
      if (bad) return formMessage(MANAGE_ERRORS[bad]);
      const name = value.trim();
      confirmAction({
        question: `Rename ${learner.name} to ${name}?`, yes: 'Yes, rename', no: () => renameLearner(learner, back, value),
        act: async () => {
          let answer;
          try { answer = await change(`/api/learners/${learner.id}/rename`, { name }); } catch (e) {
            if (MANAGE_ERRORS[e.code]) return renameLearner(learner, back, value, e.code);
            if (e.status === 404) return openLearnerPage(learner);
            throw e;
          }
          openLearnerPage({ ...learner, name: answer.name }, { note: `${learner.name} is renamed ${answer.name}.` });
        },
      });
    },
  });
}

// Reset sign-in: a new password. The server ends every sign-in of the Learner and any pause on their name.
function resetSignIn(learner, back, v = { password: '', shown: false }, problem = null) {
  const name = learner.name;
  helperForm({
    title: `Reset sign-in for ${esc(name)}`, intro: `${esc(name)} will sign in with the new password.`, problem,
    fields: passwordField('New password', v.password, v.shown), button: 'Set the new password', cancel: back,
    submit: () => {
      const typed = { password: $('fPassword').value, shown: $('fShow').checked }, bad = passwordProblem(typed.password);
      if (bad) return formMessage(MANAGE_ERRORS[bad]);
      confirmAction({
        question: `Set a new password for ${name}?`,
        detail: `${name} will be signed out on every device and will need the new password to sign in.`,
        yes: 'Yes, set the new password', no: () => resetSignIn(learner, back, typed),
        act: async () => {
          try { await change(`/api/learners/${learner.id}/reset-sign-in`, { password: typed.password }); } catch (e) {
            if (MANAGE_ERRORS[e.code]) return resetSignIn(learner, back, typed, e.code);
            if (e.status === 404) return openLearnerPage(learner);
            throw e;
          }
          openLearnerPage(learner, { note: `${name}'s new password is set.` });
        },
      });
    },
  });
}

// Reset progress: a Reset record. Every fact is new again and new facts start at Section 1; the History stays.
function resetProgress(learner, back) {
  const name = learner.name;
  confirmAction({
    question: `Put ${name} back at the start of Section 1?`,
    detail: 'Every fact goes back to new, and Practice tests start over. The History is kept.',
    yes: 'Yes, reset progress', no: back,
    act: async () => {
      try { await change(`/api/learners/${learner.id}/reset-progress`, {}); } catch (e) {
        if (e.status === 404) return openLearnerPage(learner);
        throw e;
      }
      openLearnerPage(learner, { note: `${name}'s progress is reset to the start of Section 1.` });
    },
  });
}

// Move: a Move record that sets the Section new facts come from, 1 to 12, or 13 to unlock Practice
// tests. It changes no fact's standing.
const moveChoice = to => to > TOTAL_DAYS ? 'Unlock practice tests now' : `Start new facts from Section ${to}`;
function moveLearner(learner, back, to) {
  const name = learner.name;
  const options = Array.from({ length: TOTAL_DAYS + 1 }, (_, k) =>
    `<option value="${k + 1}"${k + 1 === to ? ' selected' : ''}>${moveChoice(k + 1)}</option>`).join('');
  helperForm({
    title: `Move ${esc(name)}`, button: 'Move', cancel: back,
    fields: `<div class="field"><label for="fTo">What to change for ${esc(name)}</label><select id="fTo">${options}</select></div>`,
    submit: () => {
      const chosen = Number($('fTo').value), choice = moveChoice(chosen);
      confirmAction({
        question: `${choice} for ${name}?`,
        detail: 'Every fact keeps its standing, and the History is kept. An unfinished practice quiz or test is dropped.',
        yes: `Yes, ${choice[0].toLowerCase()}${choice.slice(1)}`, no: () => moveLearner(learner, back, chosen),
        act: async () => {
          try { await change(`/api/learners/${learner.id}/move`, { to: chosen }); } catch (e) {
            if (e.status === 404) return openLearnerPage(learner);
            throw e;
          }
          openLearnerPage(learner, { note: chosen > TOTAL_DAYS ? `Practice tests are unlocked for ${name}.` : `${name}'s new facts now come from Section ${chosen}.` });
        },
      });
    },
  });
}

// Delete: the account and all of its records, for good. The question and the button are on one
// screen, and the button stays off until the Helper types the Learner's name (matched as at sign-in:
// capitals ignored, spaces at the start and end trimmed). Afterwards, back to the list.
function deleteLearner(learner, back) {
  const name = learner.name, key = s => s.trim().toLowerCase();
  paint(`<section class="home helper"><h1 tabindex="-1">Delete ${esc(name)}</h1>
    <p>Delete ${esc(name)} and all of ${esc(name)}'s progress and History? This cannot be undone.</p>
    <div class="field"><label for="fName">Type ${esc(name)} to delete</label><input id="fName" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div id="formMsg" aria-live="polite"></div>
    <button class="btn bad primary" type="button" id="deleteBtn" disabled>Delete ${esc(name)}</button>
    <button class="btn" type="button" id="keepBtn">No, keep ${esc(name)}</button></section>`, 'h1');
  const btn = $('deleteBtn');
  $('fName').oninput = () => { btn.disabled = key($('fName').value) !== key(name); };
  $('keepBtn').onclick = () => { back(); window.scrollTo(0, 0); };
  btn.onclick = async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    try { await change(`/api/learners/${learner.id}/delete`, { name: $('fName').value }); } catch (e) {
      if (e instanceof SignedOut || !btn.isConnected) return;
      if (e.status === 404) return renderHelper();
      btn.disabled = false;
      return formMessage(e.code === 'name-mismatch' ? `The name you typed does not match ${name}.`
        : 'The change could not be made. Check your connection and try again.');
    }
    renderHelper(`${name} is deleted.`);
    window.scrollTo(0, 0);
  };
}

// Add a Learner: a name and a password, then back to the list.
function addLearner(v = { name: '', password: '', shown: false }, problem = null) {
  helperForm({
    title: 'Add a Learner', intro: 'The Learner signs in with this name and password.', problem,
    fields: nameField('Name', v.name) + passwordField('Password', v.password, v.shown),
    button: 'Add this Learner', cancel: () => renderHelper(),
    submit: () => {
      const typed = { name: $('fName').value, password: $('fPassword').value, shown: $('fShow').checked };
      const bad = nameProblem(typed.name) || passwordProblem(typed.password);
      if (bad) return formMessage(MANAGE_ERRORS[bad]);
      const name = typed.name.trim();
      confirmAction({
        question: `Add a Learner named ${name}?`, yes: `Yes, add ${name}`, no: () => addLearner(typed),
        act: async () => {
          try { await change('/api/learners', { name, password: typed.password }); } catch (e) {
            if (MANAGE_ERRORS[e.code]) return addLearner(typed, e.code);
            throw e;
          }
          renderHelper(`${name} is added.`);
        },
      });
    },
  });
}

startUp();
// The service worker (sw.js) keeps the page, the questions, the fonts and the icons, so the app opens with no connection.
window.addEventListener('load', () => {
  if (navigator.serviceWorker) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
});
</script>
</body>
</html>
