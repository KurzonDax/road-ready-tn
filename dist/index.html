<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Ready TN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@600;800&display=swap">
<style>
/* Layout: one calm column. Home shows only what's next; a question screen; a short results screen. Highway guide-sign palette. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17221c;
  --muted: #5b6a61;
  --line: #d6ddd7;
  --control-line: #7f8d84;
  --guide: #1f5f3f;
  --guide-ink: #ffffff;
  --guide-soft: #e2efe7;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --focus: #2a6fdb;
  --font-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32; --control-line: #66796c;
    --guide: #3f9a6c; --guide-ink: #0c1410; --guide-soft: #1f3328;
    --bad: #f08a80; --bad-soft: #3d1f1c; --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32; --control-line: #66796c;
  --guide: #3f9a6c; --guide-ink: #0c1410; --guide-soft: #1f3328;
  --bad: #f08a80; --bad-soft: #3d1f1c; --focus: #7fb0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
::selection { background: var(--guide); color: var(--guide-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > header { align-self: flex-start; }
.plate { align-self: flex-start; margin: 0; background: var(--guide); color: var(--guide-ink); font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 9vw, 48px); }
h2 { font-size: clamp(24px, 6vw, 30px); }
.theme { font-size: 20px; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.small { font-size: 15px; }
.home { display: flex; flex-direction: column; gap: 14px; }

/* Your progress: a plain status track. Every finished section looks the same; scores live in the "See your section scores" panel. */
.track { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.label { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0; }
.road { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; list-style: none; margin: 0; padding: 0; }
.stop { min-width: 30px; height: 30px; padding: 0 2px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--muted); background: var(--surface); font-variant-numeric: tabular-nums; }
.stop.wide { padding: 0 8px; }
.stop.done { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.stop.now { border: 2.5px solid var(--guide); color: var(--ink); background: var(--surface); }

.scores { border-top: 1.5px solid var(--line); }
.scores > summary { font-weight: 700; color: var(--ink); cursor: pointer; padding: 12px 0; min-height: 44px; list-style-position: inside; }
.scores ul { list-style: none; margin: 0; padding: 0 0 4px; display: flex; flex-direction: column; }
.scores li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.scores li > div { display: flex; flex-direction: column; min-width: 0; flex: 1 1 14rem; }
.scores .sname { font-weight: 700; }
.scores .sscore { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }

.btn { font: inherit; font-weight: 700; font-size: 19px; padding: 16px 18px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
.btn.primary { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.btn.slim { width: auto; font-size: 16px; padding: 10px 14px; min-height: 44px; border-radius: 10px; }
.link { font: inherit; font-size: 16px; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px 8px; min-height: 44px; align-self: center; }
.fine { font-size: 15px; color: var(--muted); margin: 18px 0 0; border-top: 1.5px solid var(--line); padding-top: 14px; }
.warn { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); color: var(--ink); font-size: 16px; }

.progress { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; }
.bar { flex: 1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--guide); width: 0; }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.q { font-family: var(--font-body); font-size: clamp(21px, 5vw, 25px); font-weight: 700; line-height: 1.3; margin: 0; }
.visual { display: flex; justify-content: center; }
.visual svg { width: 110px; height: 110px; max-width: 100%; }
.options { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.opt { font: inherit; font-size: 18px; text-align: left; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); margin: 0; }
button.opt { cursor: pointer; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--control-line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.opt .otext { display: flex; flex-direction: column; gap: 2px; }
.opt .tag { font-size: 15px; font-weight: 700; }
.opt.rest { border-color: var(--line); color: var(--muted); }
.opt.rest .key { border-color: var(--line); }
.opt.right { border-color: var(--guide); background: var(--guide-soft); font-weight: 700; }
.opt.right .key { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { border-color: var(--bad); }
.feedback { border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-weight: 700; margin: 0; }
.verdict.good { color: var(--guide); }
.why { margin: 0; }
.src { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.src figcaption { font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.src blockquote { margin: 0; font-size: 16px; color: var(--muted); }
#nextBtn { position: sticky; bottom: 16px; box-shadow: 0 8px 20px -8px rgb(12 20 16 / .45); }

.score { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.missed { border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); padding: 0 22px; }
.missed > summary { font-weight: 700; cursor: pointer; padding: 14px 0; min-height: 44px; }
.missed ul { list-style: none; margin: 0; padding: 0 0 18px; display: flex; flex-direction: column; gap: 14px; }
.missed li { border-top: 1.5px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.missed p { margin: 0; }
.missed .mq { font-weight: 700; }
.missed .mwhy, .missed .mpage { color: var(--muted); font-size: 16px; }

/* The one moment that breaks the template: a full guide sign, white border inset like the real thing. */
.sign { background: var(--guide); color: var(--guide-ink); border-radius: 16px; padding: 28px 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 6px var(--guide), inset 0 0 0 9px var(--guide-ink); }
.sign h1, .sign h2 { color: inherit; }
.sign h1 { font-size: clamp(38px, 10vw, 56px); }
.sign p { margin: 0; font-size: 20px; }

.streak { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ticks { display: flex; gap: 6px; }
.ticks span { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--control-line); background: var(--surface); }
.ticks span.on { background: var(--guide); border-color: var(--guide); }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

<div class="wrap">
  <header><p class="plate">Road Ready TN</p></header>
  <main id="stage"></main>

</div>

<script>
const DATA = {"days": [{"day": 1, "title": "Signs: shapes and colors"}, {"day": 2, "title": "Signals, arrows, and road lines"}, {"day": 3, "title": "Right of way and intersections"}, {"day": 4, "title": "Speed and following distance"}, {"day": 5, "title": "Stops you must make (school buses, trains, emergency vehicles, stop lines)"}, {"day": 6, "title": "Turning and signaling"}, {"day": 7, "title": "Lanes and passing"}, {"day": 8, "title": "Parking"}, {"day": 9, "title": "Interstate driving"}, {"day": 10, "title": "Night, weather, and emergencies (skids, flooding, breakdowns)"}, {"day": 11, "title": "Alcohol and drugs"}, {"day": 12, "title": "Phones, seat belts, crashes, and sharing the road"}], "qs": [{"id": "a-095", "q": "What does an eight-sided (octagon) sign mean?", "a": "Stop", "o": ["Yield", "Railroad ahead", "No passing"], "why": "The octagon is the only eight-sided sign. It is always red, and it means you must come to a complete stop.", "p": 36, "src": "This sign is the only eight-sided sign on the roadway.", "sign": "octagon", "day": 1}, {"id": "a-099", "q": "What does a triangular (three-sided) sign pointing down mean?", "a": "Slow down and yield to traffic", "o": ["Always come to a complete stop", "Signal and go at regular speed", "Railroad crossing ahead"], "why": "A yield sign means slow down and yield to traffic. If no cars are coming, you do not have to come to a complete stop. If traffic is heavy, always stop.", "p": 36, "src": "you need not come to a complete stop but you must slow down and enter the intersection with caution.", "s": 1, "sign": "triangle", "day": 1}, {"id": "a-085", "q": "What does an orange sign color mean?", "a": "Construction and maintenance warning", "o": ["General warning of hazards on the road ahead", "School zones", "Motorist services"], "why": "Orange is used only for construction and maintenance signs.", "p": 35, "src": "ORANGE is used as a background color for construction and maintenance signs and shall not be used for any other purpose.", "swatch": "#f07c1c", "day": 1}, {"id": "a-084", "q": "What does a yellow sign color mean?", "a": "General warning", "o": ["Construction and maintenance warning", "Guidance and directions", "Public recreation areas"], "why": "Yellow is the background for warning signs (except where orange is used) and school signs.", "p": 35, "src": "YELLOW: General warning.", "swatch": "#f2c230", "day": 1}, {"id": "a-108", "q": "What does a diamond-shaped sign mean?", "a": "A hazardous or unexpected condition ahead", "o": ["A special law or regulation that you must obey", "A railroad crossing is here", "A stop sign is required"], "why": "Diamond signs call for caution and usually a slower speed.", "p": 36, "src": "Diamond Shape — Hazardous Or Unexpected Condition Ahead", "sign": "diamond", "day": 1}, {"id": "a-101", "q": "What does a round (circular) sign mean?", "a": "A railroad crossing is ahead", "o": ["A school zone with children is ahead", "A stop sign is ahead", "A hospital is ahead"], "why": "The round sign always means you are approaching a railroad grade crossing. Slow down and be ready to stop.", "p": 36, "src": "This circular sign always means that you are approaching a railroad grade crossing.", "sign": "circle", "day": 1}, {"id": "a-087", "q": "What does a blue sign color mean?", "a": "Motorist services and information", "o": ["Guidance and directions on interstate highways", "Public recreation areas", "Construction warning"], "why": "Blue is for motorist services, including police services and rest areas.", "p": 35, "src": "BLUE: Motorist services and information", "swatch": "#1f4fa0", "day": 1}, {"id": "a-086", "q": "What does a green sign color mean?", "a": "Guidance (directions)", "o": ["Motorist services", "Public recreation areas", "General warning"], "why": "Green is used for guide signs and mileposts.", "p": 35, "src": "GREEN: Guidance", "swatch": "#1f5f3f", "day": 1}, {"id": "a-109", "q": "What shape are regulatory signs (like speed limits and lane use)?", "a": "Rectangle", "o": ["Diamond", "Circle", "Triangle"], "why": "A regulatory sign is always a rectangle, telling you about laws and regulations.", "p": 35, "src": "a regulatory sign is always a rectangle, telling you about laws and regulations", "day": 1}, {"id": "a-089", "q": "What does a fluorescent yellow-green sign color mean?", "a": "School zones and pedestrian areas", "o": ["Construction and maintenance zones", "Rest areas", "Railroad crossings"], "why": "Fluorescent yellow-green is the color for school zones and pedestrian areas like crosswalks.", "p": 35, "src": "FLUORESCENT YELLOW-GREEN IS THE COLOR FOR SCHOOL ZONES!", "swatch": "#c6e83a", "day": 1}, {"id": "a-147", "q": "What should you do when a steady yellow light appears?", "a": "Slow down and stop, unless you are too close to stop safely", "o": ["Speed up to get through before it turns red", "Keep going at the same speed", "Slam on the brakes, even if you are already in the intersection"], "why": "Yellow means the light is about to turn red. Slow down and stop, unless you are too close to stop safely. Do not speed up to try to get through before the light turns red.", "p": 41, "src": "You must stop if it is safe to do so. Do not speed up to beat the light.", "day": 2}, {"id": "a-156", "q": "What should you do at a flashing red light?", "a": "Come to a complete stop, like a stop sign", "o": ["Slow down and go with caution", "Stop only if you see cross traffic coming toward you", "Treat it as a yield sign"], "why": "Flashing red means a complete stop, the same as a stop sign. Look both ways, yield, and go when safe.", "p": 41, "src": "FLASHING RED Complete stop. Same as stop sign.", "day": 2}, {"id": "a-157", "q": "What should you do at a flashing yellow light?", "a": "Slow down and go through with caution", "o": ["Come to a complete stop, just like at a stop sign", "Speed up to clear the intersection", "Stop and wait for a green light"], "why": "Flashing yellow means slow down and proceed with caution.", "p": 41, "src": "FLASHING YELLOW Slow down and proceed with caution", "day": 2}, {"id": "a-152", "q": "What does a green turn arrow (protected turn) mean?", "a": "You may turn that way, and you have the right-of-way", "o": ["You must yield to all oncoming traffic before you turn", "You may go in any direction", "You must stop, then turn"], "why": "When the arrow is green you have the right of way and may go only in the arrow's direction, after yielding to vehicles and pedestrians already in the intersection.", "p": 41, "src": "When the arrow is green, you have the right-of-way and may drive the vehicle only in the direction of the arrow", "day": 2}, {"id": "a-154", "q": "Your lane has a red arrow, but other lanes have green and the path looks clear. May you turn?", "a": "No, all turns are prohibited", "o": ["Yes, if the path through the intersection is clear", "Yes, after a complete stop", "Yes, if you signal first"], "why": "When the arrow is red or your lane has the red light, all turns are prohibited, even if other lanes have green.", "p": 41, "src": "When the arrow is red or your lane has the red light, all turns are prohibited.", "day": 2}, {"id": "a-153", "q": "What does a yellow left arrow mean?", "a": "Your protected turn is ending, so get ready to yield", "o": ["You may turn left with the right-of-way", "You must stop now and wait for the next green light", "Oncoming traffic must stop for you"], "why": "When the arrow changes to yellow, the protected turn is about to end. Prepare to yield to oncoming traffic.", "p": 41, "src": "When the arrow changes to yellow, prepare to yield to oncoming traffic.", "s": 1, "day": 2}, {"id": "a-155", "q": "What does a flashing yellow arrow mean?", "a": "Turn left after yielding to oncoming cars and pedestrians", "o": ["You have the right-of-way to turn left, and oncoming cars must stop", "You may not turn left at all", "You must stop before turning left"], "why": "A flashing yellow arrow lets you turn left after yielding to all oncoming traffic, bicyclists, and pedestrians. Wait for a safe gap.", "p": 41, "src": "If you see a flashing yellow arrow, you are allowed to turn left after yielding to all oncoming traffic", "day": 2}, {"id": "a-168", "q": "What color lines separate traffic moving in opposite directions?", "a": "Yellow", "o": ["White", "Blue", "Orange"], "why": "Lines separating traffic moving in opposite directions are yellow.", "p": 42, "src": "Lines separating traffic moving in opposite directions are yellow.", "day": 2}, {"id": "a-175", "q": "What color lines separate lanes of traffic going the same direction?", "a": "White", "o": ["Yellow", "Blue", "Orange"], "why": "Multiple lanes of traffic flowing in the same direction are separated by white lane markings.", "p": 43, "src": "Multiple lanes of traffic that flow in the same direction are separated by white lane markings.", "day": 2}, {"id": "a-172", "q": "The center has a solid yellow line and a broken yellow line. The broken line is on your side. What does this mean?", "a": "You may pass when it is safe", "o": ["You are not allowed to pass here, even if no traffic is coming", "You may only make right turns here", "You must drive below the speed limit"], "why": "If the broken yellow line is on your side, you are in the passing zone and may pass when it is safe. If the solid line is on your side, you may not pass.", "p": 43, "src": "If the broken yellow line is on your side, you are in the \"passing zone\" and may pass", "s": 1, "day": 2}, {"id": "a-178", "q": "When must you yield to pedestrians at a crosswalk?", "a": "When they are in or about to enter the crosswalk", "o": ["Only when they are in the middle of the street", "Only at crosswalks that have a WALK signal showing", "Only at marked crosswalks"], "why": "You must yield to pedestrians who are in or about to enter the crosswalk or street. Not all crosswalks are marked.", "p": 43, "src": "yield the right-of-way to pedestrians who are in or are about to enter the crosswalk or street.", "day": 3}, {"id": "d-075", "q": "A pedestrian is using a white cane with a red tip or a guide dog. What must you do?", "a": "Always yield to the pedestrian", "o": ["Honk so the pedestrian knows where you are", "Yield only if the pedestrian is in a marked crosswalk", "Drive around the pedestrian slowly"], "why": "Always yield to blind pedestrians carrying a white or red-tipped white cane or using a guide dog.", "p": 103, "src": "Always yield to blind pedestrians carrying a white, metallic, red tipped white cane or using a guide dog.", "day": 3}, {"id": "b-110", "q": "You are entering a main road from a driveway or parking lot. Who must yield?", "a": "You must yield to all vehicles on the main road", "o": ["Vehicles already on the main road must yield to you", "Whoever is going faster goes first", "Whoever honks first goes first"], "why": "When entering a main road from a driveway, alley, parking lot or roadside, yield to all vehicles already on it.", "p": 53, "src": "When entering a main road from a driveway, alley, parking lot or roadside, you must yield to all vehicles already on the main road.", "day": 3}, {"id": "a-150", "q": "Your light turns green. What must you still do?", "a": "Yield to pedestrians and vehicles still in the intersection", "o": ["Go immediately, because a green light gives you the right of way", "Honk to clear the intersection", "Wait three seconds before moving"], "why": "Green means go IF the intersection is clear. You must still yield to pedestrians and vehicles still in the intersection.", "p": 41, "src": "GREEN: Go IF the intersection is clear. You must yield to pedestrians and vehicles still in the intersection at light change.", "day": 3}, {"id": "b-118", "q": "At an ALL-WAY stop, who goes first?", "a": "The vehicle that got there first", "o": ["The biggest vehicle at the intersection", "The vehicle that is going straight", "The vehicle on the left side"], "why": "At all-way stops, all vehicles stop, and the first to arrive goes first.", "p": 54, "src": "the vehicle reaching the intersection first gets to go first (of course, ALL vehicles must stop).", "day": 3}, {"id": "b-119", "q": "Two vehicles reach an all-way stop at the same time. Who goes first?", "a": "The vehicle on the right", "o": ["The vehicle on the left", "The faster vehicle", "The vehicle turning left"], "why": "If more than one vehicle arrives at the same time, yield to the vehicle on the right.", "p": 54, "src": "If more than one vehicle arrives at the same time, yield the right of way to the vehicle on the right", "day": 3}, {"id": "a-151", "q": "You have a green light (not an arrow) and want to turn left. Who must you yield to?", "a": "Oncoming vehicles", "o": ["No one, because green gives you the right-of-way", "Only vehicles behind you", "Only vehicles turning right"], "why": "The green signal gives permission to go, but you must yield to oncoming vehicles if turning left.", "p": 41, "src": "Yield to oncoming vehicles if you are turning left.", "day": 3}, {"id": "b-121", "q": "At a “T” intersection, your road ends at a main road. Who must yield?", "a": "You must yield to traffic from both directions", "o": ["Main road traffic must yield to you", "Only traffic coming from your left yields", "Whoever reaches the intersection first goes"], "why": "Vehicles on the road that ends must yield to traffic from both directions on the main road.", "p": 54, "src": "the vehicles on the road ending must yield to oncoming traffic from both directions on the main road", "day": 3}, {"id": "a-159", "q": "A traffic signal is not working at all. What does Tennessee law require?", "a": "Treat it as an all-way stop", "o": ["Treat it as a yield for everyone", "Go through if you are on the bigger road", "Treat it like a flashing yellow light"], "why": "If a signal is not working, treat the intersection as an all-way stop.", "p": 41, "src": "if a signal is not working, the intersection is to be treated as if it were a ll-way stop intersection.", "day": 3}, {"id": "b-123", "q": "May you enter an intersection if you cannot get all the way through it without stopping?", "a": "No, wait until traffic ahead clears", "o": ["Yes, if your light is green", "Yes, if you are turning", "Yes, if traffic is moving slowly"], "why": "Do not enter unless you can get through without stopping. Blocking an intersection can get you a ticket.", "p": 54, "src": "Do not enter an intersection unless you can get through it without having to stop.", "day": 3}, {"id": "b-031", "q": "What is the maximum speed set by Tennessee law for interstate highways?", "a": "70 mph", "o": ["65 mph", "75 mph", "80 mph"], "why": "The interstate maximum is 70 mph. Drive that fast only in ideal conditions. Some sections have a lower posted limit.", "p": 47, "src": "The maximum speed set by Tennessee law for interstate highways is 70 m.p.h.", "day": 4}, {"id": "b-054", "q": "Under normal conditions, what is the closest you should follow another vehicle?", "a": "No closer than two seconds", "o": ["No closer than one second", "No closer than one car length", "No closer than five seconds"], "why": "If you reach the fixed point before counting to two seconds, slow down. Repeat until you are at least two seconds behind.", "p": 49, "src": "Repeat this exercise until you are following no closer than two seconds.", "day": 4}, {"id": "b-056", "q": "In bad weather, at night, at higher interstate speeds, or when following a motorcycle, what following distance should you use?", "a": "At least four seconds", "o": ["At least one second", "At least two seconds", "At least three car lengths"], "why": "Increase from two seconds to a minimum of four seconds for better reaction time in these conditions.", "p": 49, "src": "A minimum of four seconds should allow for better reaction time and a safer space cushion under these conditions including following a motorcycle.", "day": 4}, {"id": "b-020", "q": "What does the Basic Speed Rule teach?", "a": "Drive at a speed that is safe for the conditions", "o": ["Always drive at exactly the posted speed limit", "Drive 5 mph under the posted limit", "Drive as fast as the car ahead of you"], "why": "The Basic Speed Rule is a safety principle, not a law. It does not set an exact limit. The conditions decide what speed is safe.", "p": 46, "src": "it teaches that the speed you may drive is limited by current conditions.", "day": 4}, {"id": "b-030", "q": "Unless another speed is posted, what is the speed limit on primary and secondary state and federal highways?", "a": "55 mph", "o": ["45 mph", "60 mph", "65 mph"], "why": "Unless posted otherwise, the limit on these highways is 55 mph.", "p": 47, "src": "Unless otherwise posted, the speed limit on primary and secondary state and federal highways is 55 m.p.h.", "day": 4}, {"id": "b-055", "q": "At what speeds does the two-second rule for following at a safe distance hold true?", "a": "At any speed", "o": ["Only at speeds up to 30 mph", "Only at speeds up to 55 mph", "Only at speeds up to 45 mph"], "why": "The two-second rule works at any speed on state and U.S. highways with moderate speed limits. In bad weather, at night, and at higher interstate speeds, increase it to at least four seconds.", "p": 49, "src": "This principle will hold true at any speed on state and U.S. highways with moderate speed limits.", "s": 1, "day": 4}, {"id": "b-053", "q": "To check your following distance, you watch the car ahead pass a fixed point, like a sign post. What do you do next?", "a": "Count seconds until you reach that spot", "o": ["Count the cars between you and it", "Measure the distance in car lengths instead", "Check your speedometer and mirrors"], "why": "Count “one-thousand and one, one-thousand and two” until you reach the same point.", "p": 48, "src": "count the seconds it takes you to reach the same spot.", "day": 4}, {"id": "b-052", "q": "Most rear-end crashes are caused by drivers who are doing what?", "a": "Tailgating (following too closely)", "o": ["Driving under the speed limit", "Using their turn signals", "Driving with headlights on"], "why": "Rear-end crashes are common, and most are caused by tailgating drivers.", "p": 48, "src": "Rear-end crashes are very common and most of these crashes are caused by drivers who are \"tailgating.\"", "day": 4}, {"id": "b-039", "q": "When are school zone speed limits in effect?", "a": "When children are going to or from school, or at recess", "o": ["Only from 7 a.m. to 9 a.m. on weekdays, all year", "Only when a police officer is parked in the zone", "All day and night, every day of the whole year"], "why": "School zone speed limits are in effect when children are going to or from school, or during a school recess.", "p": 47, "src": "Speed limits in all school zones are regulated when children are going to or from the school or during a school recess hour.", "day": 4}, {"id": "b-046", "q": "With anti-lock brakes (ABS), how should you press the brake pedal to stop?", "a": "Press down firmly and hold it without pumping", "o": ["Pump it quickly several times", "Light taps every second", "Press it, then release, then press again"], "why": "With ABS, keep firm, steady pressure. Pumping the pedal disengages the anti-lock system.", "p": 48, "src": "When slowing or stopping, apply firm, steady pressure to the brake pedal. Never pump the pedal with ABS.", "day": 4}, {"id": "b-064", "q": "At a stop sign with a clearly marked stop line, where must you stop?", "a": "Behind the stop line", "o": ["With your front wheels on the line", "Past the line where you can see", "At the edge of the cross street"], "why": "If there is a white stop line, you must stop your vehicle behind it.", "p": 49, "src": "You must stop your vehicle behind this line.", "day": 5}, {"id": "b-124", "q": "An emergency vehicle with a siren is approaching. What does Tennessee law require you to do?", "a": "Pull to the right edge and stop", "o": ["Speed up to get out of the way", "Stop right where you are in the lane", "Pull to the left edge and keep going"], "why": "Yield, drive as close as possible to the right edge or curb, and stop until it passes or a police officer directs you.", "p": 54, "src": "immediately drive to a position parallel to, and as close as possible to the right hand edge or curb of the roadway stop.", "day": 5}, {"id": "b-084", "q": "A school bus has yellow lights flashing. What does this mean?", "a": "The bus is about to stop, so slow down and get ready to stop", "o": ["The bus is moving, so it is safe to pass it now", "Children are getting on or off the bus right now", "The bus has broken down and needs your help"], "why": "Yellow flashing lights mean the bus is about to stop to load or unload children.", "p": 51, "src": "When the yellow lights on the front and back of the bus are flashing the bus is preparing to stop to load or unload", "day": 5}, {"id": "b-085", "q": "A school bus has red lights flashing and its stop arm out. When may you start driving again?", "a": "When the red lights stop, the stop arm goes in, and the bus starts moving", "o": ["As soon as the children have reached the sidewalk safely", "After you have waited 30 seconds and see no more children", "When the bus driver honks the horn twice to signal you"], "why": "Wait until the red lights turn off, the stop arm is withdrawn, and the bus begins moving.", "p": 51, "src": "Motorists must stop their cars and wait until the red flashing lights are turned off, the stop arm is withdrawn, and the bus begins", "day": 5}, {"id": "b-086", "q": "A school bus is stopped at an intersection loading children. Which drivers must stop?", "a": "Drivers from all directions", "o": ["Only drivers behind the bus", "Only drivers facing the bus", "Only drivers turning right"], "why": "When a school bus is stopped at an intersection to load or unload, drivers from ALL directions must stop.", "p": 51, "src": "drivers from ALL directions are required to stop until the bus resumes motion", "day": 5}, {"id": "a-107", "q": "At a crossing with lights and a gate, when may you go after a train passes?", "a": "When the gates are up and the lights stop flashing", "o": ["As soon as the train passes your car", "When the gates start to rise", "When the lights stop flashing, even if the gates are still down"], "why": "Stop when the lights begin flashing, before the gate comes down. Remain stopped until the gates are raised and the lights stop.", "p": 36, "src": "Remain stopped until the gates are raised and the lights stop flashing.", "day": 5}, {"id": "b-077", "q": "A train is coming. How far from the railroad tracks must you stop?", "a": "Between 15 and 50 feet", "o": ["Between 5 and 10 feet", "Between 50 and 100 feet", "At least 100 feet"], "why": "Stop between 15 and 50 feet from the tracks. Never stop on the tracks.", "p": 50, "src": "When you approach a railroad crossing and a train is coming, you must stop between 15 and 50 feet from the railroad tracks.", "day": 5}, {"id": "b-126", "q": "You are in the middle of an intersection when an emergency vehicle approaches. What should you do?", "a": "Drive on through, then pull over", "o": ["Stop right there in the intersection", "Back up out of the intersection", "Turn left right away to get clear"], "why": "Drive on through the intersection before pulling over, or you may block the emergency vehicle's path.", "p": 54, "src": "If you are in an intersection, drive on through the intersection before pulling over", "day": 5}, {"id": "b-089", "q": "You are on a highway divided by a median that cars cannot drive on. A school bus is stopped on the other side with its red lights flashing. What should you do?", "a": "You don't have to stop, but drive carefully", "o": ["Stop until the bus starts moving again", "Stop for 10 seconds, then go slowly", "Speed up so you pass the bus quickly"], "why": "On a highway divided by a median or barrier that cars cannot drive on, drivers on the other side do not have to stop, but they must drive with caution.", "p": 51, "src": "divided by median space or a barrier not suitable for vehicular traffic, the driver need not stop, but should proceed with caution.", "day": 5}, {"id": "d-138", "q": "How far away from a school bus should children stay?", "a": "Ten feet", "o": ["Two feet", "Five feet", "Fifty feet"], "why": "The Danger Zone is on all sides of the bus. Children should stay ten feet away and NEVER go behind the bus.", "p": 111, "src": "Children should stay ten feet away from the school bus and NEVER go behind the bus.", "day": 5}, {"id": "a-003", "q": "Where should you place your hands on the steering wheel?", "a": "9 o'clock and 3 o'clock", "o": ["11 o'clock and 6 o'clock", "7 o'clock and 5 o'clock", "10 o'clock and 12 o'clock"], "why": "Left hand at 9 o'clock, right hand at 3 o'clock. This position helps avoid injury if the air bag opens.", "p": 28, "src": "place the left hand at the 9 o'clock position and the right hand at 3 o'clock position", "s": 1, "day": 6}, {"id": "b-147", "q": "How far before a turn must you turn on your turn signal?", "a": "At least 50 feet", "o": ["At least 10 feet", "At least 25 feet", "At least 500 feet"], "why": "Turn on your signal at least 50 feet before the turn or lane change.", "p": 56, "src": "At least 50 feet before the turn, you must turn on your turn signal lights.", "day": 6}, {"id": "a-146", "q": "Unless a sign says otherwise, may you turn right on a red light?", "a": "Yes, after a complete stop, if there are no pedestrians or cross traffic", "o": ["No, never on a red light", "Yes, without stopping if the road is clear", "Yes, but only between midnight and 6 a.m. when traffic is light"], "why": "Unless posted otherwise, you may turn right on red after a complete stop when no pedestrians or cross traffic are present.", "p": 41, "src": "you may turn right on red after coming to a complete stop and when no pedestrians or cross traffic are present.", "day": 6}, {"id": "b-139", "q": "Does using your turn signal give you the right-of-way?", "a": "No, signaling does not give you the right-of-way", "o": ["Yes, as soon as you turn your signal on", "Yes, once you have signaled for 50 feet", "Yes, but only when you are driving on two-lane roads"], "why": "Signals tell others your plan, but they do NOT give you the right-of-way.", "p": 55, "src": "However, signaling does NOT give you the rightof-way.", "day": 6}, {"id": "b-169", "q": "When making a right turn, which lane should you turn into?", "a": "The lane closest to the right curb", "o": ["The lane closest to the center line", "Any open lane on the new street", "The lane farthest to the left"], "why": "Get close to the right curb before turning, and turn into the travel lane closest to the right curb.", "p": 58, "src": "Move your vehicle around the corner and into the travel lane closest to the right curb.", "day": 6}, {"id": "b-174", "q": "Who has the right-of-way when you reach a roundabout?", "a": "Vehicles already in the roundabout", "o": ["Vehicles that are entering the roundabout", "The largest vehicle, such as a truck", "Whichever driver honks the horn first"], "why": "Yield to vehicles already circulating. Enter when there is a gap.", "p": 59, "src": "Upon reaching the roundabout, yield to vehicles already within the circulating traffic.", "day": 6}, {"id": "a-004", "q": "About how far back from the steering wheel should your body be?", "a": "10 to 12 inches", "o": ["6 to 8 inches", "18 to 24 inches", "3 to 5 inches"], "why": "Sit about 10 to 12 inches back. At this distance an air bag hits your chest, not your chin or face.", "p": 27, "src": "Your body should be about 10 to 12 inches back from the steering wheel with or without an air bag.", "s": 1, "day": 6}, {"id": "d-097", "q": "A bicyclist holds the left arm out, bent up at the elbow, hand pointing upward. What does this signal mean?", "a": "Right turn", "o": ["Left turn", "Stopping or slowing", "Go ahead and pass"], "why": "Left arm bent upward at 90 degrees means right turn. A rider may also point the right arm straight out to the right.", "p": 105, "src": "Right Turn Extend your left arm out sideways bent at a 90-degree angle at the elbow joint, hand pointing upward", "day": 6}, {"id": "b-159", "q": "Making a left turn from a two-way street onto a two-way street, which lane should you turn into?", "a": "The lane just to the right of the center line", "o": ["The lane closest to the right curb", "Whichever lane has the least traffic", "The center turn lane of the new street, if there is one"], "why": "Turn into the first lane past the center line. Never turn wide into the right lane, because oncoming drivers who are turning right will use that lane.", "p": 57, "src": "be sure to turn into the first lane past the center line.", "day": 6}, {"id": "b-163", "q": "Which lane must you be in before making a left turn from a one-way street?", "a": "The lane nearest the left curb", "o": ["The lane nearest the center of the street", "The lane nearest the right curb", "Any lane, if you signal"], "why": "From a one-way street, approach the turn in the lane nearest the left curb.", "p": 57, "src": "Make your approach in the traffic lane furthermost to the left curb of the street.", "s": 1, "day": 6}, {"id": "b-228", "q": "When you pass a bicycle going the same direction as you, how much space does the law require?", "a": "3 feet", "o": ["1 foot", "2 feet", "6 feet"], "why": "The law requires at least 3 feet between you and the bicycle, kept until you are safely past.", "p": 63, "src": "leave at least a distance between you and the bicycle of not less than 3 feet. It’s the law!", "s": 1, "day": 7}, {"id": "a-176", "q": "What do broken white lines between lanes mean?", "a": "You may change lanes or pass if it is safe", "o": ["You may never change lanes", "Traffic on the other side is going the opposite way", "The lane is ending soon"], "why": "Broken white lines mean you may cross them to pass or change lanes if it is safe.", "p": 43, "src": "Broken white lines between lanes of traffic mean you may cross the lines to pass or change lanes", "day": 7}, {"id": "a-170", "q": "What do two solid yellow lines between lanes mean?", "a": "No passing from either direction", "o": ["Passing allowed from either direction", "Passing allowed only from the left side", "Passing allowed when no cars are coming"], "why": "Two solid yellow lines mean you MAY NOT cross from either direction, even if no oncoming traffic is in view.", "p": 42, "src": "Two solid yellow lines between lanes of traffic mean you MAY NOT cross the lines from either direction", "day": 7}, {"id": "b-207", "q": "Before changing lanes, how do you check your blind spot?", "a": "Turn your head and look over your shoulder", "o": ["Check only your inside rearview mirror", "Check only your outside side mirror", "Honk your horn once and then move over"], "why": "Mirrors alone miss vehicles beside you. Turn your head and look over your shoulder.", "p": 61, "src": "Look over your shoulder in the direction you will be moving.", "day": 7}, {"id": "b-223", "q": "Should you pass when approaching a hill or curve?", "a": "No, do not pass", "o": ["Yes, if you go fast", "Yes, if you honk", "Yes, if the car ahead is slow"], "why": "Do not pass when approaching a hill or curve, because you cannot see oncoming traffic.", "p": 63, "src": "Do not pass when approaching a hill or curve.", "day": 7}, {"id": "a-166", "q": "You have a yellow line on your right and a white line on your left. What does this mean?", "a": "You are going the wrong way", "o": ["You are in the correct lane", "You are in a passing zone", "You are in a turn lane"], "why": "If you find yellow to your right and white to your left, you are going the wrong way.", "p": 42, "src": "If you ever find yourself with yellow to your right and white to your left, you are going the wrong way.", "day": 7}, {"id": "d-106", "q": "May you share a lane with a motorcycle?", "a": "No, a motorcycle has the right to the full lane", "o": ["Yes, if the motorcycle is riding near the edge", "Yes, on roads with a speed limit over 45 mph", "Yes, if you are both going the same speed"], "why": "Motorcycles have the right to use the full lane. You must never try to share a lane with a motorcycle.", "p": 107, "src": "Motorcycles have the right to the use of the full lane.", "day": 7}, {"id": "d-018", "q": "After you pass a vehicle, when is it safest to return to the driving lane?", "a": "When you see both of its headlights in your rearview mirror", "o": ["As soon as your front bumper is past the other car's front bumper", "When the other driver waves you over with a hand signal", "As soon as you are side by side with the other vehicle"], "why": "Do not count on other drivers to make room. Wait until you see both headlights of the car you passed in your rearview mirror.", "p": 94, "src": "until you can see both headlights of the vehicle you just passed in the rearview mirror.", "day": 7}, {"id": "b-215", "q": "On a two-lane road, when may you pass another vehicle on the right?", "a": "When it is turning left, if it is safe", "o": ["Whenever it is going below the limit", "By driving on the paved shoulder", "By using an empty bike lane"], "why": "On a two-lane road, you may pass on the right only when the other vehicle is turning left and it is safe. Never drive on the shoulder to pass.", "p": 62, "src": "When the vehicle overtaken has signaled to make or is about to make a left turn.", "day": 7}, {"id": "d-116", "q": "Where are a truck's blind spots, or No-Zones?", "a": "Right in front, on both sides, and up to 200 feet behind", "o": ["Only directly behind the truck, up to 20 feet", "Only on the left side of the cab, near the driver's door", "Only in front of the truck, up to 500 feet"], "why": "A truck's blind spots are immediately in front, on either side, and up to 200 feet in the rear.", "p": 109, "src": "A truck’s blind spots are immediate in front, on either side of the car and up to 200 feet in the rear.", "day": 7}, {"id": "b-249", "q": "When pulling out of any parking space, including a parallel space, what must you do?", "a": "Look, signal, and yield", "o": ["Honk and pull out", "Pull out fast to merge", "Wait for a car to wave you in"], "why": "A driver must look, signal and yield the right-of-way when coming out of any parking space.", "p": 65, "src": "A driver must look, signal and yield the right-of-way when coming out of any type of parking space, including parallel spaces.", "day": 8}, {"id": "b-256", "q": "Which of these is an illegal place to park?", "a": "On a bridge or in a tunnel", "o": ["In a marked parking space", "20 feet past a fire hydrant", "In a parking lot"], "why": "It is illegal to park on any bridge or in a tunnel.", "p": 65, "src": "Upon any bridge or within a tunnel", "day": 8}, {"id": "b-250", "q": "It is illegal to park within how many feet of a fire hydrant?", "a": "15 feet", "o": ["5 feet", "10 feet", "30 feet"], "why": "No parking within 15 feet of a fire hydrant.", "p": 65, "src": "Within 15 feet of a fire hydrant", "s": 1, "day": 8}, {"id": "b-252", "q": "It is illegal to park within how many feet of a crosswalk?", "a": "20 feet", "o": ["5 feet", "10 feet", "50 feet"], "why": "No parking within 20 feet of a crosswalk or in the crosswalk area.", "p": 65, "src": "Within 20 feet of a crosswalk or in the crosswalk marked area", "day": 8}, {"id": "b-253", "q": "It is illegal to park within how many feet of a traffic signal or stop sign?", "a": "30 feet", "o": ["10 feet", "15 feet", "50 feet"], "why": "No parking within 30 feet of a traffic signal, stop sign or other traffic control device.", "p": 65, "src": "Within 30 feet of a traffic signal, stop sign or any other traffic control device", "day": 8}, {"id": "b-251", "q": "It is illegal to park within how many feet of a railroad crossing?", "a": "50 feet", "o": ["15 feet", "20 feet", "100 feet"], "why": "No parking within 50 feet of a railroad crossing.", "p": 65, "src": "Within 50 feet of a railroad crossing", "s": 1, "day": 8}, {"id": "b-268", "q": "After parallel parking, your car should be no farther than how far from the curb?", "a": "18 inches", "o": ["6 inches", "12 inches", "24 inches"], "why": "When you finish parallel parking, you should be no more than 18 inches from the curb.", "p": 66, "src": "the vehicle should be no farther away from the curb than 18", "day": 8}, {"id": "b-260", "q": "You park facing DOWNHILL next to a curb. Which way should you turn your front wheels?", "a": "Toward the curb", "o": ["Away from the curb", "Straight ahead", "Toward the center of the road"], "why": "Turn the wheels toward the curb and set the parking brake. If the car rolls, it rolls into the curb.", "p": 65, "src": "On a downhill with a curb: Turn the front wheels toward the curb (right) and set the parking brake.", "day": 8}, {"id": "b-261", "q": "You park facing UPHILL next to a curb. Which way should you turn your front wheels?", "a": "Away from the curb", "o": ["Toward the curb", "Straight ahead", "Toward the edge of the road"], "why": "Turn wheels away from the curb. If the car rolls back, it rolls into the curb and stops.", "p": 65, "src": "On an uphill with a curb: Turn the front wheels away", "day": 8}, {"id": "b-262", "q": "You park on a hill with NO curb. Which way should you turn your front wheels?", "a": "Toward the edge of the road", "o": ["Toward the center of the road", "Straight ahead", "Away from the edge of the road"], "why": "With no curb, uphill or downhill, turn the wheels toward the edge of the road (right) so the car rolls away from traffic.", "p": 65, "src": "On a downhill without a curb: Turn the front wheels toward the edge of the roadway (right).", "day": 8}, {"id": "c-024", "q": "You miss your exit on the interstate. What must you do?", "a": "Go on to the next exit", "o": ["Back up on the shoulder to the exit", "Make a U-turn at the median", "Stop on the shoulder and wait"], "why": "It is illegal to back up, make a U-turn, or cross the median on the interstate.", "p": 70, "src": "If you miss your exit, you must proceed to the next exit.", "day": 9}, {"id": "c-010", "q": "You are driving slower than the flow of traffic on the interstate. Which lane must you use?", "a": "The right lane", "o": ["The left lane", "The center lane", "The shoulder"], "why": "Slower traffic must stay in the right lane.", "p": 69, "src": "if you drive at a speed below the flow of traffic, you must use the right lane.", "day": 9}, {"id": "c-001", "q": "When you enter an interstate highway, what should you do?", "a": "Check for cars, speed up to match traffic, and merge when clear", "o": ["Stop at the end of the ramp, check for cars, then enter when it is safe", "Slow down to 25 mph before you enter the traffic lane", "Drive onto the shoulder first, then merge when clear"], "why": "Use the ramp to speed up to the speed of interstate traffic. Then merge when the way is clear.", "p": 68, "src": "You must use the merging or acceleration lane to speed up and merge with fast-moving traffic already on the interstate.", "s": 1, "day": 9}, {"id": "c-004", "q": "You are merging onto the interstate from a ramp. Who must yield the right-of-way?", "a": "You, the driver entering from the ramp", "o": ["The cars already on the interstate", "Whichever car is going slower", "Whichever car is larger"], "why": "Drivers on the interstate should make room if they can, but the entering driver must yield.", "p": 68, "src": "It is your responsibility to yield the right-of-way to other cars on the interstate.", "day": 9}, {"id": "c-021", "q": "When you leave the interstate, when should you start to slow down?", "a": "After you enter the deceleration lane", "o": ["While you are still in the travel lane", "Before you change lanes toward the exit", "Only when you reach the end of the ramp"], "why": "Keep your speed until you are in the deceleration (exit) lane, then slow to the ramp's posted speed." ht where you are in your lane and turn on your flashers", "Move to the left shoulder and turn off your lights", "Keep driving slowly in the right lane"], "why": "Get off the road to the right shoulder or emergency stopping area as soon as you can, and warn other traffic.", "p": 72, "src": "If you have vehicle trouble, move to the right shoulder or emergency stopping area as soon as you can. Turn on your emergency flashers", "day": 9}, {"id": "c-003", "q": "Safe interstate driving demands complete awareness of higher speed driving and what else?", "a": "Constant alertness by the driver", "o": ["A vehicle with a large engine", "Driving in the left lane at all times", "Keeping up with the fastest car"], "why": "Interstate driving needs both complete awareness of higher speed driving and constant alertness.", "p": 68, "src": "Safe use of the interstates demands a complete awareness of a higher speed type of driving and constant alertness by the driver.", "s": 1, "day": 9}, {"id": "c-075", "q": "You come to a road covered by flood water. What should you do?", "a": "Turn around and find another way", "o": ["Drive through slowly in low gear", "Drive through quickly to keep momentum", "Follow another car through the water"], "why": "Do not drive into flood water. The water may be deeper than it looks, and the road under it may be washed out.", "p": 76, "src": "TURN AROUND, DON’T DROWN®.", "day": 10}, {"id": "d-167", "q": "Your vehicle stalls on the railroad tracks. What should you do first?", "a": "Get everyone out right away and away from the tracks", "o": ["Keep trying to restart the car until the engine starts", "Stay in the car with your safety belt on", "Push the car off the tracks yourself"], "why": "All occupants should exit immediately and get away from the tracks, even if you do not see a train.", "p": 114, "src": "all occupants should exit the vehicle immediately and get away from the tracks even if you do not see a train.", "day": 10}, {"id": "c-042", "q": "How does driving at night compare to driving in the daytime?", "a": "More dangerous, because your headlights limit how far you can see", "o": ["Safer, because there is less traffic and there are fewer distractions", "Safer, so you can increase your speed", "Just as safe, as long as your lights are on"], "why": "Your range of visibility at night is limited by your headlights, so drive slower.", "p": 74, "src": "considerably more hazardous and difficult than daytime driving because your range of visibility is limited by your headlights.", "s": 1, "day": 10}, {"id": "b-001", "q": "At night, when must your headlights be on?", "a": "From 30 minutes after sunset until 30 minutes before sunrise", "o": ["From sunset until sunrise", "From 1 hour after sunset until 1 hour before sunrise", "From 15 minutes after sunset until 15 minutes before sunrise"], "why": "Tennessee law requires headlights from 30 minutes after sunset until 30 minutes before sunrise.", "p": 45, "src": "Your car headlights must be turned on 30 minutes after sunset until 30 minutes before sunrise.", "day": 10}, {"id": "c-050", "q": "At night, you must dim your high beams when meeting or overtaking a vehicle within how many feet?", "a": "500 feet", "o": ["200 feet", "300 feet", "1,000 feet"], "why": "Dim your lights when meeting or overtaking vehicles within 500 feet.", "p": 74, "src": "Meeting or overtaking vehicles within 500 feet.", "day": 10}, {"id": "c-043", "q": "Why should you use low beams, not high beams, in fog?", "a": "Low beams let you see better and help others see you", "o": ["Low beams make your car harder for others to see", "High beams drain the car battery in fog", "High beams make the fog get thicker"], "why": "In fog or mist, high beam light reflects back into your eyes. Low beams put the light on the road.", "p": 75, "src": "In fog or mist, never put your headlights on high beam because the light will be reflected back into your eyes.", "s": 1, "day": 10}, {"id": "a-032", "q": "How can you te
