<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Ready TN</title>
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Road Ready">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Self-hosted fonts, Latin subset (see src/fonts/README.md). Overpass is one variable font for 600 to 800. */
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/atkinson-hyperlegible/atkinson-hyperlegible-400.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/atkinson-hyperlegible/atkinson-hyperlegible-700.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-style: normal; font-weight: 600 800; font-display: swap; src: url("fonts/overpass/overpass-variable.woff2") format("woff2"); }
/* Layout: one calm column. Home shows only what's next; a question screen; a short results screen. Highway guide-sign palette. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17221c;
  --muted: #5b6a61;
  --line: #d6ddd7;
  --control-line: #7f8d84;
  --guide: #1f5f3f;
  --guide-ink: #ffffff;
  --guide-soft: #e2efe7;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --focus: #2a6fdb;
  --font-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32; --control-line: #66796c;
    --guide: #3f9a6c; --guide-ink: #0c1410; --guide-soft: #1f3328;
    --bad: #f08a80; --bad-soft: #3d1f1c; --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32; --control-line: #66796c;
  --guide: #3f9a6c; --guide-ink: #0c1410; --guide-soft: #1f3328;
  --bad: #f08a80; --bad-soft: #3d1f1c; --focus: #7fb0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
}
::selection { background: var(--guide); color: var(--guide-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > header { align-self: flex-start; }
.plate { align-self: flex-start; margin: 0; background: var(--guide); color: var(--guide-ink); font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 9vw, 48px); }
h2 { font-size: clamp(24px, 6vw, 30px); }
.theme { font-size: 20px; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.small { font-size: 15px; }
.home { display: flex; flex-direction: column; gap: 14px; }

/* Your progress: a plain status track. Every finished section looks the same; scores live in the "See your section scores" panel. */
.track { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.label { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0; }
.road { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; list-style: none; margin: 0; padding: 0; }
.stop { min-width: 30px; height: 30px; padding: 0 2px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--muted); background: var(--surface); font-variant-numeric: tabular-nums; }
.stop.wide { padding: 0 8px; }
.stop.done { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.stop.now { border: 2.5px solid var(--guide); color: var(--ink); background: var(--surface); }

.scores { border-top: 1.5px solid var(--line); }
.scores > summary { font-weight: 700; color: var(--ink); cursor: pointer; padding: 12px 0; min-height: 44px; list-style-position: inside; }
.scores ul { list-style: none; margin: 0; padding: 0 0 4px; display: flex; flex-direction: column; }
.scores li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.scores li > div { display: flex; flex-direction: column; min-width: 0; flex: 1 1 14rem; }
.scores .sname { font-weight: 700; }
.scores .sscore { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }

.btn { font: inherit; font-weight: 700; font-size: 19px; padding: 16px 18px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
.btn.primary { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.btn.slim { width: auto; font-size: 16px; padding: 10px 14px; min-height: 44px; border-radius: 10px; }
.link { font: inherit; font-size: 16px; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px 8px; min-height: 44px; align-self: center; }
.fine { font-size: 15px; color: var(--muted); margin: 18px 0 0; border-top: 1.5px solid var(--line); padding-top: 14px; }
.fine p { margin: 0; }
.fine .link { font-size: 15px; padding: 10px 0; margin-top: 4px; }

/* Sign-in: one short form, labels above their fields. */
.signin { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-weight: 700; }
.field input { font: inherit; font-size: 19px; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 17px; cursor: pointer; align-self: flex-start; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--guide); }
#signInMsg:empty { display: none; }
.warn { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); color: var(--ink); font-size: 16px; }

.progress { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; }
.bar { flex: 1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--guide); width: 0; }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.q { font-family: var(--font-body); font-size: clamp(21px, 5vw, 25px); font-weight: 700; line-height: 1.3; margin: 0; }
.visual { display: flex; justify-content: center; }
.visual svg { width: 110px; height: 110px; max-width: 100%; }
.options { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.opt { font: inherit; font-size: 18px; text-align: left; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); margin: 0; }
button.opt { cursor: pointer; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--control-line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.opt .otext { display: flex; flex-direction: column; gap: 2px; }
.opt .tag { font-size: 15px; font-weight: 700; }
.opt.rest { border-color: var(--line); color: var(--muted); }
.opt.rest .key { border-color: var(--line); }
.opt.right { border-color: var(--guide); background: var(--guide-soft); font-weight: 700; }
.opt.right .key { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { border-color: var(--bad); }
.feedback { border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-weight: 700; margin: 0; }
.verdict.good { color: var(--guide); }
.why, .also, .picked { margin: 0; }
/* Compare: one row per fact, the fact (and its picture) beside what it means. */
.compare { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.compare li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.compare .cfact { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.compare .cpic { display: block; line-height: 0; }
.compare .cpic svg { width: 48px; height: 48px; }
.rulehead { font-family: var(--font-body); font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--muted); }
.rule { font-size: clamp(21px, 5vw, 25px); font-weight: 700; line-height: 1.3; margin: 0; }
.back { margin: 0; color: var(--muted); }
.src { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.src figcaption { font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.src blockquote { margin: 0; font-size: 16px; color: var(--muted); }
#nextBtn { position: sticky; bottom: 16px; box-shadow: 0 8px 20px -8px rgb(12 20 16 / .45); }

.score { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.score span { font-size: 28px; }
.missed { border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); padding: 0 22px; }
.missed > summary { font-weight: 700; cursor: pointer; padding: 14px 0; min-height: 44px; }
.missed ul { list-style: none; margin: 0; padding: 0 0 18px; display: flex; flex-direction: column; gap: 14px; }
.missed li { border-top: 1.5px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.missed p { margin: 0; }
.missed .mq { font-weight: 700; }
.missed .mwhy, .missed .mpage { color: var(--muted); font-size: 16px; }

/* The one moment that breaks the template: a full guide sign, white border inset like the real thing. */
.sign { background: var(--guide); color: var(--guide-ink); border-radius: 16px; padding: 28px 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 6px var(--guide), inset 0 0 0 9px var(--guide-ink); }
.sign h1, .sign h2 { color: inherit; }
.sign h1 { font-size: clamp(38px, 10vw, 56px); }
.sign p { margin: 0; font-size: 20px; }

.stopped { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); }
.stopped p { margin: 0; }
.streak { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ticks { display: flex; gap: 6px; }
.ticks span { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--control-line); background: var(--surface); }
.ticks span.on { background: var(--guide); border-color: var(--guide); }

/* The Helper's view: a list of Learners, and one Learner's page in plain parts, top to bottom. Long names and answers wrap instead of widening the page. */
.helper, .helper button { overflow-wrap: anywhere; }
.learners { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lrow { font: inherit; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); cursor: pointer; }
.lrow .lname { font-weight: 700; font-size: 20px; }
.lrow .lwhen { color: var(--muted); font-size: 16px; }
.link.top { align-self: flex-start; padding-left: 0; }
.now { display: flex; flex-direction: column; gap: 4px; }
.now p, .part p { margin: 0; }
.part { border-top: 1.5px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.part h2 { font-size: 22px; }
.part ul { list-style: none; margin: 0; padding: 0; }
.part > ul > li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.part > ul > li:first-child { border-top: 0; padding-top: 0; }
.sections summary { cursor: pointer; min-height: 44px; }
.sections .sname, .when, .mq { font-weight: 700; }
.sections .sscore { display: block; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.part .sets { padding: 6px 0 4px 22px; font-size: 16px; display: flex; flex-direction: column; gap: 4px; }
.missedmost .mpage, .missedmost .mcount, .facts .mcount { color: var(--muted); font-size: 16px; }
.facts li { padding: 8px 0; border-top: 1px solid var(--line); }
.facts .leech { font-weight: 700; }
/* Managing a Learner: plain buttons at the bottom of their page; each action asks first on a screen of its own. */
.note { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--guide-soft); color: var(--ink); font-size: 16px; }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.bad.primary { background: var(--bad); color: var(--surface); }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.field select { font: inherit; font-size: 19px; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
#formMsg:empty { display: none; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="wrap">
  <header><p class="plate">Road Ready TN</p></header>
  <main id="stage"></main>
  <p id="announce" class="vh" aria-live="polite"></p>
</div>

<script>
// Sign colors are sampled from the drawings on page 36 of the manual.
const SIGNS = {
  octagon: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#ef3d42" stroke="#fff" stroke-width="4"/></svg>',
  triangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="4,10 96,10 50,92" fill="#ef3d42"/><polygon points="20,20 80,20 50,73" fill="#fff"/></svg>',
  circle: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#fadc12" stroke="#231f20" stroke-width="3"/><line x1="22" y1="22" x2="78" y2="78" stroke="#231f20" stroke-width="6"/><line x1="78" y1="22" x2="22" y2="78" stroke="#231f20" stroke-width="6"/></svg>',
  crossbuck: '<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#231f20" stroke-width="3"/></g><g transform="rotate(-45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#231f20" stroke-width="3"/></g></svg>',
  diamond: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 96,50 50,96 4,50" fill="#fbdc10" stroke="#231f20" stroke-width="3"/></svg>',
  rectangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="20" y="6" width="60" height="88" rx="4" fill="#fff" stroke="#231f20" stroke-width="3"/><rect x="30" y="20" width="40" height="6" fill="#231f20"/><rect x="30" y="36" width="40" height="6" fill="#231f20"/><rect x="34" y="56" width="32" height="24" fill="#231f20"/></svg>',
  swatch: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="80" height="56" rx="6" fill="${c}" stroke="#555" stroke-width="2"/></svg>`
};
let DAYS = [], QS = [], TOTAL_DAYS = 0, BY_ID = {}; // filled from questions.json when the page starts
let GROUPS = [], GROUP_BY_ID = {}; // the groups of easily mixed-up facts (data/groups.json), likewise
// Each fact's wordings, from questions.json: its own question first, then the other wordings in id order.
let WORDINGS = {};
// The learning engine (docs/specs/learning-engine.md, docs/adr/0002-*). Every rule below reads these.
const HOUR = 60 * 60 * 1000;
const FIRST_LOOK = true;          // a new fact starts with an unscored question; false starts with its rule screen
const COUNTED_TARGET = 10;        // counted questions in a Set, at most
const NEW_PER_SET = 5;            // new facts in a Set, at most
const MIN_SET = 5;                // a Set with fewer counted questions is filled with not-yet-due facts (GAP + 1)
const GAP = 4;                    // screens for other facts between a fact's rule screen and its counted question, at least
const RE_ASK_GAP = 3;             // question screens for other facts between a wrong counted answer and its re-ask
const RE_ASK_CAP = 4;             // re-asks in one Set, at most
const SPACING_MS = 12 * HOUR;     // two right answers count as separate successes only this far apart
const LADDER_MS = [12 * HOUR, 48 * HOUR]; // after the first and second spaced success, how long until due again
const MAINTENANCE_MS = 7 * 24 * HOUR;     // a solid fact is due again after this long
const LEECH_WRONG = 6;            // wrong counted answers after which the Helper's view flags the fact
const TEST_LEN = 30, READY_SCORE = 27, READY_STREAK = 3, PASS_SCORE = 24;
// The device copy of the signed-in Learner, saved under `rrtn-learner-<account id>`:
// {records: what the server last handed back, pending: finished Sets not yet stored on the
// server, unfinished: the Set on screen, so leaving the page doesn't lose answers, rejected:
// records the server refused as badly shaped, kept aside so they don't hold back the others}.
let copy = null, copyFor = null; // the copy, and the account id it belongs to
const copyKey = id => `rrtn-learner-${id}`;
// The saved state from before accounts. The page only reads it, for the one-time import; it never writes or deletes it.
const OLD_KEY = 'tn-permit-daily-v1';
// Set once this device has made an Imported record. It belongs to the device, not to a Learner, so
// it outlasts sign-out and only the first Learner to sign in here gets the import (decision #7).
const IMPORTED_KEY = 'rrtn-old-progress-imported';
const canSave = (() => { try { localStorage.setItem('rrtn-check', '1'); localStorage.removeItem('rrtn-check'); return true; } catch (e) { return false; } })();
function readCopy(id) {
  try {
    const c = JSON.parse(localStorage.getItem(copyKey(id)));
    if (c && Array.isArray(c.records) && Array.isArray(c.pending)) {
      return { records: c.records, pending: c.pending, unfinished: c.unfinished || null,
        rejected: Array.isArray(c.rejected) ? c.rejected : [] };
    }
  } catch (e) {}
  return null;
}
function saveCopy() { try { localStorage.setItem(copyKey(copyFor), JSON.stringify(copy)); } catch (e) {} }
const copyRecords = () => copy.records.concat(copy.pending);
// S is the Learner's Progress (see progressFrom), worked out from every record in the copy, sent
// or waiting, plus `run`: the unfinished Set as saved.
let S = null;
function workOut() { S = Object.assign(progressFrom(copyRecords()), { run: copy.unfinished }); }
let run = null; // the Set on screen

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// These read the signed-in Learner's Progress `S`, or another Progress passed in (the Helper's view).
function streak(p = S) { let n = 0; for (let i = p.tests.length - 1; i >= 0 && p.tests[i] >= READY_SCORE; i--) n++; return n; }
const ready = (p = S) => streak(p) >= READY_STREAK;

// A fact's standing, from its counted answers: new (none), seen (no spaced success yet), learned
// (one or two), solid (three or more). Standings only rise; a wrong answer makes the fact due instead.
function standing(f) {
  if (!f.asked) return 'new';
  return f.spacedRights === 0 ? 'seen' : isSolid(f) ? 'solid' : 'learned';
}
const isLearned = f => f.spacedRights > 0; // learned or solid
const isSolid = f => f.spacedRights >= 3;
// When a fact that is not new is due again: at once after a wrong newest answer, else up the ladder.
function dueAt(f) {
  if (!f.lastRight) return -Infinity;
  return f.lastAt + (isSolid(f) ? MAINTENANCE_MS : LADDER_MS[f.spacedRights - 1]);
}
const isDue = (f, now) => f.asked > 0 && dueAt(f) <= now;
// The ids of the facts due at `now`, in the order a Set takes them: wrong last (oldest first), then learned,
// then solid (earliest due first); ties in the order of sections.json.
function dueFacts(p, now) {
  const rank = f => !f.lastRight ? 0 : isSolid(f) ? 2 : 1;
  const key = f => !f.lastRight ? f.lastAt : dueAt(f);
  return QS.map(q => q.id).filter(id => isDue(p.facts[id], now)) // sort is stable, so ties keep QS order
    .sort((a, b) => rank(p.facts[a]) - rank(p.facts[b]) || key(p.facts[a]) - key(p.facts[b]));
}
const learnedCount = (p = S) => QS.filter(q => isLearned(p.facts[q.id])).length;
const solidCount = (p = S) => QS.filter(q => isSolid(p.facts[q.id])).length;
const sectionFacts = (p, day) => QS.filter(q => q.day === day).map(q => p.facts[q.id]);
const sectionDone = (p, day) => sectionFacts(p, day).every(isLearned);
const unlocked = (p = S) => p.unlockMove || QS.every(q => isLearned(p.facts[q.id]));
// Sections in the order new facts come from them: the Section cursor first, then on round to the one before it.

// A Learner's Progress from their records (docs/adr/0001-*, 0002-*), counting only those after the

function progressFrom(records) {

  const add = (q, at, right) => {

// A group is due for a Compare screen once all its facts are learned and none was answered in the

function groupDue(p, g, now) {
  const facts = g.facts.map(f => p.facts[f.id]);
  if (!facts.every(isLearned) || Math.max(...facts.map(f => f.lastAt)) > now - SPACING_MS) return false;
  const last = p.groupAt[g.id];

// The facts the next Set asks about, by the spec's steps 1 to 4: {group: the first due group, or null;

// A group block: the group's Compare screen, then one counted question per fact, shuffled. In a group

    const others = shuffle(g.facts.filter(o => o !== f)).slice(0, 3).map(o => o.label);

// A choice question in wording `q`: its own answer and wrong choices, shuffled.

const wordingFor = (p, id) => WORDINGS[id].reduce((best, q) => (p.byWording[q] || 0) < (p.byWording[best] || 0) ? q : best);
// The next Set as a list of screens ({kind, id, format, options, chosen, at, group}), from setPlan

// The question a screen asks: its wording `q` (the fact's own question when it has none).
const asked = s => BY_ID[s.q || s.id];
// A reverse question's answer is its fact's label in the group; any other question's is its wording's answer.
const labelOf = (group, id) => GROUP_BY_ID[group].facts.find(f => f.id === id).label;
const answerOf = s => s.format === 'reverse' ? labelOf(s.group, s.id) : asked(s).a;
const questionText = s => s.format === 'reverse' ? GROUP_BY_ID[s.group].reverse.replace('{answer}', BY_ID[s.id].a) : asked(s).q;

// Sends the records waiting on this device, up to 100 (and under the server's body limit) at a
// time. Those the server stored, or skipped because it already has them, move from `pending` to
// `records`. If the server can't be reached they stay in `pending`, and are sent when the app
// opens, when the device comes back online, after the next finished Set, or before sign-out.
// One send runs at a time; a call made meanwhile sends again once it ends.
let sending = null, sendAgain = false;

async function sendWaiting() {
  const mine = copy;

      if (batch.length && (batch.length === 100 || size + n > BATCH_BYTES)) break;
      batch.push(x);
      size += n;
    }
    let r, body;
    try {
      r = await postJSON('/api/records', { records: batch });
      if (r.status === 400) body = await r.json();
    } catch (e) { return; }
    if (copy !== mine) return;
    if (body && body.error === 'bad-record' && batch[body.index]) {

      // one after it. It is kept aside rather than deleted.
      const bad = batch[body.index];

// Sends the unfinished Set (or null once it is finished) to the server, so the Learner can go on

  unfinishedUnsent = true;

  try {
    while (unfinishedUnsent && copy === mine) {
      unfinishedUnsent = false;
      const r = await postJSON('/api/unfinished', { set: mine.unfinished });
      if (!r.ok) { unfinishedUnsent = copy === mine; break; }
    }
  } catch (e) {
    unfinishedUnsent = copy === mine;
  } finally {
    sendingUnfinished = false;
  }
}

window.addEventListener('online', () => {
  if (!copy) return;
  sendPending();
  if (unfinishedUnsent) sendUnfinished();
});

// A finished Set's name in the Helper's History, from its record's type, Section and Set number.
// 'day', 'redo' and 'review' are Sets from before the learning engine.
const setName = (type, section, number) => type === 'daily' ? `Set ${number}` : type === 'test' ? 'Practice test'
  : type === 'review' ? 'Review' : type === 'redo' ? `Section ${section} again` : `Section ${section}`;

let painted = false, onHome = false; // onHome: the Learner's home screen is showing
function paint(html, focus) {
  onHome = false;
  $('stage').innerHTML = html;
  if (painted && focus) { const el = document.querySelector(focus); if (el) el.focus({ preventScroll: true }); }
  painted = true;
}
const toTop = () => window.scrollTo({ top: 0, behavior: 'instant' });

// The progress track: a marker per Section, done when its 10 facts are learned, and Practice tests.
function roadMarkers() {
  const next = cursorOrder(S).find(day => sectionFacts(S, day).some(f => !f.asked)), isReady = ready(), open = unlocked();
  const item = (cls, label, sr) => `<li class="stop ${cls}"${cls.includes('now') ? ' aria-current="step"' : ''}><span aria-hidden="true">${label}</span><span class="vh">${sr}</span></li>`;
  let html = DAYS.map(d => sectionDone(S, d.day) ? item('done', d.day, `Section ${d.day}, finished`)
    : d.day === next ? item('now', d.day, `Section ${d.day}, next`)
    : item('', d.day, `Section ${d.day}, not finished`)).join('');

  const anyDone = isReady || DAYS.some(d => sectionDone(S, d.day)), anyNext = !isReady && (next !== undefined || open);
  const legend = anyDone ? `<p class="sub small">Green means finished.${anyNext ? ' The outlined one is next.' : ''}</p>` : '';
  return `<section class="track" aria-labelledby="trackLabel"><h2 class="label" id="trackLabel">Your progress</h2><ol class="road">${html}</ol>${legend}</section>`;
}

function sectionsPanel() {
  const rows = DAYS.map(d => {
    const facts = sectionFacts(S, d.day), solid = facts.filter(isSolid).length;
    return `<li><div><span class="sname">Section ${d.day}: ${esc(d.title)}</span><span class="sscore">${facts.filter(isLearned).length} of ${facts.length} learned, ${solid} solid</span></div></li>`;
  }).join('');

}
const factsLine = (p = S) => `${learnedCount(p)} of ${QS.length} facts learned. ${solidCount(p)} solid.`;

const fillOnly = plan => !plan.block.length && !plan.due.length && !plan.fresh.length;
// The line under "Set N" on the home screen: what the next Set holds.
function planLine(plan) {
  const k = plan.fresh.length, f = plan.fill.length, d = plan.due.length;
  if (!QS.some(q => S.facts[q.id].asked)) return `${k} new rules, one at a time. There is no time limit.`;
  if (fillOnly(plan)) return `Nothing is due. This set goes over ${f} facts you already know.`;
  return [plan.block.length ? `Compare: ${plan.group.title}.` : '', d ? `${plural(d, 'question comes', 'questions come')} back.` : '',

// The fine print at the bottom of the Learner's home screen, with a quiet Sign out beside it.
const disclaimer = `<footer class="fine"><p>This is a practice app. It is not made by the State of Tennessee. The questions come from the Tennessee Comprehensive Driver License Manual, July 1, 2022 edition.</p><button class="link" type="button" id="signOutBtn">Sign out</button></footer>`;

function renderHome() {
  run = null;

  // the place of Start the set; a Practice test's comes first, and the other buttons ask before
  // throwing its saved answers away.
  const top = saved && saved.kind === 'daily'
    ? `<h1 tabindex="-1">Set ${saved.number}</h1>${stoppedLine(saved)}`
    : `<h1 tabindex="-1">Set ${S.sets + 1}</h1>${saved ? stoppedLine(saved) : ''}<p class="sub">${esc(planLine(plan))}</p>

      ${isReady ? `<div class="sign"><h2>Ready for the test</h2><p>You got ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row.</p></div>`
        : `<h2>Practice tests</h2><p class="sub">The real test passes at ${PASS_SCORE} of ${TEST_LEN}. The app's goal is ${READY_SCORE} of ${TEST_LEN} on three practice tests in a row.</p>`}
      ${scores.length ? `<p class="sub">Your last practice tests: ${scores.join(', ')}</p>` : ''}
      ${saved && saved.kind === 'test' ? '' : `<button class="btn${testFirst ? ' primary' : ''}" type="button" id="testBtn">${isReady ? 'Take another practice test' : 'Start a practice test'}</button>`}
    </section>`;
