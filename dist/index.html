    <section class="home">
      ${top}
      ${canSave ? '' : '<p class="warn">This browser is not keeping a copy of your answers on this device. If you close this page while offline, answers not yet saved will be lost.</p>'}
      <p class="theme">${factsLine()}</p>
      ${tests}
      ${roadMarkers()}
      ${sectionsPanel()}
      ${disclaimer}
    </section>`, 'h1');
  onHome = true;
  if ($('startBtn')) $('startBtn').onclick = () => startOver(saved, 'daily');
  if ($('testBtn')) $('testBtn').onclick = () => startOver(saved, 'test');
  if (saved) {
    $('resumeBtn').onclick = () => { run = saved; renderScreen(); };
    $('overBtn').onclick = () => { dropUnfinished(); start(saved.kind); };
  }
  $('signOutBtn').onclick = () => confirmSignOut(renderHome);
}

// What the Learner was doing in a Set stopped partway through, for a sentence ("You stopped partway through …").
const doing = saved => saved.kind === 'daily' ? `Set ${saved.number}` : 'a practice test';
const answeredSoFar = saved => saved.screens.filter(s => isQuestion(s) && s.chosen !== null).length;
function stoppedLine(saved) {
  return `<div class="stopped">
      <p>You stopped partway through ${doing(saved)}. You answered ${answeredSoFar(saved)} of ${saved.screens.filter(isQuestion).length} questions. Your answers are saved.</p>
      <button class="btn primary" type="button" id="resumeBtn">Continue where I stopped</button>
      <button class="link" type="button" id="overBtn">Start over from question 1 (this clears these answers)</button>
    </div>`;
}
function dropUnfinished() { copy.unfinished = S.run = null; saveCopy(); }

// Starts a daily Set or a Practice test (`kind`). With answers saved in a Set stopped partway
// through, it asks first and says that those answers will be cleared.
function startOver(saved, kind) {
  if (!saved || !answeredSoFar(saved)) { if (saved) dropUnfinished(); return start(kind); }
  const n = answeredSoFar(saved), what = kind === 'test' ? 'a practice test' : 'the set';
  paint(`
    <section class="home">
      <h2 tabindex="-1">Start ${what}?</h2>
      <p class="sub">You stopped partway through ${doing(saved)}. If you start ${what} now, the ${plural(n, 'answer', 'answers')} you gave there will be cleared. They will not count.</p>
      <button class="btn primary" type="button" id="newSetYes">Yes, start ${what}</button>
      <button class="btn" type="button" id="newSetNo">No, go back</button>
    </section>`, 'h2');
  toTop();
  $('newSetNo').onclick = () => { renderHome(); toTop(); };
  $('newSetYes').onclick = () => { dropUnfinished(); start(kind); };
}

// A daily Set is built from the records (buildSet); a Practice test is 30 of the 120, shuffled.
function start(kind) {
  const screens = kind === 'test'
    ? shuffle(QS).slice(0, TEST_LEN).map(q => ({ kind: 'counted', id: q.id, format: 'choice', options: shuffle([q.a, ...q.o]), chosen: null, at: null }))
    : buildSet(S, Date.now());
  const change = latestChange(copyRecords());
  run = { kind, set_id: crypto.randomUUID(), started_at: new Date().toISOString(), after: change && change.id,
    number: S.sets + 1, group: (screens.find(s => s.kind === 'contrast') || {}).group ?? null, i: 0, answered: false, reasks: 0, screens };
  keepRun();
  renderScreen();
}

function visual(q) { return q.sign ? SIGNS[q.sign] || '' : q.swatch ? SIGNS.swatch(q.swatch) : ''; }
const manual = q => q.src ? `<figure class="src"><figcaption>Driver manual, page ${q.p}</figcaption><blockquote>“${esc(q.src)}”</blockquote></figure>` : '';
const quitLink = '<button class="link" type="button" id="quitBtn">Stop for now and save my place</button>';
function wireQuit() { $('quitBtn').onclick = () => { keepRun(); renderHome(); window.scrollTo(0, 0); }; }

// The line above every screen of a Set. Its bar counts counted questions answered, so it does not
// move on first looks, re-asks or rule screens.
function progressLine() {
  const s = run.screens[run.i], counted = run.screens.filter(x => x.kind === 'counted');
  const done = counted.filter(x => x.chosen !== null).length, n = counted.indexOf(s) + 1;
  const where = run.kind === 'test' ? `Practice test: question ${n} of ${counted.length}`
    : s.kind === 'counted' ? `Set ${run.number}: question ${n} of ${counted.length}`
    : s.kind === 'first_look' ? `Set ${run.number}: first look` : s.kind === 'reask' ? `Set ${run.number}: one more time` : `Set ${run.number}`;
  return `<div class="progress"><span>${where}</span><div class="bar" aria-hidden="true"><span style="width:${done / counted.length * 100}%"></span></div></div>`;
}

function renderScreen(revealFeedback) {
  const kind = run.screens[run.i].kind;
  return kind === 'rule' ? renderRule() : kind === 'contrast' ? renderCompare() : renderQuestion(revealFeedback);
}

// A group's Compare screen: its easily mixed-up facts side by side, before the questions on them.
function renderCompare() {
  const g = GROUP_BY_ID[run.screens[run.i].group];
  const rows = g.facts.map(f => {
    const q = BY_ID[f.id];
    return `<li><div class="cfact">${visual(q) ? `<span class="cpic">${visual(q)}</span>` : ''}<span>${esc(f.label)}</span></div>` +
      `<div class="cmeans">${esc(f.means || q.a)}</div></li>`;
  }).join('');
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        <h1 class="q" id="compareHead" tabindex="-1">Compare: ${esc(g.title)}</h1>
        <p class="sub">These ${g.facts.length} rules are easy to mix up. Here they are side by side.</p>
        <ul class="compare">${rows}</ul>
      </div>
      <button class="btn primary" type="button" id="compareGoBtn">Go on to the questions</button>
      ${quitLink}
    </div>`, '#compareHead');
  $('compareGoBtn').onclick = () => { toTop(); next(); };
  wireQuit();
}

// A fact's rule: its explanation and the manual's own words. It comes once, when the Learner first
// meets the fact, right after the first look; the fact's counted question comes later in the Set.
function renderRule() {
  const s = run.screens[run.i], q = BY_ID[s.id], prev = run.screens[run.i - 1];
  const look = prev && prev.kind === 'first_look' && prev.id === s.id ? prev : null;
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        <h1 class="rulehead" id="ruleHead" tabindex="-1">${look ? 'Here is the rule.' : 'Read this rule first.'}</h1>
        ${visual(q) ? `<div class="visual">${visual(q)}</div>` : ''}
        <p class="rule">${esc(q.why)}</p>
        ${manual(q)}
        ${look ? `<p class="picked">You picked: ${esc(look.chosen)}.</p><p class="picked">The answer is: ${esc(q.a)}.</p>` : ''}
        <p class="back">This question comes back later in this set.</p>
      </div>
      <button class="btn primary" type="button" id="ruleGoBtn">Go on</button>
      ${quitLink}
    </div>`, '#ruleHead');
  $('ruleGoBtn').onclick = () => { toTop(); next(); };
  wireQuit();
}

// What a counted question or re-ask says after it is answered: {verdict, also, back}. `also` names
// the question a wrong choice answers, when it is another fact's answer; `back` says when the
// question comes back, said plainly instead of a verdict.
function feedbackLines(s) {
  const q = asked(s);
  if (isRight(s)) return { verdict: 'Correct.', also: '', back: '' };
  const other = s.format === 'choice' && q.also && BY_ID[q.also[s.chosen]];
  const reasked = run.kind === 'daily' && s.kind === 'counted' && run.screens.some((x, j) => j > run.i && x.kind === 'reask' && x.id === s.id);
  return { verdict: `The right answer is: ${answerOf(s)}.`, also: other ? `${s.chosen} answers a different question: ${other.q}` : '',
    back: reasked ? 'This question comes back later in this set, and in your next set.' : 'This question comes back in your next set.' };
}

function renderQuestion(revealFeedback) {
  const s = run.screens[run.i], q = asked(s), last = run.i === run.screens.length - 1, right = answerOf(s);
  const L = ['A', 'B', 'C', 'D'];
  const opts = s.options.map((o, k) => {
    if (!run.answered) return `<li><button type="button" class="opt" data-k="${k}" aria-keyshortcuts="${L[k]}"><span class="key">${L[k]}</span><span class="otext">${esc(o)}</span></button></li>`;
    let c = 'rest', tag = '';
    if (o === right) { c = 'right'; tag = o === s.chosen ? 'Your answer. It is correct.' : 'Correct answer'; }
    else if (o === s.chosen) { c = 'wrong'; tag = 'Your answer'; }
    return `<li class="opt ${c}"><span class="key" aria-hidden="true">${L[k]}</span><span class="otext"><span>${esc(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</span></li>`;
  }).join('');
  const lines = run.answered ? feedbackLines(s) : null;
  const fb = lines ? `<div class="feedback" id="feedback">
      <p class="verdict${isRight(s) ? ' good' : ''}">${esc(lines.verdict)}</p>
      ${lines.also ? `<p class="also">${esc(lines.also)}</p>` : ''}
      <p class="why">${esc(q.why)}</p>
      ${manual(q)}
      ${lines.back ? `<p class="back">${esc(lines.back)}</p>` : ''}
    </div>` : '';
  const above = s.kind === 'first_look' ? '<p class="sub">You have not had this question before. Pick the answer you think is right. This answer does not count.</p>'
    : s.kind === 'reask' ? '<p class="sub">One more time.</p>' : '';
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        ${above}
        ${visual(q) && s.format !== 'reverse' ? `<div class="visual">${visual(q)}</div>` : ''}
        <h1 class="q" id="qText" tabindex="-1">${esc(questionText(s))}</h1>
        <ul class="options" aria-labelledby="qText">${opts}</ul>
        ${fb}
      </div>
      ${run.answered ? `<button class="btn primary" type="button" id="nextBtn">${!last ? 'Next question' : run.kind === 'test' ? 'See my score' : 'See how it went'}</button>` : ''}
      ${quitLink}
    </div>`, run.answered ? null : '#qText');
  if (run.answered) {
    $('nextBtn').onclick = next;
    $('nextBtn').focus({ preventScroll: true });
    if (revealFeedback) reveal();
  } else document.querySelectorAll('button.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.k)));
  wireQuit();
}

// After answering, bring the explanation into view above the pinned Next button without pushing the verdict off the top.
function reveal() {
  const fb = $('feedback'), nb = $('nextBtn');
  if (!fb || !nb) return;
  const r = fb.getBoundingClientRect();
  const limit = window.innerHeight - nb.offsetHeight - 32;
  const dy = Math.min(r.bottom - limit, r.top - 16);
  if (dy > 0) window.scrollBy({ top: dy });
}

// After a wrong counted answer at screen `p`, the same fact is asked once more right after the
// RE_ASK_GAPth question screen for another fact (at the end, when fewer are left), at most
// RE_ASK_CAP times a Set. A first look and its rule screen are never split. Returns whether it was.
function insertReask(r, p) {
  if (r.reasks >= RE_ASK_CAP) return false;
  const s = r.screens[p];
  let at = r.screens.length, seen = 0;
  for (let j = p + 1; j < r.screens.length; j++) {
    if (isQuestion(r.screens[j]) && r.screens[j].id !== s.id && ++seen === RE_ASK_GAP) { at = j + 1; break; }
  }
  if (at < r.screens.length && r.screens[at - 1].kind === 'first_look') at++;
  r.screens.splice(at, 0, { kind: 'reask', id: s.id, q: s.q, group: s.group, format: s.format, options: shuffle(s.options), chosen: null, at: null });
  r.reasks++;
  return true;
}

function choose(k) {
  const s = run.screens[run.i];
  if (run.answered || !isQuestion(s)) return;
  s.chosen = s.options[k];
  s.at = new Date().toISOString();
  // A first look is not scored: choosing goes straight on to the fact's rule screen.
  if (s.kind === 'first_look') { run.i++; keepRun(); toTop(); return renderScreen(); }
  run.answered = true;
  if (run.kind === 'daily' && s.kind === 'counted' && !isRight(s)) insertReask(run, run.i);
  keepRun();
  renderQuestion(true);
  const lines = feedbackLines(s);
  const q = asked(s);
  $('announce').textContent = [lines.verdict, lines.also, q.why, q.src ? `Driver manual, page ${q.p}: “${q.src}”` : '', lines.back]
    .filter(Boolean).join(' ');
}

function next() {
  $('announce').textContent = '';
  if (run.i < run.screens.length - 1) { run.i++; run.answered = false; keepRun(); toTop(); renderScreen(); }
  else finish();
}

function finish() {
  const r = run, before = S;
  // The finished Set waits in `pending` until the server has it; Progress is worked out again with it.
  const rec = setRecord(r), mine = copy;
  copy.pending.push(rec);
  copy.unfinished = null;
  saveCopy();
  workOut();
  // Once the server has the finished Set, the unfinished one is cleared there too.
  unfinishedUnsent = true;
  sendPending().then(() => { if (copy === mine && !mine.pending.includes(rec)) sendUnfinished(); });
  run = null;
  // Each fact with a wrong counted answer or re-ask, once, in the wording it was asked.
  const wrong = r.screens.filter(s => (s.kind === 'counted' || s.kind === 'reask') && !isRight(s));
  const missed = [...new Set(wrong.map(s => s.id))];
  const list = missed.map(id => { const q = asked(wrong.find(s => s.id === id)); return `<li><p class="mq">${esc(q.q)}</p><p>Right answer: ${esc(q.a)}</p><p class="mwhy">${esc(q.why)}</p><p class="mpage">Driver manual, page ${q.p}</p></li>`; }).join('');
  const missedList = missed.length ? `<details class="missed"><summary>See the ${plural(missed.length, 'question', 'questions')} you missed</summary><ul>${list}</ul></details>` : '';
  if (r.kind === 'test') testDone(r, missed, missedList); else setDone(r, before, missedList);
  toTop();
}

// The end of a daily Set: what changed, in counts, and what comes next. No score.
function setDone(r, before, missedList) {
  const ids = [...new Set(r.screens.filter(isQuestion).map(s => s.id))];
  const learned = ids.filter(id => !isLearned(before.facts[id]) && isLearned(S.facts[id])).length;
  const solid = ids.filter(id => !isSolid(before.facts[id]) && isSolid(S.facts[id])).length;
  const back = ids.filter(id => S.facts[id].lastRight === false).length;
  const lines = [learned ? `${plural(learned, 'new fact', 'new facts')} learned.` : '', solid ? `${plural(solid, 'fact', 'facts')} now solid.` : '',
    back ? `${plural(back, 'fact comes', 'facts come')} back in your next set.` : ''].filter(Boolean);
  const plan = setPlan(S, Date.now()), more = !fillOnly(plan);
  const buttons = more
    ? '<button class="btn primary" type="button" id="moreBtn">Another set</button><button class="btn" type="button" id="homeBtn">I\'m done for now</button>'
    : `<button class="btn primary" type="button" id="homeBtn">I'm done for now</button>${unlocked() ? '<button class="btn" type="button" id="testBtn">Start a practice test</button>' : ''}
      <p class="sub">Nothing is due. The next set goes over ${plan.fill.length} facts you already know.</p><button class="link" type="button" id="moreBtn">Another set</button>`;
  paint(`
    <section class="home">
      <h2 tabindex="-1">Set done.</h2>
      ${lines.map(l => `<p class="theme">${l}</p>`).join('')}
      <p class="sub">${factsLine()}</p>
      ${missedList}
      ${buttons}
    </section>`, 'h2');
  wireDone();
}

// The end of a Practice test: the count and what it is short of, never a pass or fail verdict (#35).
function testDone(r, missed, missedList) {
  const counted = r.screens.filter(s => s.kind === 'counted'), right = counted.filter(isRight).length, st = streak();
  const back = missed.length ? ' The questions you missed come back in your next set.' : '';
  let title, note, sign = false;
  if (st >= READY_STREAK) {
    sign = true;
    title = 'You are ready for the real test.';
    note = `You got ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row.`;
  } else if (right >= READY_SCORE) {
    title = 'That counts toward ready.';
    note = `In a row so far: ${st} of ${READY_STREAK}. Get ${READY_SCORE} or more right on ${plural(READY_STREAK - st, 'more test', 'more tests')} to be ready.` + back;
  } else {
    title = 'This practice test is done.';
    note = `To count toward ready, you need ${READY_SCORE} or more right.` + back;
  }
  paint(`
    <section class="home">
      <p class="score">${right} of ${counted.length}<span> right</span></p>
      ${sign ? `<div class="sign"><h2 tabindex="-1">${title}</h2><p>${esc(note)}</p></div>` : `<h2 tabindex="-1">${title}</h2><p class="sub">${esc(note)}</p>`}
      ${sign && missed.length ? `<p class="sub">${back.trim()}</p>` : ''}
      ${missedList}
      <button class="btn primary" type="button" id="homeBtn">I'm done for now</button>
    </section>`, 'h2');
  wireDone();
}
function wireDone() {
  $('homeBtn').onclick = () => { renderHome(); toTop(); };
  if ($('moreBtn')) $('moreBtn').onclick = () => { start('daily'); toTop(); };
  if ($('testBtn')) $('testBtn').onclick = () => { start('test'); toTop(); };
}

document.addEventListener('keydown', e => {
  if (!run || run.answered || !document.querySelector('button.opt') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
  if (k >= 0) { e.preventDefault(); choose(k); }
});

// Accounts. `me` is the signed-in account ({id, role, name}) or null. Every call to the
// server goes through api(): a 401 while signed in means the sign-in has ended, and the
// page goes back to the sign-in screen without saying why.
let me = null;
class SignedOut extends Error {}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({ cache: 'no-store' }, opts));
  if (r.status === 401 && me) { signedOut(); throw new SignedOut(); }
  return r;
}
const postJSON = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

// Start-up, and again after each sign-in: who is signed in, then their questions, then their screen.
// With no connection, the account last signed in on this device is used, and the
// service worker answers with the questions it kept.
async function startUp() {
  const last = rememberedMe();
  try {
    // On a weak signal, wait at most 3 seconds when there is an account to fall back on.
    const r = await fetch('/api/me', { cache: 'no-store', signal: last && AbortSignal.timeout ? AbortSignal.timeout(3000) : undefined });
    if (r.status === 401) { forgetDevice(); me = null; return renderSignIn(); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    me = await r.json();
    rememberMe(me);
  } catch (e) {
    if (!last) return couldNotLoad();
    me = last;
  }
  let data;
  const viaWorker = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  try {
    const q = await api('questions.json', { cache: 'no-cache' });
    if (!q.ok) throw new Error('HTTP ' + q.status);
    data = await q.json();
  } catch (e) { return e instanceof SignedOut ? undefined : couldNotLoad(); }
  if (!viaWorker) keepQuestions();
  begin(data);
}
// The service worker keeps the questions it hands the page, but never fetches them itself, so it
// never asks for them signed out. On the first visit the page fetched them before the worker took
// control, so once it has, they are fetched again through it, to work with no connection next time.
function keepQuestions() {
  const sw = navigator.serviceWorker;
  if (!sw) return;
  const again = () => { if (me) fetch('questions.json', { cache: 'no-cache' }).catch(() => {}); };
  if (sw.controller) again(); else sw.addEventListener('controllerchange', again, { once: true });
}

// The questions live in questions.json next to the page, not in the page itself.
function begin(data) {
  DAYS = data.days; QS = data.qs; TOTAL_DAYS = DAYS.length;
  // BY_ID holds every question: the 120 facts' own and their other wordings (each names its `fact`).
  BY_ID = Object.fromEntries([...QS, ...(data.wordings || [])].map(q => [q.id, q]));
  WORDINGS = Object.fromEntries(QS.map(q => [q.id, [q.id]]));
  for (const w of (data.wordings || []).slice().sort((a, b) => a.id < b.id ? -1 : 1)) if (WORDINGS[w.fact]) WORDINGS[w.fact].push(w.id);
  GROUPS = data.groups || [];
  GROUP_BY_ID = Object.fromEntries(GROUPS.map(g => [g.id, g]));
  if (me.role === 'helper') renderHelper();
  else openLearner();
}

// The Learner's screen. The device copy shows at once if this device has one; then waiting
// records are sent, and the server's records replace the copy's (Resets and Moves arrive this
// way). A first open on this device waits for the server.
async function openLearner() {
  const saved = readCopy(me.id), mine = saved || { records: [], pending: [], unfinished: null, rejected: [] };
  copy = mine;
  copyFor = me.id;
  unfinishedUnsent = false;
  if (saved) { workOut(); renderHome(); }
  await sendPending();
  let body;
  try {
    const r = await api('/api/records');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    body = await r.json();
  } catch (e) {
    if (!saved && !(e instanceof SignedOut) && copy === mine) couldNotLoad();
    return;
  }
  if (copy !== mine) return; // signed out meanwhile
  const have = new Set(body.records.map(x => x.id));
  copy.records = body.records;
  copy.pending = copy.pending.filter(x => !have.has(x.id));
  // An unfinished Set that is already finished, or that a Reset or Move dropped, is gone. Of the
  // others, the newest wins: the server's replaces the device's if it was saved later.
  const recs = copyRecords();
  const live = u => u && !recs.some(x => x.kind === 'set' && x.data.set_id === u.set_id) && !droppedByChange(u, recs) ? u : null;
  const theirs = live(body.unfinished), ours = live(copy.unfinished);
  copy.unfinished = theirs && (!ours || String(theirs.saved_at || '') > String(ours.saved_at || '')) ? theirs : ours;
  const imported = importOldProgress();
  saveCopy();
  if (body.unfinished && !theirs) sendUnfinished(); // the server still holds one that is gone
  if (imported) sendPending();
  const shown = JSON.stringify(S);
  workOut();
  if (!saved || (onHome && !run && JSON.stringify(S) !== shown)) renderHome();
}
// The one-time import: progress saved in this browser before accounts becomes the Learner's
// Imported record, if the account has no records yet and this device hasn't imported before.
function importOldProgress() {
  let state;
  try {
    if (localStorage.getItem(IMPORTED_KEY) || copyRecords().length) return false;
    state = JSON.parse(localStorage.getItem(OLD_KEY));
  } catch (e) { return false; }
  if (!state || typeof state !== 'object' || Array.isArray(state)) return false;
  copy.pending.push({ id: crypto.randomUUID(), kind: 'imported', reset: null, at: new Date().toISOString(), data: { state } });
  try { localStorage.setItem(IMPORTED_KEY, '1'); } catch (e) {}
  return true;
}
function couldNotLoad() {
  paint(`<section class="home"><p class="sub">The questions could not be loaded. Check your connection and open the app again.</p></section>`);
}

function signedOut() {
  me = null; run = null; S = null; copy = null; copyFor = null;
  forgetDevice();
  renderSignIn();
}

// The account last seen signed in, so the app can open with no connection. Only {id, role, name}.
const ME_KEY = 'rrtn-me';
function rememberMe(m) { try { localStorage.setItem(ME_KEY, JSON.stringify({ id: m.id, role: m.role, name: m.name })); } catch (e) {} }
function rememberedMe() {
  try {
    const m = JSON.parse(localStorage.getItem(ME_KEY));
    return m && (m.role === 'learner' || m.role === 'helper') ? m : null;
  } catch (e) { return null; }
}
// Signed out, the device keeps neither the account nor the questions.
function forgetDevice() {
  try { localStorage.removeItem(ME_KEY); } catch (e) {}
  if (window.caches) caches.open('rrtn-pages').then(c => c.delete('/questions.json')).catch(() => {});
}

function renderSignIn() {
  paint(`
    <section class="signin">
      <h1 tabindex="-1">Sign in</h1>
      <p class="sub">Type the name and password you were given.</p>
      <form id="signInForm" method="post" class="signin">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <label class="check"><input type="checkbox" id="showPw">Show password</label>
        <div id="signInMsg" aria-live="polite"></div>
        <button class="btn primary" type="submit" id="signInBtn">Sign in</button>
      </form>
    </section>`, 'h1');
  $('showPw').onchange = () => { $('password').type = $('showPw').checked ? 'text' : 'password'; };
  $('signInForm').onsubmit = e => { e.preventDefault(); signIn(); };
}

function signInMessage(text) {
  $('signInMsg').innerHTML = `<p class="warn" tabindex="-1">${esc(text)}</p>`;
  $('signInMsg').firstChild.focus();
}

async function signIn() {
  const btn = $('signInBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  $('signInMsg').textContent = '';
  let ok = false;
  try {
    const r = await postJSON('/api/sign-in', { name: $('name').value, password: $('password').value });
    ok = r.ok;
    if (ok) return;
    if (r.status === 429) {
      const body = await r.json().catch(() => ({}));
      const seconds = Math.max(0, Number(body.retry_after) || 0);
      // Rounded up to the minute, so the time shown is never before the pause ends.
      const at = new Date(Math.ceil((Date.now() + seconds * 1000) / 60000) * 60000);
      signInMessage(`Sign-in is paused because of too many tries. You can try again at ${at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.`);
    } else if (r.status === 401) {
      signInMessage('That name and password do not match. Check them and try again.');
    } else {
      signInMessage('Sign-in did not work. Try again later.');
    }
  } catch (e) {
    signInMessage('The app could not be reached. Check your connection and try again.');
  } finally {
    if (ok) {
      // Ask the browser to keep this device's saved progress even when space runs low.
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      startUp();
    } else btn.disabled = false;
  }
}

// Sign out, for the Learner (from the home screen's fine print) and the Helper. `back` repaints where they came from.
function confirmSignOut(back) {
  paint(`
    <section class="home">
      <h2 tabindex="-1">Sign out?</h2>
      <p class="sub">You will need your name and password to sign in again.</p>
      <button class="btn primary" type="button" id="signOutYes">Yes, sign out</button>
      <button class="btn" type="button" id="signOutNo">No, stay signed in</button>
    </section>`, 'h2');
  $('signOutNo').onclick = () => { back(); window.scrollTo(0, 0); };
  $('signOutYes').onclick = signOut;
}
// A Learner's waiting records are sent first, so signing out needs a connection; then that
// Learner's device copy is deleted.
async function signOut() {
  const learner = copy ? copyFor : null;
  const refuse = text => {
    if (!$('signOutYes')) return;
    if ($('signOutMsg')) $('signOutMsg').remove();
    $('signOutYes').insertAdjacentHTML('beforebegin', `<p class="warn" tabindex="-1" id="signOutMsg">${esc(text)}</p>`);
    $('signOutMsg').focus();
  };
  const offline = 'You are offline. Sign out needs a connection, so that your answers are saved first.';
  if (learner !== null) {
    await sendPending();
    if (!copy) return; // the sign-in ended meanwhile
    if (copy.pending.length) return refuse(offline);
  }
  try { await api('/api/sign-out', { method: 'POST' }); } catch (e) {
    if (e instanceof SignedOut) return;
    return refuse(learner !== null ? offline : 'The app could not be reached. Check your connection and try again.');
  }
  if (learner !== null) try { localStorage.removeItem(copyKey(learner)); } catch (e) {}
  signedOut();
}

// The Helper's view (GLOSSARY.md): the list of Learners, and one Learner's Progress and History.
// It only reads. Each screen loads fresh from the server when it opens, and Progress is worked
// out from the records with the same code as the study path (docs/adr/0001-*).

// Where a Learner is now, worded for the Helper.
function whereNow(p) {
  return `${learnedCount(p)} of ${QS.length} facts learned, ${solidCount(p)} solid.`;
}
// What the Learner's next Set holds, worded for the Helper, or Ready for the test.
function nextSetLine(p, now) {
  if (ready(p)) return `Ready for the test: ${streak(p)} practice tests in a row at ${READY_SCORE} or more`;
  const plan = setPlan(p, now);
  const parts = [plan.block.length ? `Compare: ${plan.group.title}` : '', plan.due.length ? `${plan.due.length} come back` : '',
    plan.fill.length ? `${plan.fill.length} to keep fresh` : '', plan.fresh.length ? `${plan.fresh.length} new` : ''];
  return `Next set: ${parts.filter(Boolean).join(', ')}.`;
}
// The unfinished Set (as the page saves it, see packRun), or null when it can't be read. One saved
// before the learning engine has `items` and a Section (`dayNum`) instead of screens.
function unfinishedLine(u) {
  if (!u || typeof u !== 'object') return null;
  if (Array.isArray(u.screens) && u.screens.length) {
    const qs = u.screens.filter(s => s && isQuestion(s)), done = qs.filter(s => s.chosen !== null && s.chosen !== undefined).length;
    return `Unfinished: ${u.kind === 'test' ? 'Practice test' : `Set ${u.number}`}, ${done} of ${qs.length} answered`;
  }
  if (!Array.isArray(u.items) || !u.items.length) return null;
  const where = setName(u.kind, u.dayNum, null);
  const done = Math.min(u.items.length, (Number(u.i) || 0) + (u.answered ? 1 : 0));
  return `Unfinished: ${where}, ${done} of ${u.items.length} answered`;
}

const answerTime = a => { const t = Date.parse(a.at); return Number.isNaN(t) ? 0 : t; };
// A Set's counted answers: how many were right, of how many. First looks and re-asks are left out.
const setScore = d => { const counted = d.answers.filter(isCounted); return { right: counted.filter(a => a.right).length, of: counted.length }; };
// The time of the newest answer in the whole History, or null when there is none.
function lastStudied(records) {
  let t = null;
  for (const r of records) if (r.kind === 'set') for (const a of r.data.answers) t = Math.max(t ?? 0, answerTime(a));
  return t === null ? null : new Date(t).toISOString();
}

const SESSION_GAP = 30 * 60 * 1000; // a Study session has no gap longer than 30 minutes between answers
// Study sessions over the whole History, newest first, with each Reset and Move as a line of its
// own: {kind: 'session', start, end, sets: [{type, section, number, right, of}]}, {kind: 'reset', at}
// or {kind: 'move', at, to}. A Set counts as finished in the Study session that holds its last answer.
// A daily Set's number counts the daily Sets since the Reset before it; other Sets have none.
function studySessions(records) {
  const ordered = orderRecords(records), sets = ordered.filter(r => r.kind === 'set'), number = new Map();
  let n = 0;
  for (const r of ordered) { if (r.kind === 'reset') n = 0; else if (r.kind === 'set' && r.data.type === 'daily') number.set(r, ++n); }
  const times = sets.flatMap(r => r.data.answers.map(answerTime)).sort((a, b) => a - b);
  const sessions = [];
  for (const t of times) {
    const s = sessions[sessions.length - 1];
    if (s && t - s.end <= SESSION_GAP) s.end = t; else sessions.push({ start: t, end: t, sets: [] });
  }
  for (const r of sets) {
    const last = Math.max(...r.data.answers.map(answerTime));
    const s = sessions.find(s => s.start <= last && last <= s.end);
    if (s) s.sets.push({ type: r.data.type, section: r.data.section, number: number.get(r) ?? null, ...setScore(r.data) });
  }
  const lines = sessions.map(s => [s.end, { kind: 'session', start: new Date(s.start).toISOString(), end: new Date(s.end).toISOString(), sets: s.sets }]);
  for (const r of ordered) {
    if (r.kind === 'reset') lines.push([recordTime(r), { kind: 'reset', at: r.at }]);
    if (r.kind === 'move') lines.push([recordTime(r), { kind: 'move', at: r.at, to: r.data.to }]);
  }
  return lines.sort((a, b) => b[0] - a[0]).map(x => x[1]);
}
// The line for a Reset or a Move in the list of Study sessions.
function historyLine(e) {
  if (e.kind === 'reset') return 'Progress reset by a Helper';
  if (e.kind === 'move') return e.to > TOTAL_DAYS ? 'Unlocked practice tests' : `Started new facts from Section ${e.to}`;
  return null;
}

// Up to 10 questions missed two or more times since the latest Reset: the most misses first, then
// the fewest answers, then the order of the study path. `wrong` is the wrong answer chosen most often.
// A first look is an unscored question on a rule not yet seen, so it is left out; counted answers and re-asks count.
function missedMost(records) {
  const tally = new Map();
  for (const r of countedRecords(records)) if (r.kind === 'set') for (const a of r.data.answers) {
    if (!BY_ID[a.q] || a.role === 'first_look') continue;
    if (!tally.has(a.q)) tally.set(a.q, { q: a.q, missed: 0, answered: 0, picks: new Map() });
    const t = tally.get(a.q);
    t.answered++;
    if (!a.right) { t.missed++; t.picks.set(a.chosen, (t.picks.get(a.chosen) || 0) + 1); }
  }
  const order = Object.fromEntries(QS.map((q, i) => [q.id, i])), place = Object.fromEntries(Object.keys(BY_ID).map(q => [q, order[factOf(q)]]));
  const most = picks => [...picks].reduce((best, x) => x[1] > best[1] ? x : best)[0];
  return [...tally.values()].filter(t => t.missed >= 2)
    .sort((a, b) => b.missed - a.missed || a.answered - b.answered || place[a.q] - place[b.q])
    .slice(0, 10)
    .map(t => ({ q: t.q, missed: t.missed, answered: t.answered, wrong: most(t.picks) }));
}

// Times in the Helper's view are shown in the device's own time zone.
const dayText = iso => new Date(iso).toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' });
const whenText = iso => `${dayText(iso)}, ${new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
function lengthText(ms) {
  const m = Math.round(ms / 60000), h = Math.floor(m / 60);
  if (m < 1) return 'Less than 1 minute';
  return [h ? plural(h, 'hour', 'hours') : '', m % 60 ? plural(m % 60, 'minute', 'minutes') : ''].filter(Boolean).join(' ');
}
// A GET for the Helper's view. A failed answer throws an Error with its `status`.
async function getJSON(path) {
  const r = await api(path);
  if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { status: r.status });
  return r.json();
}
// Each Helper screen paints at once and then loads. `stillShowing` says whether the screen that
// asked is still the one on the page, so a late answer never paints over where the Helper went.
function stillShowing() { const shown = $('stage').firstElementChild; return () => shown.isConnected; }

// A short line at the top of a Helper screen saying what the last action did.
const noteLine = note => note ? `<p class="note" role="status">${esc(note)}</p>` : '';

// The Helper's first screen: every Learner, one row each, then Add a Learner and Sign out.
// `note` says what the Helper just did, when the list loads again after an action.
async function renderHelper(note = '') {
  const signOutBtn = '<button class="btn" type="button" id="signOutBtn">Sign out</button>';
  const screen = body => {
    paint(`<section class="home helper"><h1 tabindex="-1">Learners</h1>${noteLine(note)}${body}${signOutBtn}</section>`, 'h1');
    $('signOutBtn').onclick = () => confirmSignOut(renderHelper);
  };
  screen('<p class="sub">Getting the list of Learners.</p>');
  const showing = stillShowing();
  let rows;
  try {
    const { learners } = await getJSON('/api/learners');
    rows = await Promise.all(learners.map(async learner => ({ learner, records: (await getJSON(`/api/learners/${learner.id}/records`)).records })));
  } catch (e) {
    if (e instanceof SignedOut || !showing()) return;
    screen('<p class="warn">The list of Learners could not be loaded. Check your connection and try again.</p><button class="btn primary" type="button" id="retryBtn">Try again</button>');
    $('retryBtn').onclick = () => renderHelper();
    return;
  }
  if (!showing()) return;
  const list = rows.map(({ learner, records }, k) => {
    const last = lastStudied(records);
    return `<li><button type="button" class="lrow" data-k="${k}"><span class="lname">${esc(learner.name)}</span><span>${esc(whereNow(progressFrom(records)))}</span>` +
      `<span class="lwhen">${last ? `Last studied ${dayText(last)}` : 'Has not answered any questions yet.'}</span></button></li>`;
  }).join('');
  screen((rows.length ? `<ul class="learners">${list}</ul>` : '<p class="sub none">No Learners yet.</p>') +
    '<button class="btn primary" type="button" id="addBtn">Add a Learner</button>');
  $('addBtn').onclick = () => { addLearner(); window.scrollTo(0, 0); };
  document.querySelectorAll('.lrow').forEach(b => b.onclick = () => { openLearnerPage(rows[Number(b.dataset.k)].learner); window.scrollTo(0, 0); });
}

// One Learner's page, loaded fresh each time it opens. `learner` is a row of GET /api/learners;
// the list is read again too, for the Learner's name and sign-in pause as they are now.
// `note` says what the Helper just did; `at: 'manage'` scrolls to Manage this Learner.
async function openLearnerPage(learner, { note = '', at = '' } = {}) {
  let name = esc(learner.name);
  const screen = body => {
    paint(`<section class="home helper"><button class="link top back" type="button">Back to Learners</button><h1 tabindex="-1">${name}</h1>${body}</section>`, 'h1');
    document.querySelectorAll('.back').forEach(b => b.onclick = () => { renderHelper(); window.scrollTo(0, 0); });
  };
  screen(`<p class="sub">Getting ${name}'s records.</p>`);
  const showing = stillShowing();
  let body, now;
  try {
    let learners;
    [{ learners }, body] = await Promise.all([getJSON('/api/learners'), getJSON(`/api/learners/${learner.id}/records`)]);
    now = learners.find(l => l.id === learner.id);
    if (!now) throw Object.assign(new Error('no-learner'), { status: 404 });
  } catch (e) {
    if (e instanceof SignedOut || !showing()) return;
    if (e.status === 404) return screen(`<p class="warn">${name} is no longer on the list of Learners.</p>`);
    screen(`<p class="warn">${name}'s records could not be loaded. Check your connection and try again.</p><button class="btn primary" type="button" id="retryBtn">Try again</button>`);
    $('retryBtn').onclick = () => openLearnerPage(learner);
    return;
  }
  if (!showing()) return;
  name = esc(now.name);
  screen(noteLine(note) + learnerPage(body, now));
  wireManage(now, progressFrom(body.records));
  if (at === 'manage') $('manage').scrollIntoView({ block: 'start', behavior: 'instant' });
}

// When a sign-in pause ends, in the device's own time format, or null when there is no pause now.
// Rounded up to the minute, as on the sign-in page, so the time shown is never before the pause ends.
// A pause that ends on another day says the day too.
function pausedUntil(iso) {
  const t = Date.parse(iso);
  if (!iso || Number.isNaN(t) || t <= Date.now()) return null;
  const at = new Date(Math.ceil(t / 60000) * 60000);
  const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return at.toDateString() === new Date().toDateString() ? time : `${dayText(at.toISOString())}, ${time}`;
}

// The parts of a Learner's page, top to bottom, from GET /api/learners/<id>/records.
function learnerPage({ records, unfinished }, learner) {
  const p = progressFrom(records), counted = countedRecords(records), reset = currentReset(records);
  const part = (cls, title, html) => `<section class="part ${cls}"><h2>${title}</h2>${html}</section>`;

  const done = unfinished && records.some(r => r.kind === 'set' && r.data.set_id === unfinished.set_id);
  const open = !done && unfinishedLine(unfinished);
  const until = learner && pausedUntil(learner.paused_until);
  const now = `<div class="now"><p class="theme">${esc(whereNow(p))}</p><p>${esc(nextSetLine(p, Date.now()))}</p>` +
    (open ? `<p class="sub">${esc(open)}</p>` : '') +
    (until ? `<p class="paused">Sign-in is paused until ${until} after too many tries.</p>` : '') + '</div>';

  // Whether facts answered right are still known when asked again after a gap: the number that says
  // whether the app is working.
  const ret = retention(p, Date.now()), gap = SPACING_MS / HOUR;
  const kept = ret.all.of
    ? `<p>Of ${plural(ret.all.of, 'time', 'times')} a fact was answered right and asked again at least ${gap} hours later, it was right ${plural(ret.all.right, 'time', 'times')}.</p>` +
      `<p>In the last 14 days: ${ret.recent.right} of ${ret.recent.of}.</p>`
    : `<p>No fact has been asked again ${gap} or more hours after a right answer yet.</p>`;

  const word = { new: 'New', seen: 'Seen', learned: 'Learned', solid: 'Solid' };
  const facts = DAYS.map(d => {
    const qs = QS.filter(q => q.day === d.day), fs = qs.map(q => p.facts[q.id]);
    const rows = qs.map(q => {
      const f = p.facts[q.id];
      return `<li><p class="mq">${esc(q.q)}</p><p>${word[standing(f)]}</p><p class="mcount">Asked ${f.asked}, right ${f.right}</p>` +
        `<p class="mcount">${f.lastAt === null ? 'Not asked yet' : `Last asked ${dayText(new Date(f.lastAt).toISOString())}`}</p>` +
        (f.wrong >= LEECH_WRONG ? '<p class="leech">Needs a different question</p>' : '') + '</li>';
    }).join('');
    return `<li><details><summary><span class="sname">Section ${d.day}: ${esc(d.title)}: ${fs.filter(isLearned).length} of ${fs.length} learned, ` +
      `${fs.filter(isSolid).length} solid</span></summary><ul class="sets facts">${rows}</ul></details></li>`;
  }).join('');

  const tests = counted.filter(r => r.kind === 'set' && r.data.type === 'test').reverse(), st = streak(p);
  const undated = p.tests.length - tests.length; // brought in from saved progress from before accounts
  const testList = p.tests.length ? `<p>${st >= READY_STREAK ? `Ready for the test: ${st} in a row` : `In a row so far: ${st} of ${READY_STREAK}`}</p>` +
    (tests.length ? `<ul>${tests.map(r => `<li>${whenText(r.at)}: ${setScore(r.data).right} of ${setScore(r.data).of}</li>`).join('')}</ul>` : '') +
    (undated > 0 ? `<p class="sub small">${plural(undated, 'earlier Practice test was', 'earlier Practice tests were')} done before the app kept dates.</p>` : '')
    : '<p>No Practice tests yet.</p>';

  const missed = missedMost(records);
  const missedList = missed.length ? (reset ? '<p class="sub small">Only answers since the latest Reset count here.</p>' : '') +
    `<ul>${missed.map(m => { const q = BY_ID[m.q]; return `<li><p class="mq">${esc(q.q)}</p><p>Right answer: ${esc(q.a)}</p>` +
      `<p>Wrong answer chosen most often: ${esc(m.wrong)}</p><p class="mcount">Missed ${m.missed} of ${m.answered} times</p><p class="mpage">Driver manual, page ${q.p}</p></li>`; }).join('')}</ul>`
    : `<p>No question has been missed two or more times${reset ? ' since the latest Reset' : ''}.</p>`;

  const lines = studySessions(records);
  const history = lines.length ? `<ul class="sessions">${lines.map(e => e.kind === 'session'
    ? `<li><p class="when">${whenText(e.start)}</p><p>${lengthText(Date.parse(e.end) - Date.parse(e.start))}</p>` +
      (e.sets.length ? `<ul>${e.sets.map(s => `<li>${setName(s.type, s.section, s.number)}: ${s.right} of ${s.of}</li>`).join('')}</ul>` : '<p>No Sets finished.</p>') + '</li>'
    : `<li><p class="when">${whenText(e.at)}</p><p>${historyLine(e)}</p></li>`).join('')}</ul>`
    : '<p>No Study sessions yet.</p>';

  const manage = `<section class="part manage" id="manage"><h2>Manage this Learner</h2>` +
    ['Rename', 'Reset sign-in', 'Reset progress', 'Move', 'Delete'].map((label, k) =>
      `<button class="btn${label === 'Delete' ? ' bad' : ''}" type="button" data-act="${k}">${label}</button>`).join('') + '</section>';

  return now + part('retention', 'Retention', kept) + part('facts', 'Facts', `<ul class="sections">${facts}</ul>`) +
    part('tests', 'Practice tests', testList) + part('missedmost', 'Questions missed most', missedList) +
    part('history', 'Study sessions', history) + manage + '<button class="btn back" type="button">Back to Learners</button>';
}

// Managing Learners: Add a Learner, and Rename, Reset sign-in, Reset progress, Move and Delete
// on a Learner's page. Every action asks first, in literal words, and does nothing on No.
// Afterwards the list or the Learner's page loads again from the server.
const NAME_MAX = 64, PASSWORD_MIN = 8, PASSWORD_MAX = 128; // as the server checks them (server/auth.py)
const MANAGE_ERRORS = {
  'name-taken': 'Another account already uses that name. Choose a different name.',
  'bad-name': `The name must be 1 to ${NAME_MAX} characters.`,
  'bad-password': `The password must be ${PASSWORD_MIN} to ${PASSWORD_MAX} characters.`,
};
// Lengths are counted in characters, as the server counts them, not in UTF-16 units.
const chars = s => [...s].length;
const nameProblem = s => chars(s.trim()) >= 1 && chars(s.trim()) <= NAME_MAX ? null : 'bad-name';
const passwordProblem = s => chars(s) >= PASSWORD_MIN && chars(s) <= PASSWORD_MAX ? null : 'bad-password';

// A POST that changes something. A refusal throws an Error with its `status` and the server's
// error `code`; a good answer gives its JSON, or null when there is none.
async function change(path, body) {
  const r = await postJSON(path, body);
  if (r.ok) return r.status === 204 ? null : r.json();
  const answer = await r.json().catch(() => ({}));
  throw Object.assign(new Error('HTTP ' + r.status), { status: r.status, code: answer.error });
}

// A Helper's form on a screen of its own: `fields` (HTML), the button that goes on to ask first,
// and Cancel, which runs `cancel`. `submit` gets the form's values when the button is pressed.
function helperForm({ title, intro, fields, button, cancel, submit, problem }) {
  paint(`<section class="home helper"><h1 tabindex="-1">${title}</h1>${intro ? `<p class="sub">${intro}</p>` : ''}
    <form id="helperForm" class="signin" novalidate>${fields}<div id="formMsg" aria-live="polite"></div>
    <button class="btn primary" type="submit" id="formBtn">${button}</button></form>
    <button class="btn" type="button" id="cancelBtn">Cancel</button></section>`, 'h1');
  $('cancelBtn').onclick = () => { cancel(); window.scrollTo(0, 0); };
  $('helperForm').onsubmit = e => { e.preventDefault(); submit(); };
  if ($('fShow')) $('fShow').onchange = () => { $('fPassword').type = $('fShow').checked ? 'text' : 'password'; };
  if (problem) formMessage(MANAGE_ERRORS[problem] || problem);
}
function formMessage(text) {
  $('formMsg').innerHTML = `<p class="warn" tabindex="-1">${esc(text)}</p>`;
  $('formMsg').firstChild.focus();
}
const nameField = (label, value) => `<div class="field"><label for="fName">${label}</label><input id="fName" type="text" value="${esc(value)}" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"></div>`;
const passwordField = (label, value, shown) => `<div class="field"><label for="fPassword">${label}</label><input id="fPassword" type="${shown ? 'text' : 'password'}" value="${esc(value)}" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div>` +
  `<label class="check"><input type="checkbox" id="fShow"${shown ? ' checked' : ''}>Show password</label>`;

// Ask first. `question` and `detail` are the literal words; Yes runs `act`, No runs `no`.
// If `act` fails for want of a connection, the question stays with a line saying so.
function confirmAction({ question, detail, yes, no, act }) {
  paint(`<section class="home helper"><h2 tabindex="-1">${esc(question)}</h2>${detail ? `<p>${esc(detail)}</p>` : ''}
    <div id="formMsg" aria-live="polite"></div>
    <button class="btn primary" type="button" id="confirmYes">${esc(yes)}</button>
    <button class="btn" type="button" id="confirmNo">No, go back</button></section>`, 'h2');
  $('confirmNo').onclick = () => { no(); window.scrollTo(0, 0); };
  $('confirmYes').onclick = async () => {
    const btn = $('confirmYes');
    if (btn.disabled) return;
    btn.disabled = true;
    try { await act(); window.scrollTo(0, 0); } catch (e) {
      if (e instanceof SignedOut || !btn.isConnected) return;
      btn.disabled = false;
      formMessage('The change could not be made. Check your connection and try again.');
    }
  };
}

// The buttons of Manage this Learner. `learner` is the Learner's row of GET /api/learners, `p` their Progress.
function wireManage(learner, p) {
  const back = () => openLearnerPage(learner, { at: 'manage' });
  const acts = [() => renameLearner(learner, back), () => resetSignIn(learner, back), () => resetProgress(learner, back),
    () => moveLearner(learner, back, p.unlockMove ? TOTAL_DAYS + 1 : p.cursor), () => deleteLearner(learner, back)];
  document.querySelectorAll('.manage [data-act]').forEach(b => b.onclick = () => { acts[Number(b.dataset.act)](); window.scrollTo(0, 0); });
}

// Rename: a new name, with the same rules as Add a Learner. `back` returns to the Learner's page.
function renameLearner(learner, back, typed = learner.name, problem = null) {
  helperForm({
    title: `Rename ${esc(learner.name)}`, problem, fields: nameField('New name', typed), button: 'Rename', cancel: back,
    submit: () => {
      const value = $('fName').value, bad = nameProblem(value);
      if (bad) return formMessage(MANAGE_ERRORS[bad]);
      const name = value.trim();
      confirmAction({
        question: `Rename ${learner.name} to ${name}?`, yes: 'Yes, rename', no: () => renameLearner(learner, back, value),
        act: async () => {
          let answer;
          try { answer = await change(`/api/learners/${learner.id}/rename`, { name }); } catch (e) {
            if (MANAGE_ERRORS[e.code]) return renameLearner(learner, back, value, e.code);
            if (e.status === 404) return openLearnerPage(learner);
            throw e;
          }
          openLearnerPage({ ...learner, name: answer.name }, { note: `${learner.name} is renamed ${answer.name}.` });
        },
      });
    },
  });
}

// Reset sign-in: a new password. The server ends every sign-in of the Learner and any pause on their name.
function resetSignIn(learner, back, v = { password: '', shown: false }, problem = null) {
  const name = learner.name;
  helperForm({
    title: `Reset sign-in for ${esc(name)}`, intro: `${esc(name)} will sign in with the new password.`, problem,
    fields: passwordField('New password', v.password, v.shown), button: 'Set the new password', cancel: back,
    submit: () => {
      const typed = { password: $('fPassword').value, shown: $('fShow').checked }, bad = passwordProblem(typed.password);
      if (bad) return formMessage(MANAGE_ERRORS[bad]);
      confirmAction({
        question: `Set a new password for ${name}?`,
        detail: `${name} will be signed out on every device and will need the new password to sign in.`,
        yes: 'Yes, set the new password', no: () => resetSignIn(learner, back, typed),
        act: async () => {
          try { await change(`/api/learners/${learner.id}/reset-sign-in`, { password: typed.password }); } catch (e) {
            if (MANAGE_ERRORS[e.code]) return resetSignIn(learner, back, typed, e.code);
            if (e.status === 404) return openLearnerPage(learner);
            throw e;
          }
          openLearnerPage(learner, { note: `${name}'s new password is set.` });
        },
      });
    },
  });
}

// Reset progress: a Reset record. Every fact is new again and new facts start at Section 1; the History stays.
function resetProgress(learner, back) {
  const name = learner.name;
  confirmAction({
    question: `Put ${name} back at the start of Section 1?`,
    detail: 'Every fact goes back to new, and Practice tests start over. The History of finished Sets is kept.',
    yes: 'Yes, reset progress', no: back,
    act: async () => {
      try { await change(`/api/learners/${learner.id}/reset-progress`, {}); } catch (e) {
        if (e.status === 404) return openLearnerPage(learner);
        throw e;
      }
      openLearnerPage(learner, { note: `${name}'s progress is reset to the start of Section 1.` });
    },
  });
}

// Move: a Move record that sets the Section new facts come from, 1 to 12, or 13 to unlock Practice
// tests. It changes no fact's standing.
const moveChoice = to => to > TOTAL_DAYS ? 'Unlock practice tests now' : `Start new facts from Section ${to}`;
function moveLearner(learner, back, to) {
  const name = learner.name;
  const options = Array.from({ length: TOTAL_DAYS + 1 }, (_, k) =>
    `<option value="${k + 1}"${k + 1 === to ? ' selected' : ''}>${moveChoice(k + 1)}</option>`).join('');
  helperForm({
    title: `Move ${esc(name)}`, button: 'Move', cancel: back,
    fields: `<div class="field"><label for="fTo">What to change for ${esc(name)}</label><select id="fTo">${options}</select></div>`,
    submit: () => {
      const chosen = Number($('fTo').value), choice = moveChoice(chosen);
      confirmAction({
        question: `${choice} for ${name}?`,
        detail: 'Every fact keeps its standing, and the History is kept. Any unfinished Set is dropped.',
        yes: `Yes, ${choice[0].toLowerCase()}${choice.slice(1)}`, no: () => moveLearner(learner, back, chosen),
        act: async () => {
          try { await change(`/api/learners/${learner.id}/move`, { to: chosen }); } catch (e) {
            if (e.status === 404) return openLearnerPage(learner);
            throw e;
          }
          openLearnerPage(learner, { note: chosen > TOTAL_DAYS ? `Practice tests are unlocked for ${name}.` : `${name}'s new facts now come from Section ${chosen}.` });
        },
      });
    },
  });
}

// Delete: the account and all of its records, for good. The question and the button are on one
// screen, and the button stays off until the Helper types the Learner's name (matched as at sign-in:
// capitals ignored, spaces at the start and end trimmed). Afterwards, back to the list.
function deleteLearner(learner, back) {
  const name = learner.name, key = s => s.trim().toLowerCase();
  paint(`<section class="home helper"><h1 tabindex="-1">Delete ${esc(name)}</h1>
    <p>Delete ${esc(name)} and all of ${esc(name)}'s progress and History? This cannot be undone.</p>
    <div class="field"><label for="fName">Type ${esc(name)} to delete</label><input id="fName" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div id="formMsg" aria-live="polite"></div>
    <button class="btn bad primary" type="button" id="deleteBtn" disabled>Delete ${esc(name)}</button>
    <button class="btn" type="button" id="keepBtn">No, keep ${esc(name)}</button></section>`, 'h1');
  const btn = $('deleteBtn');
  $('fName').oninput = () => { btn.disabled = key($('fName').value) !== key(name); };
  $('keepBtn').onclick = () => { back(); window.scrollTo(0, 0); };
  btn.onclick = async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    try { await change(`/api/learners/${learner.id}/delete`, { name: $('fName').value }); } catch (e) {
      if (e instanceof SignedOut || !btn.isConnected) return;
      if (e.status === 404) return renderHelper();
      btn.disabled = false;
      return formMessage(e.code === 'name-mismatch' ? `The name you typed does not match ${name}.`
        : 'The change could not be made. Check your connection and try again.');
    }
    renderHelper(`${name} is deleted.`);
    window.scrollTo(0, 0);
  };
}

// Add a Learner: a name and a password, then back to the list.
function addLearner(v = { name: '', password: '', shown: false }, problem = null) {
  helperForm({
    title: 'Add a Learner', intro: 'The Learner signs in with this name and password.', problem,
    fields: nameField('Name', v.name) + passwordField('Password', v.password, v.shown),
    button: 'Add this Learner', cancel: () => renderHelper(),
    submit: () => {
      const typed = { name: $('fName').value, password: $('fPassword').value, shown: $('fShow').checked };
      const bad = nameProblem(typed.name) || passwordProblem(typed.password);
      if (bad) return formMessage(MANAGE_ERRORS[bad]);
      const name = typed.name.trim();
      confirmAction({
        question: `Add a Learner named ${name}?`, yes: `Yes, add ${name}`, no: () => addLearner(typed),
        act: async () => {
          try { await change('/api/learners', { name, password: typed.password }); } catch (e) {
            if (MANAGE_ERRORS[e.code]) return addLearner(typed, e.code);
            throw e;
          }
          renderHelper(`${name} is added.`);
        },
      });
    },
  });
}

startUp();
// The service worker (sw.js) keeps the page, the questions, the fonts and the icons, so the app opens with no connection.
window.addEventListener('load', () => {
  if (navigator.serviceWorker) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
});
</script>
</body>
</html>
