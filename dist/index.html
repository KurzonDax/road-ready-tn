unts.", "p": 83, "src": "at least 16, but is not yet 21 years old, and who is found: (1) driving with a BAC of .02 percent", "day": 11}, {"id": "c-126", "q": "How does the alcohol in a 12-ounce beer compare to a 1-ounce shot of whiskey?", "a": "It is about the same", "o": ["The beer has much less", "The beer has much more", "The beer has none"], "why": "A 12-ounce beer has about as much alcohol as a 1-ounce shot of whiskey. Drinking beer instead of whiskey does not make you any safer.", "p": 83, "src": "The amount of alcohol in one (12 ounce) bottle of beer is about equal to that in a (1 ounce) shot of whiskey.", "day": 11}, {"id": "c-093", "q": "Which driving skills are affected by alcohol and drugs?", "a": "Alertness, concentration, reaction time, and coordination", "o": ["Only reaction time", "Only alertness and concentration, but not reaction time or coordination", "None of them, if you feel fine"], "why": "Alcohol also affects judgment and vision, the two most important driving abilities.", "p": 80, "src": "Drinking alcohol impairs a wide range of skills necessary for carrying out these tasks.", "s": 1, "day": 11}, {"id": "c-092", "q": "What does Tennessee's Implied Consent law mean?", "a": "By driving, you agree to be tested for alcohol or drugs if an officer asks", "o": ["Traffic laws apply even without any signs, markings, or signals at an intersection", "The owner of a vehicle will carry proper insurance", "You agree to let police search your car any time"], "why": "The officer must have reasonable grounds to believe you are driving under the influence.", "p": 81, "src": "when you drive in Tennessee, you have given your consent to be tested to determine the alcohol or drug content of your blood.", "s": 1, "day": 11}, {"id": "c-090", "q": "You had three beers in the past hour. About how long will it take for the alcohol to leave your blood?", "a": "About three hours", "o": ["About one hour", "About two hours", "About thirty minutes"], "why": "It takes about one hour to cancel the effects of one drink.", "p": 83, "src": "It takes about three hours to cancel the intoxicating effects of three drinks.", "s": 1, "day": 11}, {"id": "c-134", "q": "Which of these can get a driver license revoked or suspended?", "a": "Fraudulently altering a driver license", "o": ["Renewing your license a week early", "Driving a borrowed car with permission", "Moving to another county in Tennessee"], "why": "Frequent violations that add up to 12 or more points in 12 months can also lead to suspension for adults.", "p": 85, "src": "Allowing unlawful use of a driver license, including fraudulently altering a driver license", "s": 1, "day": 11}, {"id": "a-036", "q": "Under Tennessee's Hands Free law, which is illegal for a driver?", "a": "Holding a phone with any part of your body", "o": ["Listening to the radio while driving", "Talking on the phone in hands-free mode", "Using the car's built-in rear camera"], "why": "It is illegal to hold a phone with any part of your body, to text, to watch video, or to record or broadcast video while driving.", "p": 30, "src": "(a) hold a cellphone or mobile device with any part of their body,", "day": 12}, {"id": "a-044", "q": "Who must wear a safety belt any time the vehicle is moving?", "a": "The driver and all front-seat passengers", "o": ["Only the driver", "Only the driver and passengers who are under 18", "Only passengers in the back seat"], "why": "Safety belts are required for ALL drivers and all front-seat passengers any time the vehicle is in motion.", "p": 31, "src": "Safety belts are required for ALL drivers and all passengers in the FRONT seat, any time the vehicle is in motion.", "day": 12}, {"id": "a-074", "q": "What is the safest place for children 12 and under to ride in a car with air bags?", "a": "The back seat", "o": ["The front seat", "The bed of a pickup truck", "The front seat with the seat moved forward"], "why": "Children ages 12 and under are safer in the back seat. Air bags pose a severe risk to children of that age.", "p": 33, "src": "CHILDREN ages 12 and under are safer in the back seat of a vehicle.", "s": 1, "day": 12}, {"id": "a-001", "q": "What are properly adjusted seat head restraints designed to do?", "a": "Prevent whiplash if you are hit from behind", "o": ["Keep your head straight when you check mirrors", "Hold your head still during a sharp turn", "Protect your head if the air bag opens"], "why": "Head restraints are designed to prevent whiplash if you are hit from behind. Adjust them level with the back of your head.", "p": 27, "src": "Head restraints are designed to prevent whiplash if hit from behind.", "s": 1, "day": 12}, {"id": "a-002", "q": "How high should you adjust the seat head restraint?", "a": "Level with the back of your head", "o": ["Level with the base of your neck", "Level with the top of your shoulders", "Just above the top of your head"], "why": "Adjust the head restraint to a level even with the back of the head.", "p": 27, "src": "Properly adjust seat head restraints to a level even with the back of the head.", "s": 1, "day": 12}, {"id": "c-155", "q": "You are involved in a crash. What does the law require first?", "a": "Stop right away at or near the scene, without blocking traffic", "o": ["Drive to the nearest police station and report the crash in person", "Keep driving if no one looks hurt", "Stop only if the crash was your fault"], "why": "Turn off the ignition of a damaged car to prevent a fire. Never leave the scene.", "p": 89, "src": "stop immediately at the scene, or as close to the scene as possible without obstructing traffic.", "day": 12}, {"id": "c-133", "q": "You are not the first at a crash scene and your help is not needed. What should you do?", "a": "Slowly drive on and do not get in the way", "o": ["Stop and look to satisfy your curiosity", "Slow down to calm your nerves", "Park nearby to watch the rescue"], "why": "Slowing down to look at a crash (“accident gazing”) can cause more crashes and block emergency crews.", "p": 90, "src": "slowly continue on in your vehicle so not to interfere with the arrival of police and emergency medical and fire/rescue services.", "s": 1, "day": 12}, {"id": "a-050", "q": "Which statement about car seats is correct?", "a": "Rear-facing if under 1 year old and under 20 pounds. Forward-facing if 1 through 3 years old and over 20 pounds", "o": ["Forward-facing if under 1 year old and under 20 pounds. Rear-facing if 1 through 3 years old and over 20 pounds", "Rear-facing if under 1 year old and under 20 pounds. Booster seat if 1 through 3 years old and over 20 pounds", "Booster seat if under 1 year old and under 20 pounds. Seat belt only if 1 through 3 years old and over 20 pounds"], "why": "A child under 1 year old, or any child under 20 pounds, must ride rear-facing. Children 1 through 3 years old who weigh more than 20 pounds must ride forward-facing.", "p": 31, "src": "facing the rear of the car... one through three years old, and who weigh more than 20 pounds... facing forward.", "s": 1, "day": 12}, {"id": "a-059", "q": "How should a pregnant woman wear her safety belt?", "a": "Lap belt below the abdomen, shoulder belt above the belly", "o": ["Lap belt across the middle of the belly, shoulder belt under the arm", "Only the lap belt, without the shoulder belt", "Only the shoulder belt, without the lap belt"], "why": "Pregnant women should wear the lap belt below the abdomen and the shoulder belt above the belly.", "p": 31, "src": "Pregnant women should wear the lap belt below the abdomen and the shoulder belt above the belly.", "s": 1, "day": 12}, {"id": "c-132", "q": "After a reportable crash, how long does the driver have to file a crash report with the Department of Safety?", "a": "20 days", "o": ["10 days", "48 hours", "30 days"], "why": "This is required no matter who is to blame.", "p": 89, "src": "must file an Owner/Driver Report of the crash to the Tennessee Department of Safety and Homeland Security within 20 days.", "s": 1, "day": 12}]};
const SIGNS = {
  octagon: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#c62828" stroke="#7a1a1a" stroke-width="2"/></svg>',
  triangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="4,10 96,10 50,92" fill="#c62828"/><polygon points="20,20 80,20 50,73" fill="#fff"/></svg>',
  circle: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#f2c230" stroke="#222" stroke-width="3"/><line x1="22" y1="22" x2="78" y2="78" stroke="#222" stroke-width="6"/><line x1="78" y1="22" x2="22" y2="78" stroke="#222" stroke-width="6"/></svg>',
  crossbuck: '<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#222" stroke-width="3"/></g><g transform="rotate(-45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#222" stroke-width="3"/></g></svg>',
  diamond: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 96,50 50,96 4,50" fill="#f2c230" stroke="#222" stroke-width="3"/></svg>',
  rectangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="20" y="6" width="60" height="88" rx="4" fill="#fff" stroke="#222" stroke-width="3"/><rect x="30" y="20" width="40" height="6" fill="#222"/><rect x="30" y="36" width="40" height="6" fill="#222"/><rect x="34" y="56" width="32" height="24" fill="#222"/></svg>',
  swatch: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="80" height="56" rx="6" fill="${c}" stroke="#555" stroke-width="2"/></svg>`
};
const DAYS = DATA.days, QS = DATA.qs, TOTAL_DAYS = DAYS.length;
const BY_ID = Object.fromEntries(QS.map(q => [q.id, q]));
const TEST_LEN = 30, READY_SCORE = 27, READY_STREAK = 3, PASS_SCORE = 24;
const KEY = 'tn-permit-daily-v1'; // keep this key: changing it would erase saved progress on existing devices

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const canSave = (() => { try { localStorage.setItem(KEY + '-check', '1'); localStorage.removeItem(KEY + '-check'); return true; } catch (e) { return false; } })();
let S = Object.assign({ day: 1, last: {}, tests: [] }, load() || {});
let run = null; // the set on screen; a copy is kept in S.run so leaving the page doesn't lose answers

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const reviewPile = () => QS.filter(q => S.last[q.id] === false);
function streak() { let n = 0; for (let i = S.tests.length - 1; i >= 0 && S.tests[i] >= READY_SCORE; i--) n++; return n; }

function phase() {
  if (S.day <= TOTAL_DAYS) return 'day';
  if (streak() >= READY_STREAK) return 'test';
  if (reviewPile().length) return 'review';
  return 'test';
}

// Saved runs store question ids and the shown option order. A run that no longer matches the questions is dropped.
function packRun(r) {
  return { kind: r.kind, dayNum: r.dayNum, i: r.i, answered: r.answered, items: r.items.map(it => ({ id: it.q.id, options: it.options, chosen: it.chosen })) };
}
function unpackRun(p) {
  try {
    const items = p.items.map(x => {
      const q = BY_ID[x.id];
      if (!q || x.options.slice().sort().join('\n') !== [q.a, ...q.o].sort().join('\n')) throw new Error('changed');
      return { q, options: x.options, chosen: x.chosen };
    });
    if (!items.length || p.i < 0 || p.i >= items.length) return null;
    return { kind: p.kind, dayNum: p.dayNum, i: p.i, answered: !!p.answered, items };
  } catch (e) { return null; }
}
function keepRun() { S.run = run ? packRun(run) : null; save(); }

function runName(r) {
  if (r.kind === 'day') return `Section ${r.dayNum}`;
  if (r.kind === 'redo') return `Section ${r.dayNum}`;
  if (r.kind === 'review') return 'Review';
  return 'Practice test';
}

let painted = false;
function paint(html, focus) {
  $('stage').innerHTML = html;
  if (painted && focus) { const el = document.querySelector(focus); if (el) el.focus({ preventScroll: true }); }
  painted = true;
}

function roadMarkers() {
  const ph = phase(), ready = streak() >= READY_STREAK;
  const item = (cls, label, sr) => `<li class="stop ${cls}"${cls.includes('now') ? ' aria-current="step"' : ''}><span aria-hidden="true">${label}</span><span class="vh">${sr}</span></li>`;
  let html = DAYS.map(d => d.day < S.day ? item('done', d.day, `Section ${d.day}, finished`)
    : d.day === S.day ? item('now', d.day, `Section ${d.day}, next`)
    : item('', d.day, `Section ${d.day}, not started`)).join('');
  const reviewed = S.day > TOTAL_DAYS && ph !== 'review';
  html += item(`wide ${ph === 'review' ? 'now' : reviewed ? 'done' : ''}`, 'Review', `Review${ph === 'review' ? ', next' : reviewed ? ', finished' : ''}`);
  html += item(`wide ${ready ? 'done' : ph === 'test' ? 'now' : ''}`, 'Practice tests', `Practice tests${ready ? ', ready' : ph === 'test' ? ', next' : ''}`);
  const legend = S.day > 1 ? `<p class="sub small">Green means finished.${ready ? '' : ' The outlined one is next.'}</p>` : '';
  return `<section class="track" aria-labelledby="trackLabel"><h2 class="label" id="trackLabel">Your progress</h2><ol class="road">${html}</ol>${legend}</section>`;
}

function scoresPanel() {
  const scores = S.scores || {};
  const done = DAYS.filter(d => d.day < S.day);
  if (!done.length) return '';
  const rows = done.map(d => `<li><div><span class="sname">Section ${d.day}: ${esc(d.title)}</span><span class="sscore">${scores[d.day] !== undefined ? `Last time: ${scores[d.day]} of 10 right` : 'Finished'}</span></div><button type="button" class="btn slim redo" data-day="${d.day}">Do Section ${d.day} again</button></li>`).join('');
  return `<details class="scores"><summary>See your section scores</summary><ul>${rows}</ul></details>`;
}

const disclaimer = `<p class="fine">This is a practice app. It is not made by the State of Tennessee. The questions come from the Tennessee Comprehensive Driver License Manual, July 1, 2022 edition.</p>`;

function renderHome() {
  run = null;
  const saved = S.run && unpackRun(S.run);
  if (S.run && !saved) { S.run = null; save(); }
  if (saved) return renderResume(saved);
  const ph = phase(), st = streak(), ready = ph === 'test' && st >= READY_STREAK;
  let top, sub = '', btn, extra = '';
  if (ph === 'day') {
    const d = DAYS[S.day - 1];
    top = `<h1 tabindex="-1">Section ${S.day} of ${TOTAL_DAYS}</h1><p class="theme">${esc(d.title)}</p>`;
    sub = S.day === 1
      ? '10 questions. There is no time limit. After each answer, you will see the right answer and what the driver manual says about it.'
      : '10 questions. There is no time limit.';
    btn = `Start Section ${S.day}`;
  } else if (ph === 'review') {
    const n = reviewPile().length;
    top = `<h1 tabindex="-1">Review</h1><p class="theme">${plural(n, 'question', 'questions')} to go back over</p>`;
    sub = `These are questions you got wrong before.${n > 10 ? ' You will do them 10 at a time.' : ''}`;
    btn = 'Start review';
  } else if (ready) {
    top = `<div class="sign"><h1 tabindex="-1">Ready for the test</h1><p>You got ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row.</p></div>`;
    sub = 'You can keep taking practice tests if you want more practice.';
    btn = 'Take another practice test';
  } else {
    top = `<h1 tabindex="-1">Practice tests</h1><p class="theme">${TEST_LEN} questions, like the real test. There is no time limit.</p>`;
    sub = `To be ready, get ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row. A test with fewer than ${READY_SCORE} right starts the count over. The real test needs ${PASS_SCORE} right to pass.`;
    extra = `<div class="streak"><span class="ticks" aria-hidden="true">${[0, 1, 2].map(i => `<span class="${i < st ? 'on' : ''}"></span>`).join('')}</span><span>In a row so far: <strong>${st} of ${READY_STREAK}</strong></span></div>`;
    btn = 'Start practice test';
  }
  paint(`
    <section class="home">
      ${top}
      ${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
      ${extra}
      ${canSave ? '' : '<p class="warn">This browser is not saving your progress. If you close this page, you will start again from Section 1.</p>'}
      <button class="btn primary" type="button" id="startBtn">${btn}</button>
      ${roadMarkers()}
      ${scoresPanel()}
      ${disclaimer}
    </section>`, 'h1');
  $('startBtn').onclick = () => start();
  document.querySelectorAll('.redo').forEach(b => b.onclick = () => start(Number(b.dataset.day)));
}

function renderResume(saved) {
  const n = saved.items.length, done = saved.i + (saved.answered ? 1 : 0);
  const name = runName(saved);
  const head = saved.kind === 'day' ? `Section ${saved.dayNum} of ${TOTAL_DAYS}` : saved.kind === 'redo' ? `Section ${saved.dayNum} again` : name;
  paint(`
    <section class="home">
      <h1 tabindex="-1">${head}</h1>
      <p class="theme">You stopped partway through.</p>
      <p class="sub">You answered ${done} of ${n} questions. Your answers are saved.</p>
      <button class="btn primary" type="button" id="resumeBtn">Continue where I stopped</button>
      <button class="link" type="button" id="overBtn">Start over from question 1 (this clears these answers)</button>
    </section>`, 'h1');
  $('resumeBtn').onclick = () => { run = saved; renderQuestion(); };
  $('overBtn').onclick = () => { S.run = null; save(); start(saved.kind === 'redo' ? saved.dayNum : undefined); };
}

function start(redoDay) {
  const ph = redoDay ? 'redo' : phase();
  let qs;
  if (ph === 'redo') qs = shuffle(QS.filter(q => q.day === redoDay));
  else if (ph === 'day') qs = QS.filter(q => q.day === S.day);
  else if (ph === 'review') qs = shuffle(reviewPile()).slice(0, 10);
  else qs = shuffle(QS).slice(0, TEST_LEN);
  run = { kind: ph, dayNum: redoDay || S.day, items: qs.map(q => ({ q, options: shuffle([q.a, ...q.o]), chosen: null })), i: 0, answered: false };
  keepRun();
  renderQuestion();
}

function visual(q) { return q.sign ? SIGNS[q.sign] || '' : q.swatch ? SIGNS.swatch(q.swatch) : ''; }

function renderQuestion(revealFeedback) {
  const it = run.items[run.i], q = it.q, n = run.items.length, last = run.i === n - 1;
  const L = ['A', 'B', 'C', 'D'];
  const right = it.chosen === q.a;
  const opts = it.options.map((o, k) => {
    if (!run.answered) return `<li><button type="button" class="opt" data-k="${k}" aria-keyshortcuts="${L[k]}"><span class="key">${L[k]}</span><span class="otext">${esc(o)}</span></button></li>`;
    let c = 'rest', tag = '';
    if (o === q.a) { c = 'right'; tag = o === it.chosen ? 'Your answer. It is correct.' : 'Correct answer'; }
    else if (o === it.chosen) { c = 'wrong'; tag = 'Your answer'; }
    return `<li class="opt ${c}"><span class="key" aria-hidden="true">${L[k]}</span><span class="otext"><span>${esc(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</span></li>`;
  }).join('');
  const fb = run.answered ? `<div class="feedback" id="feedback">
      ${right ? '<p class="verdict good">Correct.</p>' : `<p class="verdict">Not correct. The right answer is: ${esc(q.a)}</p>`}
      <p class="why">${esc(q.why)}</p>
      ${q.src ? `<figure class="src"><figcaption>Driver manual, page ${q.p}</figcaption><blockquote>“${esc(q.src)}”</blockquote></figure>` : ''}
    </div>` : '';
  const done = run.i + (run.answered ? 1 : 0);
  paint(`
    <div class="home">
      <div class="progress"><span>${runName(run)}: question ${run.i + 1} of ${n}</span><div class="bar" aria-hidden="true"><span style="width:${done / n * 100}%"></span></div></div>
      <div class="card">
        ${visual(q) ? `<div class="visual">${visual(q)}</div>` : ''}
        <h1 class="q" id="qText" tabindex="-1">${esc(q.q)}</h1>
        <ul class="options" aria-labelledby="qText">${opts}</ul>
        ${fb}
      </div>
      ${run.answered ? `<button class="btn primary" type="button" id="nextBtn">${last ? 'See my score' : 'Next question'}</button>` : ''}
      <button class="link" type="button" id="quitBtn">Stop for now and save my place</button>
    </div>`, run.answered ? null : '#qText');
  if (run.answered) {
    $('nextBtn').onclick = next;
    $('nextBtn').focus({ preventScroll: true });
    if (revealFeedback) reveal();
  } else document.querySelectorAll('button.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.k)));
  $('quitBtn').onclick = () => { keepRun(); renderHome(); window.scrollTo(0, 0); };
}

// After answering, bring the explanation into view above the pinned Next button without pushing the verdict off the top.
function reveal() {
  const fb = $('feedback'), nb = $('nextBtn');
  if (!fb || !nb) return;
  const r = fb.getBoundingClientRect();
  const limit = window.innerHeight - nb.offsetHeight - 32;
  const dy = Math.min(r.bottom - limit, r.top - 16);
  if (dy > 0) window.scrollBy({ top: dy });
}

function choose(k) {
  if (run.answered) return;
  const it = run.items[run.i];
  it.chosen = it.options[k];
  run.answered = true;
  keepRun();
  renderQuestion(true);
  const q = it.q;
  $('announce').textContent = it.chosen === q.a ? `Correct. ${q.a}.` : `Not correct. You chose: ${it.chosen}. The right answer is: ${q.a}.`;
}

function next() {
  $('announce').textContent = '';
  if (run.i < run.items.length - 1) { run.i++; run.answered = false; keepRun(); window.scrollTo({ top: 0, behavior: 'instant' }); renderQuestion(); }
  else finish();
}

function finish() {
  const items = run.items, n = items.length, kind = run.kind;
  items.forEach(it => { S.last[it.q.id] = it.chosen === it.q.a; });
  const right = items.filter(it => it.chosen === it.q.a).length;
  if (kind === 'day' || kind === 'redo') { S.scores = S.scores || {}; S.scores[run.dayNum] = right; }
  const missed = items.filter(it => it.chosen !== it.q.a);
  const toReview = 'The questions you missed go into review. You will do them before the next practice test.';
  let title, note = '', sign = false;
  if (kind === 'redo') {
    title = `Section ${run.dayNum} done.`;
    note = missed.length ? 'You can do it again now, or another day from "See your section scores".' : 'You got every one right.';
  } else if (kind === 'day') {
    title = `Section ${S.day} done.`;
    note = missed.length ? `You can do this section again now, or another day from "See your section scores". The questions you missed also come back in review after Section ${TOTAL_DAYS}.` : 'You got every one right.';
    S.day++;
  } else if (kind === 'review') {
    const left = reviewPile().length;
    title = 'This review set is done.';
    note = left ? `${plural(left, 'question is', 'questions are')} still in review. Questions you missed this time stay in review.` : 'Review is finished. Next: practice tests.';
  } else {
    const before = streak();
    S.tests.push(right);
    const st = streak();
    if (st >= READY_STREAK) {
      sign = true;
      title = 'You are ready for the real test.';
      note = `You got ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row.`;
    } else if (right >= READY_SCORE) {
      title = 'That counts toward ready.';
      note = `In a row so far: ${st} of ${READY_STREAK}. Get ${READY_SCORE} or more right on ${plural(READY_STREAK - st, 'more test', 'more tests')} to be ready.` + (missed.length ? ' ' + toReview : '');
    } else {
      title = right >= PASS_SCORE ? 'That would pass the real test.' : 'This would not pass the real test yet.';
      note = [right >= PASS_SCORE ? `To count toward ready, you need ${READY_SCORE} or more right.` : `The real test needs ${PASS_SCORE} right to pass.`,
        before ? 'The count of tests in a row starts over.' : '', missed.length ? toReview : ''].filter(Boolean).join(' ');
    }
  }
  const nextDay = phase() === 'day' && kind === 'day';
  const againDay = run.dayNum;
  run = null;
  S.run = null;
  save();
  const list = missed.map(it => `<li><p class="mq">${esc(it.q.q)}</p><p>Right answer: ${esc(it.q.a)}</p><p class="mwhy">${esc(it.q.why)}</p><p class="mpage">Driver manual, page ${it.q.p}</p></li>`).join('');
  paint(`
    <section class="home">
      <p class="score">${right} of ${n}</p>
      ${sign ? `<div class="sign"><h2 tabindex="-1">${title}</h2><p>${esc(note)}</p></div>` : `<h2 tabindex="-1">${title}</h2>${note ? `<p class="sub">${esc(note)}</p>` : ''}`}
      ${missed.length ? `<details class="missed"><summary>See the ${plural(missed.length, 'question', 'questions')} you missed</summary><ul>${list}</ul></details>` : ''}
      ${missed.length && (kind === 'day' || kind === 'redo') ? `<button class="btn" type="button" id="againBtn">Do Section ${againDay} again</button>` : ''}
      <button class="btn primary" type="button" id="homeBtn">I'm done for now</button>
      ${nextDay ? `<button class="link" type="button" id="moreBtn">Go on to Section ${S.day} now</button>` : ''}
    </section>`, 'h2');
  window.scrollTo({ top: 0, behavior: 'instant' });
  $('homeBtn').onclick = () => { renderHome(); window.scrollTo({ top: 0, behavior: 'instant' }); };
  if ($('againBtn')) $('againBtn').onclick = () => { start(againDay); window.scrollTo({ top: 0, behavior: 'instant' }); };
  if ($('moreBtn')) $('moreBtn').onclick = () => { start(); window.scrollTo({ top: 0, behavior: 'instant' }); };
}

document.addEventListener('keydown', e => {
  if (!run || run.answered || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
  if (k >= 0) { e.preventDefault(); choose(k); }
});

// Hidden controls: add #restart or #section5 (any number; 13 = review and tests) to the end of the link.
function confirmRestart() {
  paint(`<section class="home"><h2 tabindex="-1">Start over from Section 1?</h2><p class="sub">This erases all saved progress on this device.</p><button class="btn primary" type="button" id="yes">Erase my progress and start over</button><button class="btn" type="button" id="no">Keep my progress</button></section>`, 'h2');
  $('yes').onclick = () => { S = { day: 1, last: {}, tests: [], scores: {} }; save(); history.replaceState(null, '', location.pathname + location.search); renderHome(); };
  $('no').onclick = () => { history.replaceState(null, '', location.pathname + location.search); renderHome(); };
}
function applyHash() {
  const hash = (location.hash || '').toLowerCase();
  const jump = hash.match(/^#(?:day|section)(\d+)$/);
  if (hash === '#restart') return confirmRestart();
  if (jump) { S.day = Math.min(Math.max(1, Number(jump[1])), TOTAL_DAYS + 1); S.run = null; save(); }
  renderHome();
}
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
</html>
