<title>Road Ready TN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@600;800&display=swap">
<style>
/* Layout: one calm column. Home shows only today's set; a question screen; a short results screen. Highway guide-sign palette. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17221c;
  --muted: #5b6a61;
  --line: #d6ddd7;
  --guide: #1f5f3f;
  --guide-ink: #ffffff;
  --guide-soft: #e2efe7;
  --warn: #c99a12;
  --warn-soft: #fbf1cc;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --focus: #2a6fdb;
  --font-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32;
    --guide: #3f9a6c; --guide-ink: #0c1410; --guide-soft: #1f3328; --warn: #e2b53a; --warn-soft: #3a3218;
    --bad: #f08a80; --bad-soft: #3d1f1c; --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32;
  --guide: #3f9a6c; --guide-ink: #0c1410; --guide-soft: #1f3328; --warn: #e2b53a; --warn-soft: #3a3218;
  --bad: #f08a80; --bad-soft: #3d1f1c; --focus: #7fb0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.plate { align-self: flex-start; background: var(--guide); color: var(--guide-ink); font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 9vw, 48px); }
h2 { font-size: clamp(24px, 6vw, 30px); }
.theme { font-size: 20px; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.home { display: flex; flex-direction: column; gap: 14px; }

.road { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.stop { width: 30px; height: 30px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--muted); background: var(--surface); font-variant-numeric: tabular-nums; }
.stop.done { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.stop.done.g-mid { background: var(--warn); border-color: var(--warn); color: #17221c; }
.stop.done.g-low { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.stop.now { border: 2.5px solid var(--guide); color: var(--ink); }
.stop.wide { width: auto; padding: 0 8px; }
button.stop { font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 13px; cursor: pointer; padding: 0; }
button.stop.wide { padding: 0 8px; }
.small { font-size: 15px; }

.btn { font: inherit; font-weight: 700; font-size: 19px; padding: 16px 18px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.btn.primary { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.link { font: inherit; font-size: 16px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px 0; align-self: center; }
.btn:focus-visible, .opt:focus-visible, .link:focus-visible, summary:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.progress { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; }
.bar { flex: 1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--guide); width: 0; }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.q { font-size: clamp(21px, 5vw, 25px); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
.visual { display: flex; justify-content: center; }
.visual svg { width: 110px; height: 110px; max-width: 100%; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt { font: inherit; font-size: 18px; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--guide); background: var(--guide-soft); font-weight: 700; }
.opt.right .key { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.feedback { border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.verdict { font-weight: 700; margin: 0; }
.verdict.good { color: var(--guide); }
.verdict.bad { color: var(--bad); }
.why { margin: 0; }
.src { margin: 0; font-size: 15px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; font-style: italic; }

.score { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.missed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.missed li { border-top: 1.5px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.missed p { margin: 0; }
.missed .mq { font-weight: 700; }

</style>

<div class="wrap">
  <span class="plate">Tennessee permit test</span>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
const DATA = __DATA__;
const SIGNS = {
  octagon: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#c62828" stroke="#7a1a1a" stroke-width="2"/></svg>',
  triangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="4,10 96,10 50,92" fill="#c62828"/><polygon points="20,20 80,20 50,73" fill="#fff"/></svg>',
  circle: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#f2c230" stroke="#222" stroke-width="3"/><line x1="22" y1="22" x2="78" y2="78" stroke="#222" stroke-width="6"/><line x1="78" y1="22" x2="22" y2="78" stroke="#222" stroke-width="6"/></svg>',
  crossbuck: '<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#222" stroke-width="3"/></g><g transform="rotate(-45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#222" stroke-width="3"/></g></svg>',
  diamond: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 96,50 50,96 4,50" fill="#f2c230" stroke="#222" stroke-width="3"/></svg>',
  rectangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="20" y="6" width="60" height="88" rx="4" fill="#fff" stroke="#222" stroke-width="3"/><rect x="30" y="20" width="40" height="6" fill="#222"/><rect x="30" y="36" width="40" height="6" fill="#222"/><rect x="34" y="56" width="32" height="24" fill="#222"/></svg>',
  swatch: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="80" height="56" rx="6" fill="${c}" stroke="#555" stroke-width="2"/></svg>`
};
const DAYS = DATA.days, QS = DATA.qs, TOTAL_DAYS = DAYS.length;
const TEST_LEN = 30, READY_SCORE = 27, READY_STREAK = 3;
const KEY = 'tn-permit-daily-v1'; // keep this key: changing it would erase saved progress on existing devices

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = Object.assign({ day: 1, last: {}, tests: [] }, load() || {});
let run = null; // current set in progress

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const reviewPile = () => QS.filter(q => S.last[q.id] === false);
function streak() { let n = 0; for (let i = S.tests.length - 1; i >= 0 && S.tests[i] >= READY_SCORE; i--) n++; return n; }

function phase() {
  if (S.day <= TOTAL_DAYS) return 'day';
  if (streak() >= READY_STREAK) return 'test';
  if (reviewPile().length) return 'review';
  return 'test';
}

function roadMarkers() {
  const ph = phase();
  const scores = S.scores || {};
  const grade = s => s === undefined ? '' : s === 10 ? 'g-all' : s >= 7 ? 'g-mid' : 'g-low';
  let html = DAYS.map(d => d.day < S.day
    ? `<button type="button" class="stop done redo ${grade(scores[d.day])}" data-day="${d.day}" aria-label="Section ${d.day}${scores[d.day] !== undefined ? ', ' + scores[d.day] + ' of 10' : ''}. Tap to do it again." title="${scores[d.day] !== undefined ? scores[d.day] + ' of 10' : ''}">${d.day}</button>`
    : `<span class="stop ${d.day === S.day ? 'now' : ''}">${d.day}</span>`).join('');
  html += `<span class="stop wide ${ph === 'review' ? 'now' : ''}">Review</span>`;
  html += `<span class="stop wide ${ph === 'test' ? 'now' : ''} ${streak() >= READY_STREAK ? 'done' : ''}">Tests</span>`;
  const hint = S.day > 1 ? `<p class="sub small">Green = 10 of 10. Yellow = 7 to 9. Red = under 7. Tap a finished section to do it again.</p>` : '';
  return `<div class="road" aria-label="Your progress">${html}</div>${hint}`;
}

function renderHome() {
  run = null;
  const ph = phase();
  let head, theme, sub, btn;
  if (ph === 'day') {
    const d = DAYS[S.day - 1];
    head = `Section ${S.day} of ${TOTAL_DAYS}`;
    theme = d.title;
    sub = '10 questions. About 10 minutes.';
    btn = `Start Section ${S.day}`;
  } else if (ph === 'review') {
    const n = reviewPile().length;
    head = 'Review';
    theme = `${n} question${n === 1 ? '' : 's'} to go back over`;
    sub = `These are the ones you missed before. ${n > 10 ? '10 at a time.' : ''}`.trim();
    btn = 'Start review';
  } else {
    const st = streak();
    head = st >= READY_STREAK ? 'Ready for the test' : `Practice test ${S.tests.length + 1}`;
    theme = st >= READY_STREAK
      ? `You scored ${READY_SCORE} or better ${READY_STREAK} times in a row.`
      : `30 questions, like the real test. Goal: ${READY_SCORE} or more right.`;
    sub = st >= READY_STREAK
      ? 'You can keep taking practice tests to stay sharp.'
      : `Do this ${READY_STREAK} times in a row and you're ready. ${st ? `So far: ${st} in a row.` : ''} The real test needs 24 to pass.`.trim();
    btn = st >= READY_STREAK ? 'Take another practice test' : 'Start practice test';
  }
  $('stage').innerHTML = `
    <section class="home">
      <h1>${head}</h1>
      <p class="theme">${esc(theme)}</p>
      <p class="sub">${esc(sub)}</p>
      <button class="btn primary" type="button" id="startBtn">${btn}</button>
      ${roadMarkers()}
    </section>`;
  $('startBtn').onclick = () => start();
  document.querySelectorAll('.redo').forEach(b => b.onclick = () => { start(Number(b.dataset.day)); window.scrollTo(0, 0); });
}

function start(redoDay) {
  const ph = redoDay ? 'redo' : phase();
  let qs;
  if (ph === 'redo') qs = shuffle(QS.filter(q => q.day === redoDay));
  else if (ph === 'day') qs = QS.filter(q => q.day === S.day);
  else if (ph === 'review') qs = shuffle(reviewPile()).slice(0, 10);
  else qs = shuffle(QS).slice(0, TEST_LEN);
  run = { kind: ph, dayNum: redoDay || S.day, items: qs.map(q => ({ q, options: shuffle([q.a, ...q.o]), chosen: null })), i: 0, answered: false };
  renderQuestion();
}

function visual(q) { return q.sign ? SIGNS[q.sign] || '' : q.swatch ? SIGNS.swatch(q.swatch) : ''; }

function renderQuestion() {
  const it = run.items[run.i], q = it.q, n = run.items.length, last = run.i === n - 1;
  const L = ['A', 'B', 'C', 'D'];
  const opts = it.options.map((o, k) => {
    let c = 'opt';
    if (run.answered) { if (o === q.a) c += ' right'; else if (o === it.chosen) c += ' wrong'; }
    return `<button type="button" class="${c}" data-k="${k}" ${run.answered ? 'disabled' : ''}><span class="key">${L[k]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const right = it.chosen === q.a;
  const fb = run.answered ? `<div class="feedback"><p class="verdict ${right ? 'good' : 'bad'}">${right ? 'Correct.' : 'Not quite. The answer is: ' + esc(q.a)}</p><p class="why">${esc(q.why)}</p>${q.src ? `<p class="src">Manual, page ${q.p}: “${esc(q.src)}”</p>` : ''}</div>` : '';
  const done = run.i + (run.answered ? 1 : 0);
  $('stage').innerHTML = `
    <div class="home">
      <div class="progress"><span>Question ${run.i + 1} of ${n}</span><div class="bar"><span style="width:${done / n * 100}%"></span></div></div>
      <div class="card">
        ${visual(q) ? `<div class="visual">${visual(q)}</div>` : ''}
        <p class="q">${esc(q.q)}</p>
        <div class="options">${opts}</div>
        ${fb}
      </div>
      ${run.answered ? `<button class="btn primary" type="button" id="nextBtn">${last ? 'See how I did' : 'Next question'}</button>` : ''}
      <button class="link" type="button" id="quitBtn">Stop and come back later</button>
    </div>`;
  if (run.answered) { $('nextBtn').onclick = next; $('nextBtn').focus({ preventScroll: true }); }
  else document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.k)));
  $('quitBtn').onclick = renderHome;
}

function choose(k) {
  if (run.answered) return;
  const it = run.items[run.i];
  it.chosen = it.options[k];
  run.answered = true;
  renderQuestion();
}

function next() {
  if (run.i < run.items.length - 1) { run.i++; run.answered = false; renderQuestion(); window.scrollTo(0, 0); }
  else finish();
}

function finish() {
  const items = run.items, n = items.length;
  items.forEach(it => { S.last[it.q.id] = it.chosen === it.q.a; });
  const right = items.filter(it => it.chosen === it.q.a).length;
  if (run.kind === 'day' || run.kind === 'redo') { S.scores = S.scores || {}; S.scores[run.dayNum] = right; }
  const missed = items.filter(it => it.chosen !== it.q.a);
  const kind = run.kind;
  let title, note;
  if (kind === 'redo') {
    title = `Section ${run.dayNum} done.`;
    note = missed.length ? 'You can try it again, or come back to it another day.' : 'You got every one right.';
  } else if (kind === 'day') {
    title = `Section ${S.day} done.`;
    note = missed.length ? `You can try this section again now, or later from the start screen. The ones you missed also come back in review after Section ${TOTAL_DAYS}.` : 'You got every one right.';
    S.day++;
  } else if (kind === 'review') {
    const left = reviewPile().length;
    title = 'Review set done.';
    note = left ? `${left} left to review. Any you missed come back again.` : 'Review is finished. Next up: practice tests.';
  } else {
    S.tests.push(right);
    const st = streak();
    title = right >= READY_SCORE ? 'Great test.' : right >= 24 ? 'That would pass the real test.' : 'Not at passing yet.';
    note = st >= READY_STREAK ? `That's ${READY_STREAK} in a row at ${READY_SCORE} or better. You're ready for the real test.`
      : right >= READY_SCORE ? `${st} in a row at ${READY_SCORE} or better. ${READY_STREAK - st} more to go.`
      : missed.length ? 'The ones you missed go back into review first, then the next practice test.' : '';
  }
  save();
  const list = missed.map(it => `<li><p class="mq">${esc(it.q.q)}</p><p>Answer: ${esc(it.q.a)}</p></li>`).join('');
  $('stage').innerHTML = `
    <section class="home">
      <p class="score">${right} of ${n}</p>
      <h2>${title}</h2>
      ${note ? `<p class="sub">${esc(note)}</p>` : ''}
      ${missed.length ? `<div class="card"><p class="sub" style="margin:0">Ones to look at:</p><ul class="missed">${list}</ul></div>` : ''}
      ${missed.length && (kind === 'day' || kind === 'redo') ? `<button class="btn" type="button" id="againBtn">Try Section ${run.dayNum} again</button>` : ''}
      <button class="btn primary" type="button" id="homeBtn">Done for today</button>
      ${phase() === 'day' && kind === 'day' ? `<button class="link" type="button" id="moreBtn">Go on to Section ${S.day}</button>` : ''}
    </section>`;
  $('homeBtn').onclick = () => { renderHome(); window.scrollTo(0, 0); };
  const again = run.dayNum;
  if ($('againBtn')) $('againBtn').onclick = () => { start(again); window.scrollTo(0, 0); };
  if ($('moreBtn')) $('moreBtn').onclick = () => { start(); window.scrollTo(0, 0); };
  window.scrollTo(0, 0);
}



document.addEventListener('keydown', e => {
  if (!run) return;
  const k = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
  if (!run.answered && k >= 0) choose(k);
});

// Hidden controls: add #restart or #section5 (any number; 13 = review and tests) to the end of the link.
function confirmRestart() {
  $('stage').innerHTML = `<section class="home"><h2>Start over from Section 1?</h2><p class="sub">This erases all saved progress on this device.</p><button class="btn primary" type="button" id="yes">Yes, start over</button><button class="btn" type="button" id="no">Cancel</button></section>`;
  $('yes').onclick = () => { S = { day: 1, last: {}, tests: [], scores: {} }; save(); history.replaceState(null, '', location.pathname + location.search); renderHome(); };
  $('no').onclick = () => { history.replaceState(null, '', location.pathname + location.search); renderHome(); };
}
function applyHash() {
  const hash = (location.hash || '').toLowerCase();
  const jump = hash.match(/^#(?:day|section)(\d+)$/);
  if (hash === '#restart') return confirmRestart();
  if (jump) { S.day = Math.min(Math.max(1, Number(jump[1])), TOTAL_DAYS + 1); save(); }
  renderHome();
}
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
