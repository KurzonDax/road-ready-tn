<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Ready TN</title>
<meta name="theme-color" content="#181715">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Road Ready">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Self-hosted fonts, Latin subset (see src/fonts/README.md). Overpass is one variable font for 600 to 800. */
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/atkinson-hyperlegible/atkinson-hyperlegible-400.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/atkinson-hyperlegible/atkinson-hyperlegible-700.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-style: normal; font-weight: 600 800; font-display: swap; src: url("fonts/overpass/overpass-variable.woff2") format("woff2"); }
/* Layout: one calm column. Home shows only what's next; a question screen; a short results screen. */
:root {
  /* Dark on every device, whatever its own setting: one calm palette. Warm charcoal, off-white
     type, one muted slate-blue accent, low saturation throughout, for long sessions at night. */
  --bg: #181715;
  --surface: #22201e;
  --ink: #e4e0d9;
  --muted: #ada79f;
  --line: #363330;
  --control-line: #77726c;
  --guide: #8396b3;
  --guide-ink: #141619;
  --guide-soft: #262d38;
  --bad: #dba49b;
  --bad-soft: #3a2624;
  --focus: #dcc69a;
  /* The lesson drawings: road surfaces and markings, cars, glass. Lane lines keep their real colors. */
  --road: #34363a;
  --road-edge: #b9b7b2;
  --lane-yellow: #e0b23c;
  --lane-white: #e6e4df;
  --car-a: #a7adb5;
  --car-b: #6b727b;
  --glass: #d9dde3;
  --font-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
}
::selection { background: var(--guide); color: var(--guide-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > header { align-self: flex-start; }
.plate { align-self: flex-start; margin: 0; background: var(--guide); color: var(--guide-ink); font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; padding: 4px 10px; border-radius: 4px; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 9vw, 48px); }
h2 { font-size: clamp(24px, 6vw, 30px); }
.theme { font-size: 20px; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.small { font-size: 15px; }
.home { display: flex; flex-direction: column; gap: 14px; }

/* Your progress: a plain status track. Every finished section looks the same; scores live in the "See your section scores" panel. */
/* This Set at a glance: one tile per fact asked. */
.strip-wrap { display: flex; flex-direction: column; gap: 10px; }
.strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.tile { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; }
.tile svg { width: 26px; height: 26px; }
.tile.got { background: var(--guide); color: var(--guide-ink); }
.tile.back { border: 2px dashed var(--ink); color: var(--ink); }
.tile.mini { width: 24px; height: 24px; border-radius: 6px; flex: none; }
.tile.mini.back { border-width: 1.5px; }
.tile.mini svg { width: 15px; height: 15px; }
.strip-key { margin: 0; font-size: 15px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; }
.key-item { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .strip .tile { animation: land 420ms cubic-bezier(.16, 1, .3, 1) calc(var(--k) * 70ms) both; }
  @keyframes land { from { opacity: 0; transform: translateY(6px) scale(.9); } to { opacity: 1; transform: none; } }
}
/* The road: one bar of facts learned, Section mile markers, Start to Practice tests. */
.route { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.route-head, .route-ends { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.route-head { font-weight: 700; }
.route-count { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.route-track { position: relative; height: 18px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--control-line); overflow: hidden; }
.route-fill, .route-gain { position: absolute; top: 0; bottom: 0; left: 0; }
.route-fill { background: var(--guide); }
.route-gain { background: #cad4e3; transform-origin: left; }
.route .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bg); opacity: .7; }
.route-ends { font-size: 15px; color: var(--muted); }
.route-ends .open { color: var(--guide); font-weight: 700; }
.route-where { margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .route-gain { animation: grow 900ms cubic-bezier(.16, 1, .3, 1) 250ms both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
}

.scores { border-top: 1.5px solid var(--line); }
.scores > summary { font-weight: 700; color: var(--ink); cursor: pointer; padding: 12px 0; min-height: 44px; list-style-position: inside; }
.scores ul { list-style: none; margin: 0; padding: 0 0 4px; display: flex; flex-direction: column; }
.scores li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.scores li > div { display: flex; flex-direction: column; min-width: 0; flex: 1 1 14rem; }
.scores .sname { font-weight: 700; }
.scores .sscore { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }

.btn { font: inherit; font-weight: 700; font-size: 19px; padding: 16px 18px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
.btn.primary { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.btn.slim { width: auto; font-size: 16px; padding: 10px 14px; min-height: 44px; border-radius: 10px; }
.link { font: inherit; font-size: 16px; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px 8px; min-height: 44px; align-self: center; }
.fine { font-size: 15px; color: var(--muted); margin: 18px 0 0; border-top: 1.5px solid var(--line); padding-top: 14px; }
.fine p { margin: 0; }
.fine .link { font-size: 15px; padding: 10px 0; margin-top: 4px; }

/* Sign-in: one short form, labels above their fields. */
.signin { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-weight: 700; }
.field input { font: inherit; font-size: 19px; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 17px; cursor: pointer; align-self: flex-start; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--guide); }
#signInMsg:empty { display: none; }
.warn { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); color: var(--ink); font-size: 16px; }

.progress { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 16px; }
.bar { flex: 1; height: 8px; border-radius: 999px; background: var(--control-line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--guide); width: 0; }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.q { font-family: var(--font-body); font-size: clamp(21px, 5vw, 25px); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: pretty; }
/* Once answered, the question steps back under the result. */
.q.asked { font-size: 19px; color: var(--muted); }
.visual { display: flex; justify-content: center; }
.visual svg { width: 110px; height: 110px; max-width: 100%; }
.options { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.opt { font: inherit; font-size: 18px; text-align: left; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); margin: 0; }
button.opt { cursor: pointer; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--control-line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.opt .otext { display: flex; flex-direction: column; gap: 2px; }
.opt .tag { font-size: 15px; font-weight: 700; }
.opt.rest { border-color: var(--line); color: var(--muted); }
.opt.rest .key { border-color: var(--line); }
.opt.right { border-color: var(--guide); background: var(--guide-soft); font-weight: 700; }
.opt.right .key { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
/* A wrong pick is marked by its tag and a dashed outline, not an alarm color: the answer is what stands out. */
.opt.wrong { border-style: dashed; border-color: var(--ink); }
.feedback { border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.result { display: flex; flex-direction: column; gap: 6px; }
.later { display: flex; flex-direction: column; gap: 14px; border-top: 1.5px solid var(--line); padding-top: 20px; margin-top: 6px; }
.facts { margin: 0; }
.why, .also, .picked { margin: 0; }
/* After a first look, what was picked leads the screen, as large as the question; in the accent when it was right. */
.outcome { font-family: var(--font-body); font-size: clamp(21px, 5vw, 25px); font-weight: 700; line-height: 1.3; margin: 0; }
.outcome.good { color: var(--guide); }
/* Compare: one row per fact, the fact (and its picture) beside what it means. */
.compare { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.compare li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.compare .cfact { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.compare .cpic { display: block; line-height: 0; }
.compare .cpic svg { width: 48px; height: 48px; }
.rulehead { font-family: var(--font-body); font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--muted); }
.rule { font-size: 20px; line-height: 1.45; margin: 0; }
.back { margin: 0; color: var(--muted); }
/* Lesson drawings: top-down, schematic, on their own slab. Tap targets are real buttons for the keyboard and screen readers. */
.visual .scene, .scene { display: block; width: 100%; height: auto; max-width: 400px; margin: 0 auto; background: #1f1e1c; border-radius: 12px; }
.k-label { font-family: var(--font-body); font-size: 11px; fill: var(--ink); }
.k-sign { font-family: var(--font-display); font-weight: 800; font-size: 5px; fill: #fff; }
.k-plate { font-family: var(--font-display); font-weight: 800; font-size: 4px; fill: #c8323a; }
.k-edge { stroke: var(--road-edge); stroke-width: 2; }
.k-yellow { stroke: var(--lane-yellow); stroke-width: 3; }
.k-white { stroke: var(--lane-white); stroke-width: 3; }
.k-you .k-body { stroke: var(--guide); stroke-width: 2.5; }
.k-hi .k-body, .k-target .k-hi .k-body { stroke: var(--guide); stroke-width: 3.5; }
.k-ring { fill: var(--guide); opacity: .25; }
.k-target { cursor: pointer; }
.k-target:focus { outline: none; }
.k-target:focus-visible .k-body, .k-target:hover .k-body { stroke: var(--focus); stroke-width: 3.5; }
.k-path { stroke: var(--guide); stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; }
/* Only cars and pedestrians are tappable; nothing drawn over them catches the tap. */
.scene :not(.k-target):not(.k-target *) { pointer-events: none; }
.k-target, .k-target * { pointer-events: auto; }
@media (prefers-reduced-motion: no-preference) { .k-flash { animation: blink 1s steps(2, start) infinite; } @keyframes blink { to { opacity: .15; } } }
.say { font-size: 20px; font-weight: 700; line-height: 1.4; margin: 0; }
.src { margin: 0; color: var(--muted); font-size: 16px; }
.src figcaption { font-weight: 700; }
.src blockquote { margin: 4px 0 0; padding-left: 12px; border-left: 3px solid var(--line); }
.link.peek { align-self: flex-start; padding-left: 0; }
#nextBtn { position: sticky; bottom: 16px; box-shadow: 0 8px 20px -8px rgb(8 7 6 / .5); }

.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 6vw, 30px); line-height: 1.2; margin: 0; font-variant-numeric: tabular-nums; }
.missed { border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); padding: 0 22px; }
.missed > summary { font-weight: 700; cursor: pointer; padding: 14px 0; min-height: 44px; }
.missed ul { list-style: none; margin: 0; padding: 0 0 18px; display: flex; flex-direction: column; gap: 14px; }
.missed li { border-top: 1.5px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.missed p { margin: 0; }
.missed .mq { font-weight: 700; }
.missed .mwhy { color: var(--muted); font-size: 16px; }

/* The one moment that breaks the template: a full plate in the accent, with an inset border. */
.sign { background: var(--guide); color: var(--guide-ink); border-radius: 16px; padding: 28px 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 6px var(--guide), inset 0 0 0 9px var(--guide-ink); }
.sign h1, .sign h2 { color: inherit; }
.sign h1 { font-size: clamp(38px, 10vw, 56px); }
.sign p { margin: 0; font-size: 20px; }

.stopped { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); }
.stopped p { margin: 0; }
.streak { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ticks { display: flex; gap: 6px; }
.ticks span { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--control-line); background: var(--surface); }
.ticks span.on { background: var(--guide); border-color: var(--guide); }

/* The Helper's view: a list of Learners, and one Learner's page in plain parts, top to bottom. Long names and answers wrap instead of widening the page. */
.helper, .helper button { overflow-wrap: anywhere; }
.learners { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lrow { font: inherit; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); cursor: pointer; }
.lrow .lname { font-weight: 700; font-size: 20px; }
.lrow .lwhen { color: var(--muted); font-size: 16px; }
.link.top { align-self: flex-start; padding-left: 0; }
.helper .now { display: flex; flex-direction: column; gap: 4px; }
.helper .now p, .part p { margin: 0; }
.part { border-top: 1.5px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.part h2 { font-size: 22px; }
.part ul { list-style: none; margin: 0; padding: 0; }
.part > ul > li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.part > ul > li:first-child { border-top: 0; padding-top: 0; }
.sections summary { cursor: pointer; min-height: 44px; }
.sections .sname, .when, .mq { font-weight: 700; }
.sections .sscore { display: block; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.part .sets { padding: 6px 0 4px 22px; font-size: 16px; display: flex; flex-direction: column; gap: 4px; }
.missedmost .mpage, .missedmost .mcount, .facts .mcount { color: var(--muted); font-size: 16px; }
.facts li { padding: 8px 0; border-top: 1px solid var(--line); }
.facts .leech { font-weight: 700; }
/* Managing a Learner: plain buttons at the bottom of their page; each action asks first on a screen of its own. */
.note { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--guide-soft); color: var(--ink); font-size: 16px; }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.bad.primary { background: var(--bad); color: var(--surface); }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.field select { font: inherit; font-size: 19px; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); width: 100%; }
#formMsg:empty { display: none; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="wrap">
  <header><p class="plate">Road Ready TN</p></header>
  <main id="stage"></main>
  <p id="announce" class="vh" aria-live="polite"></p>
</div>

<script>
// Sign colors are sampled from the drawings on page 36 of the manual.
const SIGNS = {
  octagon: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#ef3d42" stroke="#fff" stroke-width="4"/></svg>',
  triangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="4,10 96,10 50,92" fill="#ef3d42"/><polygon points="20,20 80,20 50,73" fill="#fff"/></svg>',
  circle: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#fadc12" stroke="#231f20" stroke-width="3"/><line x1="22" y1="22" x2="78" y2="78" stroke="#231f20" stroke-width="6"/><line x1="78" y1="22" x2="22" y2="78" stroke="#231f20" stroke-width="6"/></svg>',
  crossbuck: '<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#231f20" stroke-width="3"/></g><g transform="rotate(-45 50 50)"><rect x="6" y="40" width="88" height="20" rx="2" fill="#fff" stroke="#231f20" stroke-width="3"/></g></svg>',
  diamond: '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 96,50 50,96 4,50" fill="#fbdc10" stroke="#231f20" stroke-width="3"/></svg>',
  rectangle: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="20" y="6" width="60" height="88" rx="4" fill="#fff" stroke="#231f20" stroke-width="3"/><rect x="30" y="20" width="40" height="6" fill="#231f20"/><rect x="30" y="36" width="40" height="6" fill="#231f20"/><rect x="34" y="56" width="32" height="24" fill="#231f20"/></svg>',
  swatch: c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="80" height="56" rx="6" fill="${c}" stroke="#555" stroke-width="2"/></svg>`
};
let DAYS = [], QS = [], TOTAL_DAYS = 0, BY_ID = {}; // filled from questions.json when the page starts
let GROUPS = [], GROUP_BY_ID = {}; // the groups of easily mixed-up facts (data/groups.json), likewise
// Each fact's wordings, from questions.json: its own question first, then the other wordings in id order.
let WORDINGS = {};
let LESSONS = {}, LESSON_STEP = {}; // lessons by Section (data/lessons), and each fact's first lesson step {section, k}
// The learning engine (docs/specs/learning-engine.md, docs/adr/0002-*). Every rule below reads these.
const HOUR = 60 * 60 * 1000;
const FIRST_LOOK = true;          // a new fact starts with an unscored question; false starts with its rule screen
const COUNTED_TARGET = 10;        // counted questions in a Set, at most
const NEW_PER_SET = 5;            // new facts in a Set, at most
const MIN_SET = 5;                // a Set with fewer counted questions is filled with not-yet-due facts (GAP + 1)
const GAP = 4;                    // screens for other facts between a fact's rule screen and its counted question, at least
const RE_ASK_GAP = 3;             // question screens for other facts between a wrong counted answer and its re-ask
const RE_ASK_CAP = 4;             // re-asks in one Set, at most
const SPACING_MS = 12 * HOUR;     // two right answers count as separate successes only this far apart
const LADDER_MS = [12 * HOUR, 48 * HOUR]; // after the first and second spaced success, how long until due again
const MAINTENANCE_MS = 7 * 24 * HOUR;     // a solid fact is due again after this long
const LEECH_WRONG = 6;            // wrong counted answers after which the Helper's view flags the fact
const TEST_LEN = 30, READY_SCORE = 27, READY_STREAK = 3, PASS_SCORE = 24;
// The device copy of the signed-in Learner, saved under `rrtn-learner-<account id>`:
// {records: what the server last handed back, pending: finished Sets not yet stored on the
// server, unfinished: the Set on screen, so leaving the page doesn't lose answers, rejected:
// records the server refused as badly shaped, kept aside so they don't hold back the others}.
let copy = null, copyFor = null; // the copy, and the account id it belongs to
const copyKey = id => `rrtn-learner-${id}`;
// The saved state from before accounts. The page only reads it, for the one-time import; it never writes or deletes it.
const OLD_KEY = 'tn-permit-daily-v1';
// Set once this device has made an Imported record. It belongs to the device, not to a Learner, so
// it outlasts sign-out and only the first Learner to sign in here gets the import (decision #7).
const IMPORTED_KEY = 'rrtn-old-progress-imported';

  const ticks = DAYS.slice(1).map((_, k) => `<span class="tick" style="left:${pct((k + 1) * total / DAYS.length)}"></span>`).join('');
  const where = isReady ? 'You are Ready for the test.' : next !== undefined ? `New questions come from Section ${next}: ${DAYS[next - 1].title}.`
    : open ? 'You have learned every question. Practice tests are open to you.' : '';
  return `<section class="route" aria-label="You have learned ${l} of the ${total} questions.">
      <div class="route-head" aria-hidden="true"><span>Questions learned</span><span class="route-count">${l} of ${total}</span></div>
      <div class="route-track" aria-hidden="true">
        <span class="route-fill" style="width:${pct(was)}"></span>
        ${l > was ? `<span class="route-gain" style="left:${pct(was)};width:${pct(l - was)}"></span>` : ''}
        ${ticks}
      </div>
      <div class="route-ends" aria-hidden="true"><span>Start</span><span class="${isReady || open ? 'open' : ''}">${isReady ? 'Ready for the test' : 'Practice tests'}</span></div>
      ${where ? `<p class="sub small route-where">${esc(where)}</p>` : ''}
    </section>`;
}

function sectionsPanel() {
  const rows = DAYS.map(d => {
    const facts = sectionFacts(S, d.day), solid = facts.filter(isSolid).length;
    return `<li><div><span class="sname">Section ${d.day}: ${esc(d.title)}</span><span class="sscore">You have learned ${facts.filter(isLearned).length} of its ${facts.length} questions.${solid ? ` ${solid} of them ${solid === 1 ? 'is' : 'are'} solid.` : ''}</span></div></li>`;
  }).join('');
  return `<details class="scores"><summary>See each section</summary><ul>${rows}</ul></details>`;
}
// How many facts are learned, and solid, said in full; "solid" is explained where it first appears.
function factsLine(p = S) {
  const l = learnedCount(p), s = solidCount(p);
  return `You have learned ${l} of the ${QS.length} questions.` +
    (s ? ` ${s === 1 ? '1 of them is' : `${s} of them are`} solid: you answered ${s === 1 ? 'it' : 'each one'} right 3 times, at least 12 hours apart.` : '');
}
// A Set made of fill facts only: nothing is due and nothing is new.
const fillOnly = plan => !plan.block.length && !plan.due.length && !plan.fresh.length;
// Joins parts as a list a person would say: "a", "a and b", "a, b and c".
const listOf = parts => parts.length < 2 ? parts.join('') : `${parts.slice(0, -1).join(', ')} and ${parts[parts.length - 1]}`;
// The line under "Set N" on the home screen: what the next Set holds, in full sentences.
function planLine(plan) {
  const k = plan.fresh.length, f = plan.fill.length, d = plan.due.length;
  if (!QS.some(q => S.facts[q.id].asked)) return `This set has ${plural(k, 'new question', 'new questions')}. You see them one at a time. There is no time limit.`;
  if (fillOnly(plan)) return `Nothing is due. This set asks ${plural(f, 'question', 'questions')} you already know.`;
  const has = listOf([d ? `${plural(d, 'question', 'questions')} to answer again` : '', f ? `${plural(f, 'question', 'questions')} you already know` : '',
    k ? plural(k, 'new question', 'new questions') : ''].filter(Boolean));
  const block = plan.block.length ? `This set starts by showing ${plan.block.length} answers side by side: ${plan.group.title}.` : '';
  return [block, has ? `${block ? 'Then it has' : 'This set has'} ${has}.` : ''].filter(Boolean).join(' ');
}

// The fine print at the bottom of the Learner's home screen, with a quiet Sign out beside it.
const disclaimer = `<footer class="fine"><p>This is a practice app. It is not made by the State of Tennessee. The questions come from the Tennessee Comprehensive Driver License Manual, July 1, 2022 edition.</p><button class="link" type="button" id="signOutBtn">Sign out</button></footer>`;

function renderHome() {
  run = null; lesson = null;
  const saved = S.run && unpackRun(S.run);
  if (S.run && !saved) { copy.unfinished = S.run = null; saveCopy(); }
  const plan = setPlan(S, Date.now()), open = unlocked(), isReady = ready();
  // "Start a practice test" is the main button only when the next Set would go over known facts alone.
  const testFirst = !saved && open && fillOnly(plan);
  // A Set stopped partway through is one block on the home screen (#32). A daily Set's Continue takes
  // the place of Start the set; a Practice test's comes first, and the other buttons ask before
  // throwing its saved answers away.
  // Once Practice tests are where the Learner is (nothing new is left, or they are Ready), they come
  // first and take the page heading; the next Set follows as a quieter block.
  // A Section's lesson comes before the Set that would first ask about its facts, as the main button.
  const lessonDay = saved ? null : lessonNext(plan), teach = lessonDay && LESSONS[lessonDay];
  const lessonBlock = teach ? `<section class="home"><h1 tabindex="-1">Section ${lessonDay}: ${esc(teach.title)}</h1>
      <p class="sub">A lesson of ${teach.steps.length} steps. On each step you do something first. Then you see what the driver manual says happens, and the rule. The questions on these rules come after, in Set ${S.sets + 1}.</p>
      <button class="btn primary" type="button" id="lessonBtn">Start the lesson</button></section>` : '';
  const testsFirst = open && (testFirst || isReady) && !saved, testsH = testsFirst ? 'h1' : 'h2', setH = testsFirst || teach ? 'h2' : 'h1';
  const set = saved && saved.kind === 'daily'
    ? `<h1 tabindex="-1">Set ${saved.number}</h1>${stoppedLine(saved)}`
    : `<${setH} tabindex="-1">Set ${S.sets + 1}</${setH}>${saved ? stoppedLine(saved) : ''}<p class="sub">${esc(planLine(plan))}</p>
      <button class="btn${saved || testFirst || teach ? '' : ' primary'}" type="button" id="startBtn">Start Set ${S.sets + 1}</button>`;
  const scores = S.tests.slice(-5);
  const tests = !open ? '' : `<section class="home">
      ${isReady ? `<div class="sign"><${testsH} tabindex="-1">Ready for the test</${testsH}><p>You got ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row.</p></div>`
        : `<${testsH} tabindex="-1">Practice tests</${testsH}><p class="sub">To pass the real test, you need ${PASS_SCORE} or more right out of ${TEST_LEN}. You are Ready for the test when you get ${READY_SCORE} or more right on ${READY_STREAK} practice tests in a row.</p>`}
      ${scores.length ? `<p class="sub">${scores.length === 1 ? 'Your last practice test' : `Your last ${scores.length} practice tests, oldest first`}: ${scores.join(', ')} right out of ${TEST_LEN}.</p>` : ''}
      ${saved && saved.kind === 'test' ? '' : `<button class="btn${testFirst ? ' primary' : ''}" type="button" id="testBtn">${isReady ? 'Take another practice test' : 'Start a practice test'}</button>`}
    </section>`;
  paint(`
    <section class="home">
      ${testsFirst ? tests : ''}
      ${lessonBlock}
      ${testsFirst || teach ? `<div class="later">${set}</div>` : set}
      ${canSave ? '' : '<p class="warn">This browser is not keeping a copy of your answers on this device. If you close this page while offline, answers not yet saved will be lost.</p>'}
      ${testsFirst ? '' : tests}
      ${route()}
      ${lessonsPanel()}
      ${sectionsPanel()}
      ${disclaimer}
    </section>`, 'h1');
  onHome = true;
  if ($('startBtn')) $('startBtn').onclick = () => startOver(saved, 'daily');
  if ($('lessonBtn')) $('lessonBtn').onclick = () => { startLesson(lessonDay); toTop(); };
  wireLessons();
  if ($('testBtn')) $('testBtn').onclick = () => startOver(saved, 'test');
  if (saved) {
    $('resumeBtn').onclick = () => { run = saved; renderScreen(); };
    $('overBtn').onclick = () => { dropUnfinished(); start(saved.kind); };
  }
  $('signOutBtn').onclick = () => confirmSignOut(renderHome);
}

// What the Learner was doing in a Set stopped partway through, for a sentence ("You stopped partway through …").
const doing = saved => saved.kind === 'daily' ? `Set ${saved.number}` : 'a practice test';
// Every answered question screen, first looks included: what starting over clears.
const answeredSoFar = saved => saved.screens.filter(s => isQuestion(s) && s.chosen !== null).length;
// The questions the Learner is counted on: counted questions and re-asks, not first looks.
const scoredScreens = r => r.screens.filter(s => s.kind === 'counted' || s.kind === 'reask');
function stoppedLine(saved) {
  const scored = scoredScreens(saved), done = scored.filter(s => s.chosen !== null).length;
  const again = saved.kind === 'daily' ? `Start Set ${saved.number} again from the beginning` : 'Start the practice test again from the beginning';
  return `<div class="stopped">
      <p>You stopped partway through ${doing(saved)}. You answered ${done} of its ${scored.length} questions. Your answers are saved.</p>
      <button class="btn primary" type="button" id="resumeBtn">Continue where I stopped</button>
      <button class="link" type="button" id="overBtn">${again}. Your answers in it will be cleared.</button>
    </div>`;
}
function dropUnfinished() { copy.unfinished = S.run = null; saveCopy(); }

// Starts a daily Set or a Practice test (`kind`). With answers saved in a Set stopped partway
// through, it asks first and says that those answers will be cleared.
function startOver(saved, kind) {
  if (!saved || !answeredSoFar(saved)) { if (saved) dropUnfinished(); return start(kind); }
  const what = kind === 'test' ? 'a practice test' : `Set ${S.sets + 1}`;
  paint(`
    <section class="home">
      <h2 tabindex="-1">Start ${what}?</h2>
      <p class="sub">You stopped partway through ${doing(saved)}. If you start ${what} now, the answers you gave there will be cleared. They will not count.</p>
      <button class="btn primary" type="button" id="newSetYes">Yes, start ${what}</button>
      <button class="btn" type="button" id="newSetNo">No, go back</button>
    </section>`, 'h2');
  toTop();
  $('newSetNo').onclick = () => { renderHome(); toTop(); };
  $('newSetYes').onclick = () => { dropUnfinished(); start(kind); };
}

// A daily Set is built from the records (buildSet); a Practice test is 30 of the 120, shuffled.
function start(kind) {
  const screens = kind === 'test'
    ? shuffle(QS).slice(0, TEST_LEN).map(q => ({ kind: 'counted', id: q.id, format: 'choice', options: shuffle([q.a, ...q.o]), chosen: null, at: null }))
    : buildSet(S, Date.now());
  const change = latestChange(copyRecords());
  run = { kind, set_id: crypto.randomUUID(), started_at: new Date().toISOString(), after: change && change.id,
    number: S.sets + 1, group: (screens.find(s => s.kind === 'contrast') || {}).group ?? null, i: 0, answered: false, reasks: 0, screens };
  keepRun();
  renderScreen();
}

function visual(q) { return q.sign ? SIGNS[q.sign] || '' : q.swatch ? SIGNS.swatch(q.swatch) : ''; }
const quitLink = '<button class="link" type="button" id="quitBtn">Stop for now and save my place</button>';
function wireQuit() { $('quitBtn').onclick = () => { keepRun(); renderHome(); window.scrollTo(0, 0); }; }

// The line above every screen of a Set: what kind of screen it is, and a bar of the counted
// questions and re-asks answered so far, so it never looks full while questions are left.
function progressLine() {
  const s = run.screens[run.i], counted = run.screens.filter(x => x.kind === 'counted'), scored = scoredScreens(run);
  const done = scored.filter(x => x.chosen !== null).length, n = counted.indexOf(s) + 1;
  const where = run.kind === 'test' ? `Practice test: question ${n} of ${counted.length}`
    : `Set ${run.number}: ${s.kind === 'counted' ? `question ${n} of ${counted.length}` : s.kind === 'first_look' ? 'a new question'
      : s.kind === 'reask' ? 'a question from earlier' : s.kind === 'contrast' ? 'answers side by side' : 'the answer'}`;
  return `<div class="progress"><span>${where}</span><div class="bar" aria-hidden="true"><span style="width:${done / scored.length * 100}%"></span></div></div>`;
}

function renderScreen() {
  const kind = run.screens[run.i].kind;
  return kind === 'rule' ? renderRule() : kind === 'contrast' ? renderCompare() : renderQuestion();
}

// A group's Compare screen: its easily mixed-up facts side by side, before the questions on them.
function renderCompare() {
  const g = GROUP_BY_ID[run.screens[run.i].group];
  const rows = g.facts.map(f => {
    const q = BY_ID[f.id];
    return `<li><div class="cfact">${visual(q) ? `<span class="cpic">${visual(q)}</span>` : ''}<span>${esc(f.label)}</span></div>` +
      `<div class="cmeans">${esc(f.means || q.a)}</div></li>`;
  }).join('');
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        <h1 class="q" id="compareHead" tabindex="-1">${esc(g.title)}</h1>
        <p class="sub">These ${g.facts.length} answers are easy to confuse with each other. Here they are side by side. The questions on them come next.</p>
        <ul class="compare">${rows}</ul>
      </div>
      <button class="btn primary" type="button" id="compareGoBtn">Go on to the questions</button>
      ${quitLink}
    </div>`, '#compareHead');
  $('compareGoBtn').onclick = () => { toTop(); next(); };
  wireQuit();
}

// A new fact's answer and its explanation. It comes once, right after the fact's first look, and
// leads with the result of that look; the fact's counted question comes later in the Set.
function renderRule() {
  const s = run.screens[run.i], q = BY_ID[s.id], prev = run.screens[run.i - 1];
  const look = prev && prev.kind === 'first_look' && prev.id === s.id ? prev : null;
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        ${!look ? '<h1 class="outcome" id="ruleHead" tabindex="-1">Read this first.</h1>'
          : look.chosen === q.a ? `<h1 class="outcome good" id="ruleHead" tabindex="-1">You picked the right answer: ${esc(q.a)}.</h1>`
          : `<h1 class="outcome" id="ruleHead" tabindex="-1">The answer is: ${esc(q.a)}.</h1><p class="picked">You picked: ${esc(look.chosen)}. This answer does not count.</p>`}
        ${visual(q) ? `<div class="visual">${visual(q)}</div>` : ''}
        <p class="rule">${esc(q.why)}</p>
        <p class="back">This question comes back later in this set.</p>
      </div>
      <button class="btn primary" type="button" id="ruleGoBtn">Go on</button>
      ${quitLink}
    </div>`, '#ruleHead');
  $('ruleGoBtn').onclick = () => { toTop(); next(); };
  wireQuit();
}

// What an answered counted question or re-ask says, top of the card first: {lead, picked, other,
// back}. `lead` is the result; `picked` says what was picked when it was wrong; `other` names the
// question a wrong choice is the answer to; `back` says when the question comes back.
function feedbackLines(s) {
  const q = asked(s);
  if (isRight(s)) return { lead: `You picked the right answer: ${answerOf(s)}.`, picked: '', other: '', back: '' };
  const other = s.format === 'choice' && q.also && BY_ID[q.also[s.chosen]];
  const reasked = run.kind === 'daily' && s.kind === 'counted' && run.screens.some((x, j) => j > run.i && x.kind === 'reask' && x.id === s.id);
  return { lead: `The answer is: ${answerOf(s)}.`, picked: `You picked: ${s.chosen}.`,
    other: other ? `${s.chosen} is the answer to a different question: ${other.q}` : '',
    back: reasked ? 'This question comes back later in this set, and in your next set.' : 'This question comes back in your next set.' };
}

function renderQuestion() {
  const s = run.screens[run.i], q = asked(s), last = run.i === run.screens.length - 1, right = answerOf(s);
  const L = ['A', 'B', 'C', 'D'];
  const opts = s.options.map((o, k) => {
    if (!run.answered) return `<li><button type="button" class="opt" data-k="${k}" aria-keyshortcuts="${L[k]}"><span class="key">${L[k]}</span><span class="otext">${esc(o)}</span></button></li>`;
    const c = o === right ? 'right' : o === s.chosen ? 'wrong' : 'rest';
    const tag = o === s.chosen ? 'Your answer' : o === right ? 'The answer' : '';
    return `<li class="opt ${c}"><span class="key" aria-hidden="true">${L[k]}</span><span class="otext"><span>${esc(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</span></li>`;
  }).join('');
  const lines = run.answered ? feedbackLines(s) : null;
  // Answered, the result is the first thing on the card; the explanation follows the choices.
  const result = lines ? `<div class="result" id="feedback">
      <h2 class="outcome${isRight(s) ? ' good' : ''}" id="outcome" tabindex="-1">${esc(lines.lead)}</h2>
      ${lines.picked ? `<p class="picked">${esc(lines.picked)}</p>` : ''}
      ${lines.other ? `<p class="also">${esc(lines.other)}</p>` : ''}
    </div>` : '';
  // After a wrong answer on a fact a lesson teaches, its lesson step can be looked at again, without leaving the Set.
  const peek = lines && !isRight(s) && run.kind === 'daily' && LESSON_STEP[s.id] ? '<button class="link peek" type="button" id="peekBtn">See how this works</button>' : '';
  const explain = lines ? `<div class="explain"><p class="why">${esc(q.why)}</p>${lines.back ? `<p class="back">${esc(lines.back)}</p>` : ''}${peek}</div>` : '';
  const above = s.kind === 'first_look' ? '<p class="sub">This is a new question. Pick the answer you think is right. This answer does not count.</p>'
    : s.kind === 'reask' ? '<p class="sub">You saw this question earlier in this set. Here it is again.</p>' : '';
  paint(`
    <div class="home">
      ${progressLine()}
      <div class="card">
        ${result}
        ${above}
        ${visual(q) && s.format !== 'reverse' ? `<div class="visual">${visual(q)}</div>` : ''}
        ${run.answered ? `<p class="q asked" id="qText">${esc(questionText(s))}</p>` : `<h1 class="q" id="qText" tabindex="-1">${esc(questionText(s))}</h1>`}
        <ul class="options" aria-labelledby="qText">${opts}</ul>
        ${explain}
      </div>
      ${run.answered ? `<button class="btn primary" type="button" id="nextBtn">${!last ? 'Next question' : run.kind === 'test' ? 'See my score' : 'See how it went'}</button>` : ''}
      ${quitLink}
    </div>`, run.answered ? '#outcome' : '#qText');
  if (run.answered) $('nextBtn').onclick = next;
  if ($('peekBtn')) $('peekBtn').onclick = () => { peekStep(s.id); toTop(); };
  if (!run.answered) document.querySelectorAll('button.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.k)));
  wireQuit();
}

// After a wrong counted answer at screen `p`, the same fact is asked once more right after the
// RE_ASK_GAPth question screen for another fact (at the end, when fewer are left), at most
// RE_ASK_CAP times a Set. A first look and its rule screen are never split. Returns whether it was.
function insertReask(r, p) {
  if (r.reasks >= RE_ASK_CAP) return false;
  const s = r.screens[p];
  let at = r.screens.length, seen = 0;
  for (let j = p + 1; j < r.screens.length; j++) {
    if (isQuestion(r.screens[j]) && r.screens[j].id !== s.id && ++seen === RE_ASK_GAP) { at = j + 1; break; }
  }
  if (at < r.screens.length && r.screens[at - 1].kind === 'first_look') at++;
  r.screens.splice(at, 0, { kind: 'reask', id: s.id, q: s.q, group: s.group, format: s.format, options: shuffle(s.options), chosen: null, at: null });
  r.reasks++;
  return true;
}

function choose(k) {
  const s = run.screens[run.i];
  if (run.answered || !isQuestion(s)) return;
  s.chosen = s.options[k];
  s.at = new Date().toISOString();
  // A first look is not scored: choosing goes straight on to the fact's answer and explanation.
  if (s.kind === 'first_look') { run.i++; keepRun(); toTop(); return renderScreen(); }
  run.answered = true;
  if (run.kind === 'daily' && s.kind === 'counted' && !isRight(s)) insertReask(run, run.i);
  keepRun();
  toTop();
  renderQuestion();
  const lines = feedbackLines(s);
  $('announce').textContent = [lines.lead, lines.picked, lines.other, asked(s).why, lines.back].filter(Boolean).join(' ');
}

function next() {
  $('announce').textContent = '';
  if (run.i < run.screens.length - 1) { run.i++; run.answered = false; keepRun(); toTop(); renderScreen(); }
  else finish();
}

function finish() {
  const r = run, before = S;
  // The finished Set waits in `pending` until the server has it; Progress is worked out again with it.
  const rec = setRecord(r), mine = copy;
  copy.pending.push(rec);
  copy.unfinished = null;
  saveCopy();
  workOut();
  // Once the server has the finished Set, the unfinished one is cleared there too.
  unfinishedUnsent = true;
  sendPending().then(() => { if (copy === mine && !mine.pending.includes(rec)) sendUnfinished(); });
  run = null;
  // Each fact with a wrong counted answer or re-ask, once, in the wording it was asked.
  const wrong = r.screens.filter(s => (s.kind === 'counted' || s.kind === 'reask') && !isRight(s));
  const missed = [...new Set(wrong.map(s => s.id))];
  const list = missed.map(id => { const s = wrong.find(x => x.id === id), q = asked(s); return `<li><p class="mq">${esc(questionText(s))}</p><p>The answer is: ${esc(answerOf(s))}.</p><p class="mwhy">${esc(q.why)}</p></li>`; }).join('');
  const missedList = missed.length ? `<details class="missed"><summary>See the ${plural(missed.length, 'question', 'questions')} you missed</summary><ul>${list}</ul></details>` : '';
  if (r.kind === 'test') testDone(r, missed, missedList); else setDone(r, before, missed, missedList);
  toTop();
}

// The end of a daily Set: what changed, in full sentences, and what comes next. No score.
// One tile per fact the Set asked, in the order asked: an accent tile with a check when its newest
// answer is right, an outlined tile with a return arrow when it comes back in the next Set.
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const AGAIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 4v4.5H15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setStrip(ids) {
  const got = ids.filter(id => S.facts[id].lastRight !== false).length, back = ids.length - got;
  const tiles = ids.map((id, k) => S.facts[id].lastRight === false ? `<li class="tile back" style="--k:${k}">${AGAIN}</li>` : `<li class="tile got" style="--k:${k}">${CHECK}</li>`).join('');
  return `<div class="strip-wrap">
      <ul class="strip" aria-label="${plural(got, 'question', 'questions')} answered right. ${plural(back, 'question comes', 'questions come')} back in your next set.">${tiles}</ul>
      <p class="strip-key" aria-hidden="true"><span class="key-item"><span class="tile mini got">${CHECK}</span>Answered right</span>${back ? `<span class="key-item"><span class="tile mini back">${AGAIN}</span>Comes back in your next set</span>` : ''}</p>
    </div>`;
}
function setDone(r, before, missed, missedList) {
  const ids = [...new Set(r.screens.filter(isQuestion).map(s => s.id))];
  const learned = ids.filter(id => !isLearned(before.facts[id]) && isLearned(S.facts[id])).length;
  const solid = ids.filter(id => !isSolid(before.facts[id]) && isSolid(S.facts[id])).length;
  const back = ids.filter(id => S.facts[id].lastRight === false).length;
  const lines = [learned ? `You learned the answers to ${plural(learned, 'new question', 'new questions')}.` : '',
    solid ? `${plural(solid, 'question is', 'questions are')} now solid: you answered ${solid === 1 ? 'it' : 'each one'} right 3 times, at least 12 hours apart.` : ''].filter(Boolean);
  const plan = setPlan(S, Date.now()), more = !fillOnly(plan), nextSet = `Start Set ${S.sets + 1}`;
  const buttons = more
    ? `<button class="btn primary" type="button" id="moreBtn">${nextSet}</button><button class="btn" type="button" id="homeBtn">I'm done for now</button>`
    : `<button class="btn primary" type="button" id="homeBtn">I'm done for now</button>${unlocked() ? '<button class="btn" type="button" id="testBtn">Start a practice test</button>' : ''}

// Intervals of [from, to] with every [a, b] in `cuts` taken out: a road's markings stop where another road crosses.

  const line = (at, cls, dash) => spans(from, to, cuts).map(([s, e]) => horizontal
    ? `<line class="${cls}" x1="${s}" y1="${at}" x2="${e}" y2="${at}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`

  else if (c === 'yellow-double') center = line(mid - 2.5, 'k-yellow') + line(mid + 2.5, 'k-yellow');

// Accounts. `me` is the signed-in account ({id, role, name}) or null. Every call to the

async function api(path, opts) {

async function startUp() {

    if (!r.ok) throw new Error('HTTP ' + r.status);
