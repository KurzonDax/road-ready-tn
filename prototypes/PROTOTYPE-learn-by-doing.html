<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PROTOTYPE: learn by doing</title>
<!--
  PROTOTYPE, throwaway. Not part of the app.
  Question it answers: does teaching by doing things on a picture of the road feel like real teaching,
  compared with the app's A-to-D quiz? Three lessons, all facts from the 2022 Tennessee manual:
  parking distances (p. 65), parking on a hill (p. 65), sign shapes and colors (pp. 35-36).
-->
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url("../src/fonts/atkinson-hyperlegible/atkinson-hyperlegible-400.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../src/fonts/atkinson-hyperlegible/atkinson-hyperlegible-700.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-weight: 600 800; src: url("../src/fonts/overpass/overpass-variable.woff2") format("woff2"); }
:root {
  --bg: #111814; --surface: #1a231e; --ink: #e8eee9; --muted: #9db0a4; --line: #2d3a32; --control-line: #66796c;
  --guide: #3f9a6c; --guide-ink: #0c1410; --bright: #8fe0b2; --stop: #f08a80; --stop-soft: rgba(240, 138, 128, .28);
  --asphalt: #2a312d; --lane: #e8eee9; --sidewalk: #3a453f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 "Atkinson Hyperlegible", Verdana, sans-serif; padding: 20px 16px 60px; }
.wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.plate { align-self: flex-start; margin: 0; background: #e8b04a; color: #1a1306; font: 800 12px/1 Overpass, sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 4px; }
h1, h2 { font-family: Overpass, sans-serif; font-weight: 800; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(28px, 6vw, 38px); }
h2 { font-size: clamp(22px, 5vw, 28px); }
p { margin: 0; }
.muted { color: var(--muted); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font: 700 16px/1 inherit; font-family: inherit; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--control-line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; }
.tab[aria-selected="true"] { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.stage { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.prompt { font-size: clamp(20px, 4.6vw, 23px); font-weight: 700; line-height: 1.3; }
.says { font-size: 19px; min-height: 2.6em; }
.says .good { color: var(--bright); font-weight: 700; }
.says .bad { color: var(--stop); font-weight: 700; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 700 18px/1.2 inherit; font-family: inherit; padding: 14px 18px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--bg); color: var(--ink); cursor: pointer; min-height: 48px; }
.btn.primary { background: var(--guide); border-color: var(--guide); color: var(--guide-ink); }
.btn[aria-pressed="true"] { outline: 3px solid var(--bright); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
.dots { display: flex; gap: 6px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--control-line); }
.dots span.done { background: var(--guide); border-color: var(--guide); }
.dots span.now { border-color: var(--bright); border-width: 2.5px; }
/* Signs board */
.board { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--control-line); background: var(--bg); color: var(--ink); font: inherit; text-align: left; cursor: pointer; min-height: 72px; }
.row .slot { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 8px; border: 1.5px dashed var(--line); }
.row .slot svg { width: 52px; height: 52px; }
.row.filled .slot { border-style: solid; border-color: transparent; }
.row .meaning { font-weight: 700; }
.row .meaning small { display: block; font-weight: 400; color: var(--muted); font-size: 15px; }
.row.flash { outline: 3px solid var(--bright); outline-offset: 2px; }
.row.miss { outline: 3px solid var(--stop); outline-offset: 2px; }
.bigsign { display: grid; place-items: center; }
.bigsign svg { width: 150px; height: 150px; }
details.state { font-size: 14px; color: var(--muted); }
details.state pre { white-space: pre-wrap; margin: 6px 0 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="plate">Prototype: learn by doing</p>
  <h1>Learn it on the road, not on a list</h1>
  <p class="muted">Three lessons. Each one teaches with a picture you work with, before any A-to-D question.</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-l="park">Where you may park</button>
    <button class="tab" role="tab" data-l="hill">Parking on a hill</button>
    <button class="tab" role="tab" data-l="signs">Sign shapes and colors</button>
  </div>
  <main id="lesson"></main>
  <details class="state"><summary>Prototype state (what the app would record)</summary><pre id="state"></pre></details>
</div>
<script>
const $ = s => document.querySelector(s);
const log = [];
function record(what) { log.push(`${new Date().toLocaleTimeString()}  ${what}`); $('#state').textContent = log.slice(-14).join('\n'); }
const svgNS = 'http://www.w3.org/2000/svg';

/* ---------- Lesson 1: where you may park ---------- */
// Scale: 1 foot = 6 units. The car is 15 feet long. The car drives along the curb lane toward the object.
const FT = 6, CAR = 15;
const PARK = [
  { id: 'hydrant', name: 'the fire hydrant', rule: 15, at: 80, why: 'Fire trucks need room to reach the hydrant.' },
  { id: 'crosswalk', name: 'the crosswalk', rule: 20, at: 85, why: 'People in the crosswalk must be seen, and must see cars.' },
  { id: 'stop', name: 'the stop sign', rule: 30, at: 90, why: 'Drivers must be able to see the stop sign from far back.' },
  { id: 'rail', name: 'the railroad crossing', rule: 50, at: 105, why: 'Drivers need a clear view of the tracks and the train.' },
];
function objectArt(o, x) {
  // x is the object's near edge in scene units; drawn on the sidewalk or across the road.
  if (o.id === 'hydrant') return `<g><circle cx="${x + 6}" cy="58" r="9" fill="#e5483f" stroke="#fff" stroke-width="2"/><rect x="${x + 2}" y="52" width="8" height="12" rx="2" fill="#b8322b"/></g>`;
  if (o.id === 'crosswalk') { let s = ''; for (let k = 0; k < 6; k++) s += `<rect x="${x}" y="${78 + k * 22}" width="60" height="12" fill="#e8eee9"/>`; return s; }
  if (o.id === 'stop') return `<g><rect x="${x + 4}" y="44" width="4" height="26" fill="#9aa"/><polygon points="${oct(x + 6, 40, 13)}" fill="#ef3d42" stroke="#fff" stroke-width="2"/></g>`;
  // railroad: two rails across the road, and a crossbuck on the sidewalk
  return `<g><rect x="${x}" y="72" width="6" height="140" fill="#8b8f8c"/><rect x="${x + 30}" y="72" width="6" height="140" fill="#8b8f8c"/>
    ${[0,1,2,3,4,5,6].map(k => `<rect x="${x - 6}" y="${76 + k * 20}" width="48" height="6" fill="#5a4636"/>`).join('')}
    <g transform="translate(${x + 18} 50)"><rect x="-16" y="-3" width="32" height="6" fill="#fff" transform="rotate(35)"/><rect x="-16" y="-3" width="32" height="6" fill="#fff" transform="rotate(-35)"/></g></g>`;
}
function oct(cx, cy, r) { return [0,1,2,3,4,5,6,7].map(k => { const a = Math.PI / 8 + k * Math.PI / 4; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(' '); }

function parkLesson() {
  let step = 0, carFt = PARK[0].at - PARK[0].rule - CAR - 20, dragging = false, done = false;
  const L = $('#lesson');
  function draw() {
    const o = PARK[step];
    if (!o) return summary();
    const objX = o.at * FT, carX = carFt * FT, gap = Math.round(o.at - carFt - CAR);
    // Show only the stretch of street around this object, so the picture stays big on a phone.
    const x0 = (o.at - o.rule - CAR - 22) * FT, w = (o.rule + CAR + 34) * FT;
    L.innerHTML = `<section class="stage">
      <div class="dots">${PARK.map((_, k) => `<span class="${k < step ? 'done' : k === step ? 'now' : ''}"></span>`).join('')}</div>
      <p class="prompt">Park the car as close to ${o.name} as the law allows.</p>
      <p class="muted">Drag the car along the curb. Then press Park here.</p>
      <svg viewBox="${x0} 0 ${w} 230" id="scene" aria-label="A street. The car is ${gap} feet from ${o.name}.">
        <rect x="${x0}" y="0" width="${w}" height="70" fill="var(--sidewalk)"/>
        <rect x="${x0}" y="70" width="${w}" height="160" fill="var(--asphalt)"/>
        <rect x="${x0}" y="68" width="${w}" height="4" fill="#b9c2bc"/>
        ${[...Array(30)].map((_, k) => `<rect x="${Math.floor(x0 / 44) * 44 + k * 44}" y="146" width="24" height="3" fill="#d9b44a" opacity=".8"/>`).join('')}
        <rect id="zone" x="${objX - o.rule * FT}" y="74" width="${o.rule * FT}" height="56" fill="var(--stop-soft)" stroke="var(--stop)" stroke-dasharray="6 5" opacity="${done ? 1 : 0}"/>
        <text id="zonelabel" x="${objX - o.rule * FT / 2}" y="30" text-anchor="middle" fill="var(--stop)" font-weight="700" font-size="15" opacity="${done ? 1 : 0}">No parking: ${o.rule} feet</text>
        ${objectArt(o, objX)}
        <g id="car" style="cursor:grab">
          <rect x="${carX}" y="80" width="${CAR * FT}" height="44" rx="10" fill="#4a8fd0" stroke="#cfe4ff" stroke-width="2"/>
          <rect x="${carX + CAR * FT - 26}" y="86" width="16" height="32" rx="4" fill="#cfe4ff" opacity=".7"/>
          <rect x="${carX + 12}" y="86" width="12" height="32" rx="4" fill="#cfe4ff" opacity=".45"/>
        </g>
        <line x1="${carX + CAR * FT}" x2="${objX}" y1="200" y2="200" stroke="#e8eee9" stroke-width="2"/>
        <line x1="${carX + CAR * FT}" x2="${carX + CAR * FT}" y1="192" y2="208" stroke="#e8eee9" stroke-width="2"/>
        <line x1="${objX}" x2="${objX}" y1="192" y2="208" stroke="#e8eee9" stroke-width="2"/>
        <text x="${(carX + CAR * FT + objX) / 2}" y="192" text-anchor="middle" fill="#e8eee9" font-weight="700" font-size="17">${gap} feet</text>
      </svg>
      <p class="says" id="says">${done ? done : ''}</p>
      <div class="btns">${done && done.ok ? '' : `<button class="btn primary" id="parkBtn">Park here</button>`}
        ${done ? `<button class="btn${done.ok ? ' primary' : ''}" id="nextBtn">${done.ok ? (step < PARK.length - 1 ? 'Next place' : 'See all four together') : 'Try again'}</button>` : ''}</div>
    </section>`;
    if (done) $('#says').innerHTML = done.html;
    wire(o);
  }
  function wire(o) {
    const svg = $('#scene'), car = $('#car');
    const vb = svg.viewBox.baseVal;
    const toFt = e => { const r = svg.getBoundingClientRect(); return (vb.x + (e.clientX - r.left) / r.width * vb.width) / FT; };
    let grabAt = 0;
    car.addEventListener('pointerdown', e => { if (done && done.ok) return; dragging = true; grabAt = toFt(e) - carFt; car.setPointerCapture(e.pointerId); });
    const minFt = o.at - o.rule - CAR - 20;
    car.addEventListener('pointermove', e => { if (!dragging) return; carFt = Math.max(minFt, Math.min(o.at - CAR, toFt(e) - grabAt)); done = null; draw(); });
    car.addEventListener('pointerup', () => { dragging = false; });
    // Arrow keys move the car a foot at a time, for anyone not using a pointer.
    svg.tabIndex = 0;
    svg.onkeydown = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { carFt = Math.max(minFt, Math.min(o.at - CAR, carFt + (e.key === 'ArrowRight' ? 1 : -1))); done = null; draw(); $('#scene').focus(); } };
    const park = $('#parkBtn');
    if (park) park.onclick = () => {
      const gap = Math.round(o.at - carFt - CAR);
      if (gap < o.rule) {
        done = { ok: false, html: `<span class="bad">${gap} feet is too close.</span> You may NOT park within ${o.rule} feet of ${o.name}. The red zone is where you may not park.` };
        record(`park ${o.id}: ${gap} ft, too close`);
      } else {
        const extra = gap - o.rule;
        done = { ok: true, html: `<span class="good">Parked ${gap} feet away.</span> ${extra > 3 ? `You could park ${extra} feet closer. ` : ''}You may NOT park within ${o.rule} feet of ${o.name}. ${o.why}` };
        record(`park ${o.id}: ${gap} ft, legal`);
      }
      draw();
    };
    const nx = $('#nextBtn');
    if (nx) nx.onclick = () => { if (done.ok) { step++; if (PARK[step]) carFt = PARK[step].at - PARK[step].rule - CAR - 20; } done = null; draw(); };
  }
  // All four side by side, at the same scale: the picture the learner keeps.
  function summary() {
    const rows = PARK.map((o, k) => `<g transform="translate(0 ${k * 52})">
        <text x="0" y="30" fill="#e8eee9" font-size="17" font-weight="700">${o.name.replace('the ', '').replace(/^./, c => c.toUpperCase())}</text>
        <rect x="200" y="12" width="${o.rule * 9}" height="26" rx="6" fill="var(--stop-soft)" stroke="var(--stop)"/>
        <text x="${208 + o.rule * 9}" y="31" fill="var(--stop)" font-size="17" font-weight="700">${o.rule} feet</text></g>`).join('');
    L.innerHTML = `<section class="stage">
      <p class="prompt">All four, side by side</p>
      <p class="muted">Each red bar is how far you must stay away. The longer the bar, the more room.</p>
      <svg viewBox="0 0 720 210">${rows}</svg>
      <p class="prompt" id="ask">Which one needs the most room? Tap it.</p>
      <div class="btns">${PARK.map(o => `<button class="btn" data-o="${o.id}">${o.name.replace('the ', '').replace(/^./, c => c.toUpperCase())}</button>`).join('')}</div>
      <p class="says" id="says"></p>
      <div class="btns"><button class="btn" id="again">Do this lesson again</button></div>
    </section>`;
    document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const ok = b.dataset.o === 'rail';
      $('#says').innerHTML = ok ? '<span class="good">Yes: the railroad crossing, 50 feet.</span>' : `<span class="bad">Not that one.</span> The railroad crossing needs the most room: 50 feet.`;
      record(`summary: picked ${b.dataset.o}`);
    });
    $('#again').onclick = () => { step = 0; carFt = PARK[0].at - PARK[0].rule - CAR - 20; done = null; draw(); };
  }
  draw();
}

/* ---------- Lesson 2: parking on a hill ---------- */
const HILLS = [
  { id: 'down-curb', title: 'Facing downhill, next to a curb', curb: true, downhill: 'ahead', right: 'right',
    ok: 'The car rolls forward into the curb, and the curb stops it.', why: 'Facing downhill with a curb: turn the front wheels toward the curb (right) and set the parking brake.' },
  { id: 'up-curb', title: 'Facing uphill, next to a curb', curb: true, downhill: 'behind', right: 'left',
    ok: 'The car rolls back, and the back of the front wheel stops against the curb.', why: 'Facing uphill with a curb: turn the front wheels away from the curb (left).' },
  { id: 'no-curb', title: 'On a hill with no curb', curb: false, downhill: 'ahead', right: 'right',
    ok: 'The car rolls off the side of the road, away from traffic.', why: 'With no curb, uphill or downhill: turn the front wheels toward the edge of the road (right).' },
];
function hillLesson() {
  let step = 0, wheels = 'straight', result = null;
  const L = $('#lesson');
  function draw(anim) {
    const h = HILLS[step];
    if (!h) { step = 0; }
    const H = HILLS[step], angle = wheels === 'left' ? -28 : wheels === 'right' ? 28 : 0;
    L.innerHTML = `<section class="stage">
      <div class="dots">${HILLS.map((_, k) => `<span class="${k < step ? 'done' : k === step ? 'now' : ''}"></span>`).join('')}</div>
      <p class="prompt">${H.title}. Which way do you turn the front wheels?</p>
      <p class="muted">Turn the wheels, then let go of the brake and watch what the car does.</p>
      <svg viewBox="0 0 780 260" aria-label="A car parked at the right edge of a road on a hill.">
        <defs><linearGradient id="slope" x1="${H.downhill === 'ahead' ? 0 : 1}" x2="${H.downhill === 'ahead' ? 1 : 0}"><stop offset="0" stop-color="#3a423e"/><stop offset="1" stop-color="#1f2522"/></linearGradient></defs>
        <rect x="0" y="0" width="780" height="200" fill="url(#slope)"/>
        ${[...Array(20)].map((_, k) => `<rect x="${k * 44}" y="70" width="24" height="3" fill="#d9b44a" opacity=".8"/>`).join('')}
        <text x="20" y="32" fill="#e8eee9" font-size="16">Traffic lane</text>
        ${H.curb ? `<rect x="0" y="200" width="780" height="14" fill="#b9c2bc"/><rect x="0" y="214" width="780" height="46" fill="var(--sidewalk)"/><text x="20" y="246" fill="#e8eee9" font-size="15">Curb and sidewalk</text>`
          : `<rect x="0" y="200" width="780" height="60" fill="#4d3f2c"/><text x="20" y="240" fill="#e8eee9" font-size="15">Edge of the road (dirt, no curb)</text>`}
        <text x="${H.downhill === 'ahead' ? 610 : 40}" y="120" fill="#e8eee9" font-size="17" font-weight="700">${H.downhill === 'ahead' ? 'Downhill →' : '← Downhill'}</text>
        <g id="car" transform="translate(330 140)">
          <rect x="-60" y="-24" width="120" height="48" rx="10" fill="#4a8fd0" stroke="#cfe4ff" stroke-width="2"/>
          <rect x="34" y="-18" width="14" height="36" rx="4" fill="#cfe4ff" opacity=".7"/>
          <rect x="-46" y="-30" width="22" height="9" rx="3" fill="#111"/><rect x="-46" y="21" width="22" height="9" rx="3" fill="#111"/>
          <rect x="26" y="-30" width="22" height="9" rx="3" fill="#111" transform="rotate(${angle} 37 -25.5)"/>
          <rect x="26" y="21" width="22" height="9" rx="3" fill="#111" transform="rotate(${angle} 37 25.5)"/>
          <text x="0" y="6" text-anchor="middle" font-size="13" fill="#0c1410" font-weight="700">FRONT →</text>
        </g>
      </svg>
      <div class="btns">
        <button class="btn" data-w="left" aria-pressed="${wheels === 'left'}">Turn wheels left${H.curb ? ' (away from the curb)' : ' (toward the road)'}</button>
        <button class="btn" data-w="straight" aria-pressed="${wheels === 'straight'}">Straight</button>
        <button class="btn" data-w="right" aria-pressed="${wheels === 'right'}">Turn wheels right${H.curb ? ' (toward the curb)' : ' (toward the edge)'}</button>
      </div>
      <p class="says" id="says">${result || ''}</p>
      <div class="btns"><button class="btn primary" id="roll">Let go of the brake</button>${result && result.startsWith('<span class="good">') ? `<button class="btn primary" id="next">${step < HILLS.length - 1 ? 'Next hill' : 'Start again'}</button>` : ''}</div>
    </section>`;
    document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { wheels = b.dataset.w; result = null; draw(); });
    $('#roll').onclick = () => roll(H);
    if ($('#next')) $('#next').onclick = () => { step = (step + 1) % HILLS.length; wheels = 'straight'; result = null; draw(); };
  }
  // Roll the car: forward when downhill is ahead, backward when it is behind. The front wheels steer.
  function roll(H) {
    const car = $('#car'), dir = H.downhill === 'ahead' ? 1 : -1, steer = wheels === 'right' ? 1 : wheels === 'left' ? -1 : 0;
    const good = wheels === H.right;
    // Positive y is toward the curb. Rolling forward with wheels right, or backward with wheels left, swings the front toward the curb.
    const towardCurb = dir * steer;
    const t0 = performance.now(), D = 1400;
    $('#roll').disabled = true;
    function frame(t) {
      const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3);
      let x = 330, y = 140, rot = 0;
      if (good) { x += dir * 50 * e; rot = towardCurb * 14 * e; y += 18 * e; }
      else if (towardCurb < 0) { x += dir * 260 * e; y -= 95 * e; rot = towardCurb * 22 * e; }
      else { x += dir * 420 * e; }
      car.setAttribute('transform', `translate(${x} ${y}) rotate(${rot})`);
      if (k < 1) requestAnimationFrame(frame);
      else {
        result = good ? `<span class="good">${H.ok}</span> ${H.why}`
          : `<span class="bad">The car rolls ${towardCurb < 0 ? 'out into the traffic lane' : 'down the road'}.</span> ${H.why}`;
        record(`hill ${H.id}: wheels ${wheels}, ${good ? 'stopped safely' : 'rolled away'}`);
        $('#says').innerHTML = result;
        $('#roll').disabled = false; $('#roll').textContent = 'Try it again';
        $('#roll').onclick = () => { result = null; draw(); };
        if (good) { const n = document.createElement('button'); n.className = 'btn primary'; n.textContent = step < HILLS.length - 1 ? 'Next hill' : 'Start again'; n.onclick = () => { step = (step + 1) % HILLS.length; wheels = 'straight'; result = null; draw(); }; $('#roll').after(n); }
      }
    }
    requestAnimationFrame(frame);
  }
  draw();
}

/* ---------- Lesson 3: sign shapes and colors ---------- */
const SHAPES = {
  octagon: c => `<polygon points="${oct(50, 50, 44)}" fill="${c}" stroke="#fff" stroke-width="4"/>`,
  triangle: c => `<polygon points="6,12 94,12 50,90" fill="#fff" stroke="${c}" stroke-width="12" stroke-linejoin="round"/>`,
  circle: c => `<circle cx="50" cy="50" r="44" fill="${c}" stroke="#231f20" stroke-width="3"/><line x1="22" y1="22" x2="78" y2="78" stroke="#231f20" stroke-width="7"/><line x1="78" y1="22" x2="22" y2="78" stroke="#231f20" stroke-width="7"/>`,
  diamond: c => `<polygon points="50,4 96,50 50,96 4,50" fill="${c}" stroke="#231f20" stroke-width="3"/>`,
  rectangle: c => `<rect x="20" y="6" width="60" height="88" rx="5" fill="${c}" stroke="#231f20" stroke-width="3"/><rect x="30" y="24" width="40" height="6" fill="#231f20"/><rect x="30" y="40" width="40" height="6" fill="#231f20"/>`,
  plain: c => `<rect x="8" y="22" width="84" height="56" rx="8" fill="${c}" stroke="#555" stroke-width="2"/>`,
};
const sign = (shape, color) => `<svg viewBox="0 0 100 100" aria-hidden="true">${SHAPES[shape](color)}</svg>`;
const SIGN_ROUNDS = [
  { title: 'Shapes', note: 'Every sign shape has one meaning. Put each sign in the row it belongs to.', items: [
    { m: 'Stop', s: 'octagon', c: '#ef3d42', sub: 'Eight sides. Only the stop sign has this shape.' },
    { m: 'Yield', s: 'triangle', c: '#ef3d42', sub: 'A triangle pointing down.' },
    { m: 'A railroad crossing is ahead', s: 'circle', c: '#fadc12', sub: 'Round.' },
    { m: 'A hazard or something unexpected ahead', s: 'diamond', c: '#fbdc10', sub: 'Diamond-shaped: slow down and be careful.' },
    { m: 'A law you must obey', s: 'rectangle', c: '#fff', sub: 'A rectangle: speed limits, lane use.' },
  ] },
  { title: 'Colors', note: 'Every background color has a meaning too. Put each color in its row.', items: [
    { m: 'Warning', s: 'plain', c: '#faee1a', sub: 'Yellow.' },
    { m: 'Construction and maintenance', s: 'plain', c: '#f27423', sub: 'Orange.' },
    { m: 'Directions (guide signs)', s: 'plain', c: '#12a850', sub: 'Green.' },
    { m: 'Services: gas, food, hospitals', s: 'plain', c: '#2a64c9', sub: 'Blue.' },
    { m: 'Parks and recreation', s: 'plain', c: '#7a4a24', sub: 'Brown.' },
    { m: 'School zones and crosswalks', s: 'plain', c: '#c3d53c', sub: 'Fluorescent yellow-green.' },
  ] },
];
function signsLesson() {
  let round = 0, order = [], k = 0, placed = {}, checking = false, answered = null;
  const L = $('#lesson');
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  function begin(r, check) { round = r; checking = check; answered = null; order = shuffle(SIGN_ROUNDS[r].items.slice()); k = 0; placed = check ? Object.fromEntries(SIGN_ROUNDS[r].items.map(i => [i.m, i])) : {}; draw(); }
  function draw(feedback = '') {
    const R = SIGN_ROUNDS[round], cur = answered || order[k];
    const rows = R.items.slice().sort((a, b) => a.m < b.m ? -1 : 1).map(i => {
      const p = placed[i.m] && !checking;
      return `<button class="row${p ? ' filled' : ''}" data-m="${i.m}"><span class="slot">${p ? sign(i.s, i.c) : ''}</span><span class="meaning">${i.m}${p ? `<small>${i.sub}</small>` : ''}</span></button>`;
    }).join('');
    L.innerHTML = `<section class="stage">
      <p class="prompt">${checking ? `Check yourself: ${R.title.toLowerCase()} without the pictures` : `${R.title}: ${R.note}`}</p>
      ${cur ? `<div class="bigsign">${sign(cur.s, cur.c)}</div>${answered ? '' : `<p class="muted" style="text-align:center">What does this ${round === 0 ? 'shape' : 'color'} mean? Tap its row.</p>`}` : `<p class="says"><span class="good">${checking ? 'Done.' : 'The board is complete.'}</span> ${checking ? '' : 'This board is what the signs mean. Next, check yourself without the pictures in the rows.'}</p>`}
      <p class="says" id="says">${feedback}</p>
      <div class="board">${rows}</div>
      <div class="btns">${answered ? '<button class="btn primary" id="nextSign">Next sign</button>' : ''}${!cur ? (checking ? (round === 0 ? '<button class="btn primary" id="go">Go on to colors</button>' : '<button class="btn primary" id="restart">Start again</button>') : '<button class="btn primary" id="check">Check myself</button>') : ''}</div>
    </section>`;
    document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => pick(b));
    if ($('#nextSign')) $('#nextSign').onclick = () => { answered = null; draw(); };
    if ($('#check')) $('#check').onclick = () => begin(round, true);
    if ($('#go')) $('#go').onclick = () => begin(1, false);
    if ($('#restart')) $('#restart').onclick = () => begin(0, false);
  }
  function pick(b) {
    const cur = order[k]; if (!cur || answered) return;
    const ok = b.dataset.m === cur.m;
    record(`signs ${checking ? 'check' : 'learn'} ${SIGN_ROUNDS[round].title.toLowerCase()}: ${cur.s}/${cur.c} → "${b.dataset.m}" ${ok ? 'right' : 'wrong'}`);
    placed[cur.m] = cur; k++; answered = cur;
    const fb = ok ? `<span class="good">Yes. This sign means: ${cur.m}.</span> ${cur.sub}` : `<span class="bad">This sign means: ${cur.m}.</span> ${cur.sub} It is now in its row.`;
    draw(fb);
    const row = document.querySelector(`[data-m="${CSS.escape(cur.m)}"]`);
    if (row) { row.classList.add(ok ? 'flash' : 'miss'); setTimeout(() => row.classList.remove('flash', 'miss'), 900); }
  }
  begin(0, false);
}

const LESSONS = { park: parkLesson, hill: hillLesson, signs: signsLesson };
function open(l) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.l === l));
  record(`open lesson: ${l}`);
  LESSONS[l]();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => open(t.dataset.l));
open('park');
</script>
</body>
</html>
